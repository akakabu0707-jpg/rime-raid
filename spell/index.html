<script>
// ===== コアキーパー寄りの主人公(ドットを置いて描く) =====
// 頭 0-10 行、胴 11-16 行、脚 17-18 行。足元は 19 行目の上端。幅 16。

// 層:脚 → 胴 → 防具(胴) → 頭 → 防具(頭) → 手。手は最後に描くので、外套の上にも出る。
const CPAL={
  '1':'#2e1a1c',h:'#5a3428',H:'#7c4a34',J:'#a06a48',j:'#c99068',      // 髪(暗→明)
  k:'#9a5a48',s:'#d99a7a',S:'#f2c4a2',                                 // 肌

  d:'#3e3a40',c:'#a89a80',C:'#ddd0b2','6':'#f2ead2',                                 // 服
  D:'#5a3a24',G:'#f2c440',g:'#b07a1c',                                 // ベルトと金具
  P:'#3e3b5c',p:'#2a2842',B:'#6a4430',b:'#3e2618',Y:'#9a6a48',         // ズボン、靴
  U:'#f2c4a2',u:'#c98e70',y:'#8a5040',                                 // 手
  v:'#6e6658',w:'#b8ae98',W:'#ece4d0',Z:'#fffaf0',n:'#1c2250',N:'#34428a','7':'#5468b8',A:'#4cc0ad',a:'#2f8a80', // 外套
  F:'#cf5f3f',f:'#8e3a2a',L:'#8a5530',l:'#4e2e1a',                     // 革
  M:'#b8c2d4',m:'#6e7894',T:'#f2f6fb',V:'#12121e',Q:'#c83c48',q:'#7a2230','9':'#f07080','8':'#2e3450',g:'#a8782a',G:'#f2c440',K:'#08080f','3':'#e8fcff','4':'#5fd8f8',r:'#7a1c26',R:'#c0303a', // 鋼、房飾り
};
const RECOLOR={
  none:{},cloak:{U:'#4a4466',u:'#2e2a44',y:'#16142a',T:'#ff8a8a'},
  leather:{C:'#b07040',c:'#7a4a28',d:'#3e2414','6':'#d08a50',U:'#7a4a2c',u:'#5a3420',y:'#2e1a10'},
  plate:{C:'#b0bccf',c:'#7c87a2',d:'#3a4058','6':'#e4eaf4',P:'#7c87a2',p:'#4e5670',B:'#9aa4ba',b:'#4e5670',Y:'#d8e0ec',D:'#4e5670',U:'#c0cadc',u:'#7c87a2',y:'#3a4058'},
};
const HEAD={

"...HJjJJHHHHh...",
"...HJHHhHHhHH...",
"...HHhhSShSSh...",
"...HhSEeSSEeS...",

"....1hHJHh1.....",
"...hHJjjJHHHh...",

"...HJHHhHHHHh...",
"...HHHhHHHhHh...",
"...hHHhHHHhHh...",
"...hHhHHHhHHh...",
"...hhHHhHHhhh...",
"....khhhhhhk....",]};
// 胴(5 行)
const BODY={
down:[
"....dcCssCcd....",
"...d6CCcCCC6d...",
"...dCCCcCCCcd...",
"...dDDDGgDDDd...",
"....dPPPPPPd....",],
side:[
".....dcCssCd....",
"....d6CCcCCC6d..",
"....dcCCcCCCCd..",
"....dDDDDGgDDd..",
".....dPPPPPPd...",],
up:[
"....dcCCCCcd....",
"...d6CCCCCC6d...",
"...dCCCcCCCcd...",
"...dDDDDDDDDd...",
"....dPPPPPPd....",]};
// 脚(2 行。0 = 立ち、1・2 = 歩き)
const LEGS={
down:[["....pPP..PPp....","....YBb..bBY...."],["....YBb..PPp....",".........bBY...."],["....pPP..YBb....","....YBb........."]],
side:[[".....pPP..PPp...",".....bB...YBBb.."],["....pPP....PPp..","...bBb.....YBBb."],[".....pPpPPp.....",".....bBYBBb....."]],
up:null};
LEGS.up=LEGS.down;
// 手(3×2 の手袋。胴の 14-15 行目の横)
const HANDS={
down:[".yUu........uUy.",".yuu........uuy."],
side:[".yUu.......yUUy.",".yuu.......yuuy."],
up:[".yUu........uUy.",".yuu........uuy."]};
// ---- 防具の上に重ねる絵(y はその層の何行目から始まるか) ----
const OVER={
cloak:{
  head:{down:{y:-1,rows:[
".......vw.......",
".....vwWWWv.....",
"....vWWZZWWv....",
"...vWZZWWWWWv...",
"..vWZWWWWWWWwv..",
"..vWwwwwwwwwWv..",
"..vWKKKKKKKKWv..",
"..vWK33KK33KWv..",
"..vWK44KK44KWv..",
"..vwWKKKKKKWwv..",
"...vwWWWWWWwv...",]},
  side:{y:-1,rows:[
"...vw...........",
"...vwWWWv.......",
"...vWWZZWWv.....",
"..vWWZZWWWWv....",
"..vWZWWWWWWWv...",
"..vWWWWwwwwwwv..",

"..nNrRRRRRRrNn..",

"..nN7nNRrN7nNn..",
"..nnNnNNNNnNnn..",]}}},
leather:{
  head:null,
  body:{down:{y:0,rows:[
"....fFFFFFFf....",
"...lLD.....Ll...",
"...l..D.....l...",]},
  side:{y:0,rows:[
".....fFFFFFf....",
"....lL.....Ll...",
"....l.......l...",]},
  up:{y:0,rows:[
"....fFFFFFFf....",
"...lL.fF...Ll...",
"...l...fF...l...",]}}},
plate:{
  head:{down:{y:-3,rows:[
".......99.......",
"......QQ9Q......",
".....qQQQQq.....",
"....8mMgGMm8....",
"...8MTTMgMMm8...",
"..8MTTMMgMMMm8..",

"....8mmmmmm8....",]},
  side:{y:-3,rows:[
"....99..........",
"...Q9QQ.........",

"....8mMMgGm8....",
"...8MTTMMgMm8...",
"..8MTTMMMgMMm8..",

"..8MMMMVVVVVV8..",
"..8MMMMMMVMMV8..",
"..8mMMMMMVMMV8..",
"...8mMMMMMMm8...",
"....8mmmmmm8....",]},
  up:{y:-3,rows:[
".......99.......",
"......QQ9Q......",
".....qQQQQq.....",
"....8mMQqMm8....",
"...8MTTQqMMm8...",
"..8MTTMQqMMMm8..",
"..8MTMMMqMMMm8..",

  body:{down:{y:0,rows:[
".8MTTm8MM8mTTM8.",

};
// ---- 外周を1ドット削る(頭・フード・兜)。下側(首)は削らない ----
function erode(rows){const h=rows.length,w=rows[0].length;
  // 外につながる空き(穴ではない所)を、上と左右の端から塗りつぶして調べる。下側(首)は外としない
  const out=Array.from({length:h},()=>new Array(w).fill(false)),st=[];
  for(let x=0;x<w;x++)if(rows[0][x]==='.')st.push([x,0]);
  for(let y=0;y<h;y++){if(rows[y][0]==='.')st.push([0,y]);if(rows[y][w-1]==='.')st.push([w-1,y]);}
  while(st.length){const [x,y]=st.pop();if(x<0||y<0||x>=w||y>=h||out[y][x]||rows[y][x]!=='.')continue;out[y][x]=true;st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}
  const isOut=(x,y)=>y<0||x<0||x>=w||(y<h&&out[y][x]);
  return rows.map((r,y)=>r.split('').map((c,x)=>c==='.'||c==='Q'||c==='q'?c:([[1,0],[-1,0],[0,-1]].some(([a,b])=>isOut(x+a,y+b))?'.':c)).join(''));}
// ---- 組み立て ----
const FW=20,FH=22,FX=2,FY=3,FOOT=16;   // 足元 = (FX+8, FY+FOOT)
function hexRGB(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
// 動き:ub = 上半身(頭・胴・手)の上下、lv = 脚の形
const ANIMS={
  idle:[{ub:0},{ub:1}],
  walk:[{ub:1,lv:1,ha:-1},{ub:0,lv:0,ha:0},{ub:1,lv:2,ha:1},{ub:0,lv:0,ha:0}],
  atk:[{ub:0}],
  hit:[{ub:1}],
};
function charFrame(armor,dir,anim,i){
  const d=(dir==='left'||dir==='right')?'side':dir,flip=dir==='left',st=ANIMS[anim][i%ANIMS[anim].length];
  const pal=Object.assign({},CPAL,RECOLOR[armor]||{}),ov=OVER[armor]||{};
  const grid=Array.from({length:FH},()=>new Array(FW).fill(null));
  const stamp=(rows,x0,y0)=>{rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const ch=r[x];if(ch==='.')continue;const yy=y0+y,xx=x0+x;if(yy<0||yy>=FH||xx<0||xx>=FW)continue;grid[yy][xx]=ch;}});};
  const ub=st.ub||0;
  stamp(LEGS[d][st.lv||0],FX,FY+14);
  stamp(BODY[d],FX,FY+9+ub);
  if(ov.body&&ov.body[d])stamp(ov.body[d].rows,FX,FY+9+ub+ov.body[d].y);
  stamp(HEAD[d],FX,FY+ub);
  if(ov.head&&ov.head[d])stamp(ov.head[d].rows,FX,FY+ub+ov.head[d].y);
  {const ha=st.ha||0,hr=HANDS[d];stamp(hr.map(r=>r.slice(0,8)+'........'),FX,FY+11+ub+ha);stamp(hr.map(r=>'........'+r.slice(8)),FX,FY+11+ub-ha);}
  const data=new Uint8ClampedArray(FW*FH*4);
  for(let y=0;y<FH;y++)for(let x=0;x<FW;x++){const ch=grid[y][x];if(!ch)continue;const c=hexRGB(pal[ch]||'#ff00ff');const k=(y*FW+x)*4;data[k]=c[0];data[k+1]=c[1];data[k+2]=c[2];data[k+3]=255;}
  // 外側の縁取り:隣の色をうんと暗くした色
  const out=data.slice();
  for(let y=0;y<FH;y++)for(let x=0;x<FW;x++){if(grid[y][x])continue;
    const nb=[[x,y+1],[x,y-1],[x-1,y],[x+1,y]].filter(([a,b])=>a>=0&&b>=0&&a<FW&&b<FH&&grid[b][a]);if(!nb.length)continue;
    const [a,b]=nb[0],c=hexRGB(pal[grid[b][a]]);const k=(y*FW+x)*4;
    out[k]=Math.round(c[0]*.28+6);out[k+1]=Math.round(c[1]*.24+5);out[k+2]=Math.round(c[2]*.3+14);out[k+3]=255;}
  if(flip){for(let y=0;y<FH;y++)for(let x=0;x<FW/2;x++){const a=(y*FW+x)*4,b=(y*FW+FW-1-x)*4;for(let j=0;j<4;j++){const t=out[a+j];out[a+j]=out[b+j];out[b+j]=t;}}}
  return {w:FW,h:FH,data:out};}
// 手の位置(足元からの相対)と色
function handOf(armor,dir){const p={down:[-6,-4],side:[5,-4],right:[5,-4],up:[5,-4],left:[-6,-4]}[dir];const pal=Object.assign({},CPAL,RECOLOR[armor]||{});return {x:p[0],y:p[1],col:pal.U};}



// ===== 敵と物のドット絵(文字の並びで描き、外側に暗い縁取りをつける) =====
function gridImg(rows,pal,opt){opt=opt||{};const h=rows.length,w=Math.max(...rows.map(r=>r.length)),P=1,W=w+P*2,H=h+P*2,data=new Uint8ClampedArray(W*H*4);
  const at=(x,y)=>(y<0||y>=h||x<0||x>=w)?'.':(rows[y][x]||'.');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=at(x,y);if(ch==='.')continue;const c=hexRGB(pal[ch]||'#ff00ff');const k=((y+P)*W+x+P)*4;data[k]=c[0];data[k+1]=c[1];data[k+2]=c[2];data[k+3]=255;}
  if(!opt.noOutline)for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){if(at(x,y)!=='.')continue;const n=[[x,y+1],[x,y-1],[x-1,y],[x+1,y]].find(([a,b])=>at(a,b)!=='.');if(!n)continue;

const FW_=60,FH_=76;
const THEMES={

  tide:{n:'潮だまり',floor:0,path:0,wall:0,en:['crab','crab','gull']},

  market:{n:'市場',floor:2,path:2,wall:1,en:['thief','hound','guard']},
  house:{n:'商館',floor:4,path:2,wall:1,en:['guard','thief','guard']},
  jungle:{n:'密林',floor:6,path:6,wall:2,en:['boar','frog','serpent']},
  river:{n:'川辺',floor:6,path:6,wall:2,en:['frog','serpent','boar']},
  glade:{n:'空き地',floor:7,path:6,wall:2,en:['boar','infected','frog']},
  camp:{n:'不朽派の野営',floor:7,path:6,wall:2,en:['cultist','cultist','infected']},
  deep:{n:'森の奥',floor:6,path:6,wall:2,en:['serpent','boar','infected','frog']},
  hita:{n:'ヒタの寝床',floor:7,path:6,wall:2,en:['boar','serpent','infected']},

const FLOOR_THEMES={1:['cove','cove','tide','street'],2:['cove','tide','dock','street','market'],3:['dock','street','market','house','tide'],4:['street','market','house','house','dock'],6:['house','house','market','street'],7:['house','house','house','market','street']};
function genFloor(d,S){const W=FW_,H=FH_,N=W*H;S=S||{};

  const g=new Uint8Array(N).fill(1),ft=new Uint8Array(N),wt=new Uint8Array(N);const rnd2=Math.random;

    const x0=1+i*cw+1+(rnd2()*Math.max(1,cw-w-2)|0),y0=1+j*ch+2+(rnd2()*Math.max(1,ch-h-3)|0);

  const R=rooms.filter(Boolean);for(const r of R){r.cx=r.x0+(r.w>>1);r.cy=r.y0+(r.h>>1);}
  // 部屋の床
  // なめらかな揺らぎ(粗い升目の乱数を補間)
  const NZ=[];const nzW=Math.ceil(W/5)+2,nzH=Math.ceil(H/5)+2;for(let i=0;i<nzW*nzH;i++)NZ.push(rnd2());
  const noise=(x,y)=>{const fx=x/5,fy=y/5,ix=fx|0,iy=fy|0,tx=fx-ix,ty=fy-iy,sm=t=>t*t*(3-2*t),a=NZ[iy*nzW+ix],b=NZ[iy*nzW+ix+1],c=NZ[(iy+1)*nzW+ix],e=NZ[(iy+1)*nzW+ix+1];const u=sm(tx),v=sm(ty);return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+e*u)*v;};

        for(let n=0;n<1+(rnd2()*2|0);n++){const w=3+(rnd2()*5|0),h=3+(rnd2()*4|0);const side=rnd2()*4|0;let x0,y0;
          if(side===0){x0=r.x0+(rnd2()*(r.w-2)|0);y0=r.y0-h+1;}else if(side===1){x0=r.x0+(rnd2()*(r.w-2)|0);y0=r.y0+r.h-1;}
          else if(side===2){x0=r.x0-w+1;y0=r.y0+(rnd2()*(r.h-2)|0);}else{x0=r.x0+r.w-1;y0=r.y0+(rnd2()*(r.h-2)|0);}
          for(let y=Math.max(by0,y0);y<Math.min(by1,y0+h);y++)for(let x=Math.max(bx0,x0);x<Math.min(bx1,x0+w);x++){set(x,y,0,T.floor);}}}
      // 角を少し欠く

  // つなぐ:隣の升目どうしの木 + 輪を少し
  const at=(i,j)=>rooms[j*CX+i];const edges=[],seen=new Set();const start=at(1,CY-1);

  while(stack.length){const r=stack[stack.length-1];const nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>{let k=1,n=null;while(!n){const ii=r.i+a*k,jj=r.j+b*k;if(ii<0||jj<0||ii>=CX||jj>=CY)break;n=at(ii,jj);k++;}return n;}).filter(n=>n&&!seen.has(n));
    if(!nb.length){stack.pop();continue;}const n=nb[rnd2()*nb.length|0];seen.add(n);edges.push([r,n]);stack.push(n);}
  for(let k=0;k<3;k++){const a=R[rnd2()*R.length|0],b=R[rnd2()*R.length|0];if(a!==b&&Math.abs(a.i-b.i)+Math.abs(a.j-b.j)===1)edges.push([a,b]);}
  const carve=(x,y,f)=>{for(let b=0;b<2;b++)for(let a=0;a<2;a++){const xx=x+a,yy=y+b;if(xx<1||yy<1||xx>=W-1||yy>=H-1)continue;const k=yy*W+xx;if(g[k]===1){g[k]=0;ft[k]=f;}}};
  for(const [a,b] of edges){const f=THEMES[a.th].path===THEMES[b.th].path?THEMES[a.th].path:(rnd2()<.5?THEMES[a.th].path:THEMES[b.th].path);
    // 曲がりくねった道:目的へ寄りつつ、ときどき横へそれる

      const dx=b.cx-x,dy=b.cy-y,ax=Math.abs(dx),ay=Math.abs(dy);let mx=0,my=0;
      if(rnd2()<.22&&ax+ay>4){if(ax>ay){my=lastSide||(rnd2()<.5?-1:1);}else{mx=lastSide||(rnd2()<.5?-1:1);}if(rnd2()<.3)lastSide=-lastSide||1;}
      else if(rnd2()*(ax+ay)<ax)mx=Math.sign(dx);else my=Math.sign(dy);
      const nx=x+mx,ny=y+my;if(nx<2||ny<2||nx>=W-3||ny>=H-3){if(ax)x+=Math.sign(dx);else y+=Math.sign(dy);continue;}x=nx;y=ny;}

  // 崖の縁を崩して自然な形に(建物の壁はまっすぐのまま)

  const rough=[];for(let y=2;y<H-2;y++)for(let x=2;x<W-2;x++){const k=y*W+x;if(g[k]===1&&wt[k]!==1&&nbF(x,y)>=3&&rnd2()<.32+noise(x,y)*.2)rough.push(k);}

    for(let b=-2;b<=2&&!near;b++)for(let a=-2;a<=2;a++){const xx=x+a,yy=y+b;if(xx<0||yy<0||xx>=W||yy>=H)continue;const kk=yy*W+xx;if(g[kk]!==1&&(ft[kk]===2||ft[kk]===4)){near=true;break;}}

    if(T==='cove'){const side=['n','e','w'][rnd2()*3|0];const depth=3+(rnd2()*2|0);

    bright:`precision mediump float;varying vec2 v;uniform sampler2D t;void main(){vec3 c=texture2D(t,v).rgb*2.;float l=max(c.r,max(c.g,c.b));gl_FragColor=vec4(c*smoothstep(.8,1.35,l)*.5,1.);}`,
    blur:`precision mediump float;varying vec2 v;uniform sampler2D t;uniform vec2 d;

function linkModes(M,S){const C=M.car,Pp=S.pay,out=[],sn=S.n;

SP.chain=function(Wd,base,x,y,r,j){let px=x,py=y;const seen=new Set();let d=base.dmg;

      if(e.t>=e.dur)continue;}
    else if(e.k==='nova'){if(!e.done){e.done=true;for(const f of Wd.foes){if(f.dead)continue;if(Math.hypot(f.x-e.x,f.y-6-e.y)<e.r+f.r){Wd.hit(f,e.dmg,e.el,{x:e.x,y:e.y});SP.fire(Wd,e,'impact',f.x,f.y-6,Math.atan2(f.y-e.y,f.x-e.x),f);}}

  for(const f of foes)if(!f.dead&&f.burn>0)L(f.x,f.y-6,22,f.dark?'170,80,230':'255,130,50',.4);
  lg.globalCompositeOperation='source-over';}
let pfxOn=false;
function render(){cx.clearRect(0,0,W,H);cx.fillStyle='#05060f';cx.fillRect(0,0,W,H);
  const tx=clamp(P.x-W/2,-8,AW*TS-W+8),ty=clamp(P.y-H*.62,-20,AH*TS-H+8);cam.x+=(tx-cam.x)*.15;cam.y+=(ty-cam.y)*.15;ox=Math.round(cam.x+(rnd()-.5)*shk*2);oy=Math.round(cam.y+(rnd()-.5)*shk*2);
  cx.drawImage(floorCv,-ox,-oy);
  for(const e of ents)if(e.k==='zone'||e.k==='meteor')drawEnt(e);
  const list=[];for(const o of sec.objs)list.push([o.y,()=>drawSprAt(o.type==='lamp'?spr('lamp',LAMP,OBJ_PAL):crystalSpr(o.seed),o.x,o.y+2)]);
  for(const f of foes)list.push([f.y,()=>drawFoe(f)]);list.push([P.y,drawPlayer]);list.sort((a,b)=>a[0]-b[0]);for(const l of list)l[1]();
  for(const e of ents)if(e.k!=='zone'&&e.k!=='meteor')drawEnt(e);for(const f of fxs)drawFx(f);
  for(const q of parts){cx.globalAlpha=1-q.t/q.life;px(q.x,q.y,q.col);}cx.globalAlpha=1;
  if(!pfxOn&&typeof PFX!=='undefined'){pfxOn=PFX.init();if(pfxOn)PFX.resize(W,H,S);}
  if(pfxOn){lightMap();PFX.setEnabled(true);PFX.draw(cv,lightCv,1);cx.clearRect(0,0,W,H);}
  for(const n of nums){const k=n.t/.8;cx.globalAlpha=k>.6?(1-k)/.4:1;if(n.s){cx.font='8px DotGothic16, monospace';cx.textAlign='center';cx.fillStyle='#0b0a18';cx.fillText(n.s,Math.round(n.x-ox)+1,Math.round(n.y-oy-k*10)+1);cx.fillStyle=n.col;cx.fillText(n.s,Math.round(n.x-ox),Math.round(n.y-oy-k*10));}else drawNum(n.v,n.x-ox,n.y-oy-k*12,n.col);}cx.globalAlpha=1;
  if(joy.on){const x=joy.ox/S,y=joy.oy/S,kx=joy.x/S,ky=joy.y/S;cx.globalAlpha=.28;cx.strokeStyle='#e8fcff';cx.beginPath();cx.arc(Math.round(x)+.5,Math.round(y)+.5,JR/S,0,6.28);cx.stroke();cx.globalAlpha=.45;cx.fillStyle='#e8fcff';cx.beginPath();cx.arc(Math.round(kx),Math.round(ky),5,0,6.28);cx.fill();cx.globalAlpha=1;}}

// ---------- 画面の上の表示 ----------
let hudT=0;
function hud(){const sp=curSpell(),st=staff(),w=weightOf(sp),cap=capOf(save.lv,st),ok=spellOK(sp);
  $('h-spell').innerHTML=`<b>術式 ${save.cur+1}</b> ${spellText(sp)}`;
  $('h-w').innerHTML=`理解 <span class="${ok?'':'bad'}">${w} / ${cap}</span> ・ ${st.n} ・ Lv ${save.lv}${ok?'':'<span class="bad"> ・ 唱えられない</span>'}`;
  document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',+b.dataset.p===save.cur));}
function hudDps(){const s=dmgLog.reduce((a,d)=>a+d[1],0);$('h-dps').textContent=`毎秒の傷 ${Math.round(s/3)} ・ 最大の一撃 ${best}`;}

// ---------- 術式を組む画面 ----------
let edMap=[];
function edOpen(){state='edit';$('ed').classList.remove('hide');edRender();}
function edClose(){state='play';$('ed').classList.add('hide');$('pk').classList.add('hide');persist();hud();}
function edRender(){const sp=curSpell(),st=staff(),w=weightOf(sp),cap=capOf(save.lv,st),md=maxDepthOf(save.lv),dp=depthOf(sp),cn=countOf(sp);edMap=[];
  const why=w>cap?'重すぎる。魔術を外すか、杖・レベルを変える':cn>st.sock?'杖の穴が足りない':dp>md?'結びが深すぎる。レベルを上げる':spellText(sp);
  $('ed-head').innerHTML=`<div class="tabs">${[0,1,2].map(i=>`<button class="tab${i===save.cur?' on':''}" data-ep="${i}">術式 ${i+1}</button>`).join('')}</div>
    <div class="wbar"><div class="wfill${w>cap?' bad':''}" style="width:${Math.min(100,w/cap*100)}%"></div><span>理解 ${w} / ${cap}　穴 ${cn} / ${st.sock}　結びの深さ ${dp} / ${md}</span></div>
    <div class="row2"><button class="chip" data-act="staff">杖：${st.n}</button><label class="lv">Lv <input type="range" min="1" max="15" value="${save.lv}" id="ed-lv"><b>${save.lv}</b></label></div>
    <p class="note${w>cap||cn>st.sock||dp>md?' bad':''}">${why}</p>`;
  $('ed-tree').innerHTML=nodeHTML(sp,0,null,-1,null);
  $('ed-head').querySelectorAll('[data-ep]').forEach(b=>b.onclick=()=>{save.cur=+b.dataset.ep;edRender();});
  $('ed-lv').oninput=e=>{save.lv=+e.target.value;edRender();};
  document.querySelectorAll('#ed [data-act]').forEach(b=>b.onclick=()=>edAct(b.dataset));}
function nodeHTML(n,depth,parent,ki,link){const id=edMap.push({n,parent,ki,depth,link})-1,S=SPELLS[n.s],st=staff(),full=countOf(curSpell())>=st.sock,md=maxDepthOf(save.lv);
  const card=`<div class="sock${depth?'':' main'}"><span class="tag">${depth?'結':'主'}</span><button class="chip spell el-${S.el}" data-act="spell" data-id="${id}">${S.n}</button>
    ${link?`<button class="chip mode" data-act="mode" data-id="${id}">${modeName(SPELLS[parent.s],S,link.m)} ▾</button>`:''}
    ${parent?`<button class="chip del" data-act="del" data-id="${id}">外す</button>`:''}</div>`;
  const kids=link&&link.m==='infuse'?'':n.links.map((l,i)=>nodeHTML(l.n,depth+1,n,i,l)).join('');
  const add=(!link||link.m!=='infuse')&&depth<md&&!full?`<button class="chip link" data-act="add" data-id="${id}">＋${S.n}に結ぶ</button>`:'';
  return `<div class="nd d${Math.min(depth,4)}">${card}${kids}${add}</div>`;}
function pick(title,items,cb){$('pk-t').textContent=title;$('pk-l').innerHTML=items.map((it,i)=>`<button class="pi ${it.cls||''}" data-i="${i}"><b>${it.n}</b><span>${it.d||''}</span><em>${it.w!=null?'理解 '+it.w:''}</em></button>`).join('');
  $('pk').classList.remove('hide');$('pk-l').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{$('pk').classList.add('hide');cb(items[+b.dataset.i].k);edRender();});}
const spellItems=()=>Object.keys(SPELLS).map(k=>({k,n:SPELLS[k].n,d:SPELLS[k].d+'（'+ELEMS[SPELLS[k].el].n+'）',w:SPELLS[k].w,cls:'el-'+SPELLS[k].el}));
// 結び方を、主が変わったときに直す
function fixModes(n){for(const l of n.links){const ms=linkModes(SPELLS[n.s],SPELLS[l.n.s]);if(!ms.find(m=>m.k===l.m))l.m=ms[0].k;if(l.m==='infuse')l.n.links=[];fixModes(l.n);}}
function edAct(ds){const m=edMap[+ds.id],n=m&&m.n;
  if(ds.act==='spell')pick('魔術',spellItems(),k=>{n.s=k;fixModes(curSpell());});
  else if(ds.act==='mode'){const ms=linkModes(SPELLS[m.parent.s],SPELLS[n.s]);pick('結び方',ms.map(x=>({k:x.k,n:x.n,d:x.k==='infuse'?'結んだ魔術の属性を主にうつす。中身は出ない':''})),k=>{m.link.m=k;if(k==='infuse')n.links=[];});}
  else if(ds.act==='del'){m.parent.links.splice(m.ki,1);edRender();}
  else if(ds.act==='add')pick(SPELLS[n.s].n+'に結ぶ魔術',spellItems(),k=>{const ms=linkModes(SPELLS[n.s],SPELLS[k]);const L={m:ms[0].k,n:mkNode(k)};n.links.push(L);
      if(ms.length>1)setTimeout(()=>pick('結び方',ms.map(x=>({k:x.k,n:x.n,d:x.k==='infuse'?'結んだ魔術の属性を主にうつす。中身は出ない':''})),mk=>{L.m=mk;}),0);});
  else if(ds.act==='staff')pick('杖',STAFFS.map(s=>({k:s.id,n:s.n,d:s.d})),k=>{save.staff=k;});}

// ---------- 起動 ----------
$('b-ed').onclick=edOpen;$('b-ed-close').onclick=edClose;$('pk-x').onclick=()=>$('pk').classList.add('hide');
$('b-mode').onclick=()=>setMode((mode+1)%4);
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{save.cur=+b.dataset.p;persist();hud();});
$('b-reset').onclick=()=>{if(confirm('見本の術式に戻しますか？')){save=DEFAULT();persist();hud();if(state==='edit')edRender();}};
setMode(0);hud();
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(state==='play')step(dt);render();hudT-=dt;if(hudT<=0){hudT=.25;hudDps();}requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.__s={P,get foes(){return foes;},get ents(){return ents;},save,setMode,SP,Wd,edOpen,edClose};

</script>
</body></html>
