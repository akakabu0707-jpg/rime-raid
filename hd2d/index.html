// ---- 外周を1ドット削る(頭・フード・兜)。下側(首)は削らない ----
function erode(rows){const h=rows.length,w=rows[0].length;
  // 外につながる空き(穴ではない所)を、上と左右の端から塗りつぶして調べる。下側(首)は外としない
  const out=Array.from({length:h},()=>new Array(w).fill(false)),st=[];
  for(let x=0;x<w;x++)if(rows[0][x]==='.')st.push([x,0]);
  for(let y=0;y<h;y++){if(rows[y][0]==='.')st.push([0,y]);if(rows[y][w-1]==='.')st.push([w-1,y]);}
  while(st.length){const [x,y]=st.pop();if(x<0||y<0||x>=w||y>=h||out[y][x]||rows[y][x]!=='.')continue;out[y][x]=true;st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}
  const isOut=(x,y)=>y<0||x<0||x>=w||(y<h&&out[y][x]);

'use strict';
// ===== 武器を平面の形として、角度ごとにドットへ描く =====

// 握りの位置を原点にし、u = 刃の向き、v = 刃の幅の向き(ドット単位)
function wshape(w){

// 色(基本・影・明るい縁・暗い縁取り)
function wcols(hex){const c=hx(hex),L=(t)=>c.map((v,i)=>Math.round(v+([255,244,214][i]-v)*t)),D=(t)=>[Math.round(c[0]*t*.88),Math.round(c[1]*t*.9),Math.round(c[2]*t+26*(1-t))];

function weapon2d(w,ang,size){size=size||48;const S=wshape(w),N=size*size,cx=size/2,cy=size/2;
  const met=METALS[w.metal]||METALS.iron,BL=wcols(met[0]),BD=wcols(met[1]),GR=wcols(GRIPS[w.grip]||GRIPS.wood),TR=wcols(TRIMS[w.trim]||TRIMS.iron),CR=wcols(w.crystalCol||'#7fd0ef'),TS=wcols(w.tassel||'#a8323e');
  const ca=Math.cos(ang),sa=Math.sin(ang);

  const lit=(-sa*-.6+ca*.8)>0;
  const cls=new Array(N).fill(null);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){const dx=x+.5-cx,dy=-(y+.5-cy);const u=dx*ca+dy*sa,v=-dx*sa+dy*ca,av=Math.abs(v);
    let c=null;const side=(v>0)===lit;
    if(S.kind==='axe'||S.kind==='hammer'){
      if(u>=-S.back&&u<=S.haft&&av<=.95)c=av<.3?GR.l:side?GR.b:GR.s;
      if(u>-S.back-.2&&u<-S.back+1.2&&av<=1.3)c=side?TR.b:TR.s;
      const hu=u-S.haft;
      if(S.head==='axe'||S.head==='double'||S.head==='beard'){
        for(const sg of (S.head==='double'?[1,-1]:[1])){const vv=v*sg;if(vv<.6)continue;const t=Math.min(1,(vv-.6)/(S.hw-.6));

          if(vv<=S.hw+.1&&Math.abs(hu-mid+.5)<=half){const edge=vv>S.hw-1.05;c=edge?(side?BL.l:BL.s):(t<.25?BD.s:(side?BL.b:BL.s));}}

const THEMES={

function genFloor(d,S){const W=FW_,H=FH_,N=W*H;S=S||{};
  for(let tries=0;tries<40;tries++){

  const NZ=[];const nzW=Math.ceil(W/5)+2,nzH=Math.ceil(H/5)+2;for(let i=0;i<nzW*nzH;i++)NZ.push(rnd2());
  const noise=(x,y)=>{const fx=x/5,fy=y/5,ix=fx|0,iy=fy|0,tx=fx-ix,ty=fy-iy,sm=t=>t*t*(3-2*t),a=NZ[iy*nzW+ix],b=NZ[iy*nzW+ix+1],c=NZ[(iy+1)*nzW+ix],e=NZ[(iy+1)*nzW+ix+1];const u=sm(tx),v=sm(ty);return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+e*u)*v;};

          if(side===0){x0=r.x0+(rnd2()*(r.w-2)|0);y0=r.y0-h+1;}else if(side===1){x0=r.x0+(rnd2()*(r.w-2)|0);y0=r.y0+r.h-1;}

function blocked(x,z,r){for(const [ox,oz] of [[-r,-r],[r,-r],[-r,r],[r,r],[0,-r],[0,r],[-r,0],[r,0]]){const tx=Math.floor(x+ox),ty=Math.floor(z+oz);if(!inside(tx,ty))return true;const v=g[K(tx,ty)];if(v===1||v===3)return true;}
  for(const s of solids){const dx=x-s.x,dz=(z-s.z)*1.6;if(dx*dx+dz*dz<(s.r+r)*(s.r+r))return true;}return false;}
function moveBy(o,dx,dz,r){if(!blocked(o.x+dx,o.z,r))o.x+=dx;if(!blocked(o.x,o.z+dz,r))o.z+=dz;}

// ---- 霜の粒 ----
const NM=240,mPos=new Float32Array(NM*3),mVel=[];for(let i=0;i<NM;i++){mPos[i*3]=R()*MW;mPos[i*3+1]=R()*4;mPos[i*3+2]=R()*MH;mVel.push([R()*6.28,.1+R()*.25]);}
const mGeo=new THREE.BufferGeometry();mGeo.setAttribute('position',new THREE.BufferAttribute(mPos,3));
const motes=new THREE.Points(mGeo,new THREE.PointsMaterial({color:0xcfefff,size:2.2,sizeAttenuation:false,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(motes);
// 斬撃・砕けの粒
const sparks=[];const sGeo=new THREE.BufferGeometry(),sPos=new Float32Array(300*3),sCol=new Float32Array(300*3);sGeo.setAttribute('position',new THREE.BufferAttribute(sPos,3));sGeo.setAttribute('color',new THREE.BufferAttribute(sCol,3));
const sPts=new THREE.Points(sGeo,new THREE.PointsMaterial({size:3,sizeAttenuation:false,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));sPts.frustumCulled=false;scene.add(sPts);
function burst(x,y,z,n,col,sp){for(let i=0;i<n&&sparks.length<300;i++){const a=R()*6.28,b=R()*3;sparks.push({x,y,z,vx:Math.cos(a)*sp*(.4+R()),vy:1+R()*b,vz:Math.sin(a)*sp*(.4+R())*.6,t:0,life:.4+R()*.5,c:new THREE.Color(col)});}}

// ---- 後処理:光のにじみ / ミニチュアのぼかし / 周辺減光 ----
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(256,256),.6,.4,.9);composer.addPass(bloom);
const TiltShader={uniforms:{tDiffuse:{value:null},dir:{value:new THREE.Vector2(1,0)},focus:{value:.44},band:{value:.13},amt:{value:2.2}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform vec2 dir;uniform float focus,band,amt;varying vec2 vUv;
    void main(){float d=max(0.,abs(vUv.y-focus)-band);float k=smoothstep(0.,.35,d)*amt;vec2 o=dir*k;vec4 s=vec4(0.);
      s+=texture2D(tDiffuse,vUv-4.*o)*.051;s+=texture2D(tDiffuse,vUv-3.*o)*.0918;s+=texture2D(tDiffuse,vUv-2.*o)*.12245;s+=texture2D(tDiffuse,vUv-o)*.1531;
      s+=texture2D(tDiffuse,vUv)*.1633;s+=texture2D(tDiffuse,vUv+o)*.1531;s+=texture2D(tDiffuse,vUv+2.*o)*.12245;s+=texture2D(tDiffuse,vUv+3.*o)*.0918;s+=texture2D(tDiffuse,vUv+4.*o)*.051;gl_FragColor=s;}`};
const tiltH=new ShaderPass(TiltShader),tiltV=new ShaderPass(TiltShader);composer.addPass(tiltH);composer.addPass(tiltV);
const GradeShader={uniforms:{tDiffuse:{value:null},aspect:{value:1}},vertexShader:TiltShader.vertexShader,
  fragmentShader:`uniform sampler2D tDiffuse;uniform float aspect;varying vec2 vUv;void main(){vec4 c=texture2D(tDiffuse,vUv);vec2 q=(vUv-.5)*vec2(aspect,1.);float v=smoothstep(.95,.25,length(q)*1.05);
    vec3 col=c.rgb;float l=dot(col,vec3(.299,.587,.114));col=mix(vec3(l),col,1.12);col=mix(col*vec3(.78,.86,1.08),col,smoothstep(.0,.5,l));col*=mix(.42,1.,v);gl_FragColor=vec4(col,c.a);}`};
const grade=new ShaderPass(GradeShader);composer.addPass(grade);composer.addPass(new OutputPass());
let post=true;

// ---- 画面 ----
let VW=1,VH=1;
function resize(){VW=innerWidth;VH=innerHeight;renderer.setSize(VW,VH);composer.setSize(VW,VH);composer.setPixelRatio(quality);camera.aspect=VW/VH;camera.updateProjectionMatrix();
  const w=VW*quality,h=VH*quality;tiltH.uniforms.dir.value.set(1/w,0);tiltV.uniforms.dir.value.set(0,1/h);grade.uniforms.aspect.value=VW/VH;bloom.resolution.set(w/2,h/2);}
addEventListener('resize',resize);resize();
const PITCH=48*Math.PI/180;
function camDist(){const t=Math.tan(camera.fov/2*Math.PI/180);const wantH=Math.max(11.5/camera.aspect,12.5);return wantH/(2*t)*.9;}
const cam={x:P.x,z:P.z};

// ---- 入力 ----
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if([' ','j','z'].includes(e.key.toLowerCase()))attack();});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0;});
const joy={on:false,id:-1,x0:0,y0:0,dx:0,dy:0};const stick=document.getElementById('stick'),knob=document.getElementById('knob');
renderer.domElement.addEventListener('pointerdown',e=>{if(joy.on)return;joy.on=true;joy.id=e.pointerId;joy.x0=e.clientX;joy.y0=e.clientY;joy.dx=joy.dy=0;stick.style.display='block';stick.style.left=e.clientX+'px';stick.style.top=e.clientY+'px';knob.style.transform='translate(-50%,-50%)';});
addEventListener('pointermove',e=>{if(!joy.on||e.pointerId!==joy.id)return;let dx=e.clientX-joy.x0,dy=e.clientY-joy.y0;const l=Math.hypot(dx,dy),M=44;if(l>M){dx*=M/l;dy*=M/l;}joy.dx=dx/M;joy.dy=dy/M;knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;});
const endJoy=e=>{if(e.pointerId!==joy.id)return;joy.on=false;joy.dx=joy.dy=0;stick.style.display='none';};addEventListener('pointerup',endJoy);addEventListener('pointercancel',endJoy);
document.getElementById('atk').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();attack();});
const bPost=document.getElementById('bpost'),bQ=document.getElementById('bq');
bPost.onclick=()=>{post=!post;bPost.textContent=post?'演出 入':'演出 切';};
bQ.onclick=()=>{quality=quality>=1.5?1:Math.min(devicePixelRatio,2);bQ.textContent=quality>=1.5?'画質 高':'画質 低';renderer.setPixelRatio(quality);resize();};
bQ.textContent=quality>=1.5?'画質 高':'画質 低';

function attack(){if(P.atk||P.hitT>0)return;const v={down:-Math.PI/2,up:Math.PI/2,left:Math.PI,right:0}[P.dir];let phi=v;
  if(!E.dead){const dx=E.x-P.x,dz=E.z-P.z;if(dx*dx+dz*dz<6){phi=Math.atan2(-dz,dx);P.dir=Math.abs(dx)>Math.abs(dz)?(dx>0?'right':'left'):(dz>0?'down':'up');}}
  P.atk={phi,t:0,hit:false};}

// ---- 進行 ----
let last=performance.now(),T=0,shake=0,fpsT=0,fpsN=0;const fpsEl=document.getElementById('fps');
function step(dt){T+=dt;
  // 主人公
  let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.dx,mz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.dy;
  const ml=Math.hypot(mx,mz);if(ml>1){mx/=ml;mz/=ml;}
  if(P.hitT>0){P.hitT-=dt;moveBy(P,P.vx*dt,P.vz*dt,.28);P.vx*=.86;P.vz*=.86;}
  else if(ml>.15){const sp=P.atk?1.1:3.6;moveBy(P,mx*sp*dt,mz*sp*dt,.28);if(!P.atk)P.dir=Math.abs(mx)>Math.abs(mz)?(mx>0?'right':'left'):(mz>0?'down':'up');P.ft+=dt*(ml>.6?1:.7);}
  if(P.atk){P.atk.t+=dt/.36;if(!P.atk.hit&&P.atk.t>.3){P.atk.hit=true;
      if(!E.dead){const dx=E.x-P.x,dz=E.z-P.z,d=Math.hypot(dx,dz),fx=Math.cos(P.atk.phi),fz=-Math.sin(P.atk.phi);
        if(d<1.7&&(dx*fx+dz*fz)/(d||1)>-.2){E.hp--;E.flash=.12;E.st='stun';E.t=.32;E.vx=dx/(d||1)*6;E.vz=dz/(d||1)*6;shake=.18;burst(E.x,.5,E.z,14,0xbfefff,2.4);
          if(E.hp<=0){E.dead=3;burst(E.x,.5,E.z,60,0x8fd6f0,3.4);burst(E.x,.5,E.z,20,0xffffff,2);shake=.35;}}}}
    if(P.atk.t>=1)P.atk=null;}
  P.anim=P.hitT>0?'hit':P.atk?'atk':ml>.15?'walk':'idle';P.fi=P.anim==='walk'?(P.ft*8|0)%4:((T*2)|0)%2;if(P.flash>0)P.flash-=dt;
  // 野犬
  if(E.dead){E.dead-=dt;if(E.dead<=0){E.dead=0;E.hp=5;E.st='move';E.cd=1.5;const sp=[[23.5,12.5],[6.5,8.5],[13.5,18.2],[24.5,6.5]];let best=sp[0],bd=0;for(const s of sp){const d=Math.hypot(s[0]-P.x,s[1]-P.z);if(d>bd){bd=d;best=s;}}E.x=best[0];E.z=best[1];burst(E.x,.4,E.z,24,0x8fd6f0,1.5);}}
  else{const dx=P.x-E.x,dz=P.z-E.z,d=Math.hypot(dx,dz)||1;E.cd-=dt;if(E.flash>0)E.flash-=dt;
    if(E.st==='stun'){E.t-=dt;moveBy(E,E.vx*dt,E.vz*dt,.4);E.vx*=.85;E.vz*=.85;if(E.t<=0){E.st='move';E.cd=Math.max(E.cd,.6);}}
    else if(E.st==='move'){if(d>1.1){moveBy(E,dx/d*2.3*dt,dz/d*2.3*dt,.4);}E.anim+=dt*(d>1.1?1:0);E.face=dx>=0?1:-1;if(d<3.4&&E.cd<=0){E.st='wind';E.t=.5;E.dir=Math.atan2(dz,dx);}}
    else if(E.st==='wind'){E.t-=dt;if(E.t<=0){E.st='dash';E.t=.34;}}
    else if(E.st==='dash'){E.t-=dt;E.anim+=dt*2;moveBy(E,Math.cos(E.dir)*8*dt,Math.sin(E.dir)*8*dt,.4);
      if(d<.75&&P.hitT<=0){P.hitT=.3;P.flash=.15;P.vx=Math.cos(E.dir)*7;P.vz=Math.sin(E.dir)*7;P.atk=null;shake=.3;burst(P.x,.6,P.z,10,0xff8a7a,2);}
      if(E.t<=0){E.st='move';E.cd=2+R()*1.2;}}}
  // 灯のゆらぎ
  for(const l of lights){const f=l.kind==='lamp'?(1+Math.sin(T*9+l.ph)*.06+Math.sin(T*23+l.ph*3)*.04+(R()<.02?-.15:0)):(1+Math.sin(T*2+l.ph)*.15);l.L.intensity=l.base*f;l.H.material.opacity=(l.kind==='lamp'?.45:.32)*f;}
  waterU.t.value=T;if(boat)boat.position.y=Math.sin(T*1.6)*.04-.04,boat.rotation.z=Math.sin(T*1.1)*.025;
  // 粒
  for(let i=0;i<NM;i++){const v=mVel[i];mPos[i*3]+=Math.sin(T*.6+v[0])*.12*dt+.08*dt;mPos[i*3+1]-=v[1]*dt;mPos[i*3+2]+=Math.cos(T*.5+v[0])*.08*dt;if(mPos[i*3+1]<0){mPos[i*3+1]=4;mPos[i*3]=P.x+(R()-.5)*22;mPos[i*3+2]=P.z+(R()-.6)*26;}}
  mGeo.attributes.position.needsUpdate=true;
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.t+=dt;if(s.t>s.life){sparks.splice(i,1);continue;}s.vy-=6*dt;s.x+=s.vx*dt;s.y=Math.max(.02,s.y+s.vy*dt);s.z+=s.vz*dt;}
  for(let i=0;i<300;i++){const s=sparks[i];if(s){sPos.set([s.x,s.y,s.z],i*3);const k=1-s.t/s.life;sCol.set([s.c.r*k*1.6,s.c.g*k*1.6,s.c.b*k*1.6],i*3);}else{sPos.set([0,-9,0],i*3);}}
  sGeo.attributes.position.needsUpdate=true;sGeo.attributes.color.needsUpdate=true;sGeo.setDrawRange(0,300);
  shake=Math.max(0,shake-dt);}

function drawSprites(){
  heroX.clearRect(0,0,72,64);drawHuman(36,48,{dir:P.dir,anim:P.anim,fi:P.fi,atk:P.atk,flash:P.flash>0},'cloak',spec,heroX);hero.userData.map.needsUpdate=true;
  hero.position.set(P.x,0,P.z);heroBlob.position.set(P.x,.03,P.z);
  houndM.visible=houndBlob.visible=!E.dead;
  if(!E.dead){houndX.clearRect(0,0,40,30);const i=E.st==='dash'?1+((E.anim*14|0)%2):E.st==='move'?((E.anim*8|0)%3):0,f=houndF[i],flip=E.face<0,wh=E.flash>0||(E.st==='wind'&&((T*14|0)%2===0));
    const img=wh?(flip?f.wl:f.w):(flip?f.l:f.r);const sx=E.st==='wind'?((T*40|0)%2?1:-1):0;houndX.drawImage(img,Math.round(20-img.width/2)+sx,27-img.height+1);houndM.userData.map.needsUpdate=true;
    houndM.position.set(E.x,0,E.z);houndBlob.position.set(E.x,.03,E.z);}
  // 斬撃の当たりに薄い光
}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;step(dt);drawSprites();
  // カメラ
  cam.x+=(P.x-cam.x)*Math.min(1,dt*6);cam.z+=(P.z-cam.z)*Math.min(1,dt*6);
  const tx=THREE.MathUtils.clamp(cam.x,5,MW-5),tz=THREE.MathUtils.clamp(cam.z,4,MH-4.5);const d=camDist();
  const sx=shake>0?(R()-.5)*shake*.5:0,sz=shake>0?(R()-.5)*shake*.5:0;
  camera.position.set(tx+sx,Math.sin(PITCH)*d,tz+Math.cos(PITCH)*d+sz);camera.lookAt(tx+sx,0,tz+sz-.6);
  moon.position.set(P.x+6,14,P.z+9);moon.target.position.set(P.x,0,P.z);
  // 焦点は主人公の高さに合わせる
  const v=new THREE.Vector3(P.x,.6,P.z).project(camera);tiltH.uniforms.focus.value=tiltV.uniforms.focus.value=v.y*.5+.5;
  if(post)composer.render(dt);else renderer.render(scene,camera);
  fpsN++;fpsT+=dt;if(fpsT>.5){fpsEl.textContent=Math.round(fpsN/fpsT)+' fps';fpsN=0;fpsT=0;}
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.__hd={P,E,attack,setPost:v=>{post=v;}};
setTimeout(()=>{const h=document.getElementById('hint');if(h)h.style.opacity=0;},5000);
</script>
