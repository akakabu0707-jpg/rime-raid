    <button class="tb" id="bagb" type="button">リュック</button><button class="tb" id="potb" type="button">薬草</button><button class="tb hide" id="swapb" type="button">入れ替える</button><button class="tb" id="pause" type="button" aria-label="一時停止">II</button>

<script>
'use strict';

// ===== コアキーパー寄りの主人公(ドットを置いて描く) =====
// 頭 0-10 行、胴 11-16 行、脚 17-18 行。足元は 19 行目の上端。幅 16。
// 向き:down = 正面、side = 斜め前(右)、up = 後ろ。左は斜め前の反転。
// 層:脚 → 胴 → 防具(胴) → 頭 → 防具(頭) → 手。手は最後に描くので、外套の上にも出る。
const CPAL={
  '1':'#2e1a1c',h:'#5a3428',H:'#7c4a34',J:'#a06a48',j:'#c99068',      // 髪(暗→明)
  k:'#9a5a48',s:'#d99a7a',S:'#f2c4a2',                                 // 肌
  E:'#4a5a96',e:'#161a3a',X:'#f2f5ff',I:'#2f7ae0',O:'#a9b8e8',i:'#2a56a8',                     // 目:まつ毛・白目・黒目・黒目の明るい所
  d:'#3e3a40',c:'#a89a80',C:'#ddd0b2','6':'#f2ead2',                                 // 服
  D:'#5a3a24',G:'#f2c440',g:'#b07a1c',                                 // ベルトと金具
  P:'#3e3b5c',p:'#2a2842',B:'#6a4430',b:'#3e2618',Y:'#9a6a48',         // ズボン、靴

    if(t==='drift'){g.fillStyle='#3a2a20';g.fillRect(x,y+2,12,3);g.fillStyle='#8a6a4e';g.fillRect(x+1,y+2,10,2);g.fillStyle='#b08a66';g.fillRect(x+2,y+2,6,1);}

    if(t==='root'){g.fillStyle='#3a2a1a';g.fillRect(x,y+2,10,2);g.fillRect(x+3,y+1,2,1);g.fillRect(x+8,y+4,3,1);g.fillStyle='#5a4028';g.fillRect(x+1,y+2,8,1);}
    if(t==='net'){g.strokeStyle='rgba(60,50,40,.8)';g.lineWidth=1;for(let i=0;i<5;i++){g.beginPath();g.moveTo(x+i*5+.5,y);g.lineTo(x+i*5+10.5,y+20);g.stroke();g.beginPath();g.moveTo(x+20-i*5+.5,y);g.lineTo(x+10-i*5+.5,y+20);g.stroke();}}}

  // 奥への門(石のアーチ)

  return c;}

function poisonP(sec){if(!P||P.dead||god)return;const was=P.poison>0;P.poison=Math.max(P.poison||0,sec);if(!was)nums.push({x:P.x,y:P.y-22,v:'毒',t:0,col:'#9ae07a'});}

      else if(e.t<=0){e.st='rec';e.t=.5;}if(e.st==='rec')e.cd=1.6+rnd();}

      if(e.cd<=0&&d<130){e.st='wind';e.t=.55;e.dir=a;e.tx=p.x;e.ty=p.y;tels.push({type:'circ',own:e,x:p.x,y:p.y,r:12,t:.95,dur:.95,at:1});}}
    else if(e.st==='wind'){e.t-=dt;if(e.t<=0){const dx=e.tx-e.x,dy=e.ty-e.y,l=Math.hypot(dx,dy)||1;projs.push({x:e.x,y:e.y-6,vx:dx/l*Math.min(130,l/.4),vy:dy/l*Math.min(130,l/.4),dmg:e.dmg,en:1,life:.42,glob:1,poison:3.5,puddle:1});e.st='rec';e.t=.5;e.cd=2.2+rnd();}}

    else if(e.st==='wind'){e.t-=dt;if(e.t<=0){e.st='dash';e.t=.22;e.hit=0;}}
    else if(e.st==='dash'){e.t-=dt;move(e,Math.cos(e.dir)*260*dt,Math.sin(e.dir)*260*dt);e.face=Math.cos(e.dir)>=0?1:-1;if(!e.hit&&d<e.r+p.r+3){e.hit=1;hurt(e.dmg);poisonP(3);}if(e.t<=0){e.st='back';e.t=.6;e.cd=1.4+rnd();}}

  switch(e.st){
  case 'move':{e.ang=(e.ang||0)+dt*1.3*(e.sd||1);const want=e.spear?34:70;const tx=p.x+Math.cos(e.ang)*want,ty=p.y+Math.sin(e.ang)*want*.8;chase(e,dt,e.spd,Math.atan2(ty-e.y,tx-e.x));

const RESO={
  blade:[[3,'傷 +10%',p=>p.upDmg+=.1],[6,'会心 +10%',p=>p.critUp+=.1]],
  crys:[[3,'礫 +1発',p=>p.shard+=1],[6,'礫の間隔 -40%',p=>p.shardRate=.6]],
  frost:[[3,'遅くする力 +15%',p=>p.slowHit=Math.max(p.slowHit,.3)+.15],[6,'斬撃の2割で凍らせる',p=>p.freezeHit=.2]],
  blood:[[3,'倒すたびHP +2',p=>p.killHeal=2],[6,'回復量 2倍',p=>p.healMul=2]],
  wind:[[3,'足 +10%',p=>p.upMove*=1.1],[6,'攻撃の間隔 -10%',p=>p.upCd*=.9]],
};
function tagCount(p){const c={};for(const k in p.ups){for(const t of POW[k].t)c[t]=(c[t]||0)+p.ups[k];}return c;}
function powerBase(p){Object.assign(p,{upDmg:1,upCd:1,upRange:0,upMove:1,upHp:p.upHpKeep||0,thorn:0,shard:0,roomHeal:0,echo:0,critUp:0,critMul:2,execute:0,shatter:0,resonate:0,slowHit:0,trail:0,brittle:0,winter:0,leechUp:0,lastStand:p.lastStandUsed?0:0,berserk:0,stepIn:0,afterImg:0,shardRate:1,freezeHit:0,killHeal:0,healMul:1});}
// 力を取り直したときに全部計算し直す(重ね順の影響をなくす)
function applyPowers(p){const keepHp=p.hp;const ups=p.ups;powerBase(p);p.upHp=0;
  for(const k in ups){const P0=POW[k];for(let i=0;i<ups[k];i++){p.ups={...ups,[k]:i};if(k==='tough'){p.upHp+=10;}else if(k==='shatter'){p.shatter=i+1;}else if(k==='shield'){p.shieldCd=i>=1?5:8;}else P0.f(p);}}
  p.ups=ups;if(ups.laststand&&!p.lastStandUsed)p.lastStand=1;
  const tc=tagCount(p);p.reso=[];for(const t in RESO)for(const [n,txt,f] of RESO[t])if((tc[t]||0)>=n){f(p);p.reso.push(TAGS[t].n+n+'：'+txt);}
  recalc(p);p.hp=Math.min(p.max,keepHp);}
function offerPowers(p,rare){const pool=[];for(const k in POW){const l=p.ups[k]||0;if(l>=POW[k].max)continue;let w=POW[k].r?(rare?3:1):4;
    // 持っている系統は出やすく(シナジーを組みやすく)
    const tc=tagCount(p);for(const t of POW[k].t)if(tc[t])w+=2;if(l)w+=2;for(let i=0;i<w;i++)pool.push(k);}
  const pick=[];while(pick.length<3&&pool.length){const k=pool[rnd()*pool.length|0];if(!pick.includes(k))pick.push(k);for(let i=pool.length-1;i>=0;i--)if(pool[i]===k)pool.splice(i,1);}return pick;}

// 攻撃:向きを決め、振りの途中で当てる
function startAttack(phi){const s=P.ws;P.atk={phi,t:0,dur:s.dur,hit:false,kind:s.kind};
  const c=Math.cos(phi),sn=-Math.sin(phi);if(Math.abs(sn)>Math.abs(c)*1.1)P.dir=sn>0?'down':'up';else P.dir=c>=0?'right':'left';}
function applyHit(){const s=P.ws,a=P.atk.phi,ox=P.x,oy=P.y-5;let hit=false;const mult=P.atkM;
  for(const e of enemies){if(e.dead)continue;const ex=e.x,ey=e.y-(e.fly?10:4),d=Math.hypot(ex-ox,ey-oy);let ok=false;
    if(s.kind==='spear'){const ax=Math.cos(a),ay=-Math.sin(a),rx=ex-ox,ry=ey-oy,al=rx*ax+ry*ay,pe=Math.abs(-rx*ay+ry*ax);ok=al>-4&&al<s.range+P.upRange+e.r&&pe<5+e.r;}
    else ok=d<=s.range+P.upRange+e.r&&(angDiff(Math.atan2(-(ey-oy),ex-ox),a)<=s.arc/2||d<10);

      if(P.berserk)m*=1+P.berserk*Math.floor((1-P.hp/P.max)*10);if(P.stepIn&&P.moving)m*=1+P.stepIn;
      hitE(e,s.dmg*m*(.9+rnd()*.2),Math.cos(ca),Math.sin(ca),s.kb,cr);hit=true;
      if(P.slowHit&&!e.dead){e.slowT=2;e.slowA=P.slowHit;}if(P.freezeHit&&!e.boss&&!e.dead&&rnd()<P.freezeHit)e.frozen=1;}}
  if(hit&&P.echo&&!P.atk.echo){const ph=a,ec=P.echo;later.push({t:.16,f:()=>{if(!P||P.dead)return;for(const e of enemies){if(e.dead)continue;const ex=e.x,ey=e.y-4,d=Math.hypot(ex-P.x,ey-P.y+5);if(d<=s.range+P.upRange+e.r&&(angDiff(Math.atan2(-(ey-P.y+5),ex-P.x),ph)<=s.arc/2||d<10)){const ca=Math.atan2(ey-P.y+5,ex-P.x);hitE(e,s.dmg*mult*ec,Math.cos(ca),Math.sin(ca),s.kb*.3,false);}}
      fx.push({type:'ring',x:P.x+Math.cos(ph)*10,y:P.y-5-Math.sin(ph)*10,r0:3,r1:12,t:0,dur:.15,col:'#e8e0d0'});}});}
  if(hit){const hv=s.kind==='greatsword'||s.kind==='hammer';hs=Math.max(hs,hv?.08:.035);shake(hv?3:1.6);}}

function chase(e,dt,sp,a){if(e.stuck>0){e.stuck-=dt;a+=e.sd*1.3;}const dx=Math.cos(a)*sp*dt,dy=Math.sin(a)*sp*dt;const bx=e.x,by=e.y;
  if(e.fly){e.x=clamp(e.x+dx,TS+4,SW*TS-TS-4);e.y=clamp(e.y+dy,TS+8,SH*TS-TS-4);return;}
  move(e,dx,dy);if(sp>5&&Math.hypot(e.x-bx,e.y-by)<sp*dt*.3&&e.stuck<=0){e.stuck=.45;e.sd=rnd()<.5?1:-1;}}
function updEnemy(e,dt){const p=P,dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx);e.flash-=dt;if(e.markT>0)e.markT-=dt;if(e.trailHit>0)e.trailHit-=dt;if(e.slowT>0){e.slowT-=dt;if(e.slowT>0)dt*=e.boss?1-(e.slowA||.3)*.5:1-(e.slowA||.3);}if(e.frozen>0){e.frozen-=dt;return;}e.anim+=dt;
  if(e.kind==='iska')return iskaAI(e,dt,d,a);

  if(e.kind==='chief')return chiefAI(e,dt,d,a);
  if(e.kind==='serpent'&&!e.aggro){e.hide=d>=46?1:0;if(e.hide)return;}
  if(e.boss)return bossAI(e,dt,d,a);
  if(e.mini)return miniAI(e,dt,d,a);
  if(e.kx||e.ky){move(e,e.kx*dt,e.ky*dt);const k=Math.pow(.0005,dt);e.kx*=k;e.ky*=k;if(Math.abs(e.kx)<1)e.kx=0;if(Math.abs(e.ky)<1)e.ky=0;}
  if(!e.aggro){if(d<96&&!p.dead){e.aggro=true;e.st='move';e.cd=.35+rnd()*.5;e.alert=.6;}
    else{e.wt-=dt;if(e.wt<=0){e.wt=1.5+rnd()*2.5;e.ang=rnd()*6.28;e.walking=rnd()<.6;}if(e.walking){chase(e,dt,e.spd*.35,e.ang);e.face=Math.cos(e.ang)>=0?1:-1;}return;}}
  if(e.alert>0)e.alert-=dt;
  if(e.st==='move'||e.st==='rec')e.face=dx>=0?1:-1;
  e.cd-=dt;
  if(WOOD_KINDS.has(e.kind)){woodAI(e,dt,d,a);}else switch(e.kind){
  case 'hound':
    if(e.st==='move'){chase(e,dt,e.spd,a);if(d<58&&e.cd<=0){e.st='wind';e.t=.45;e.dir=a;tels.push({type:'line',x:e.x,y:e.y-3,a,len:62,w:8,t:.45,dur:.45,own:e});}}
    else if(e.st==='wind'){e.t-=dt;if(e.t<=0){e.st='dash';e.t=.3;}}
    else if(e.st==='dash'){e.t-=dt;move(e,Math.cos(e.dir)*190*dt,Math.sin(e.dir)*190*dt);if(e.t<=0){e.st='rec';e.t=.45;e.cd=1.5+rnd();}}
    else{e.t-=dt;if(e.t<=0)e.st='move';}
    break;
  case 'gull':
    if(e.st==='move'){e.ang+=dt*.9;const tx=p.x+Math.cos(e.ang)*64,ty=p.y+Math.sin(e.ang)*56;chase(e,dt,e.spd,Math.atan2(ty-e.y,tx-e.x));
      if(e.cd<=0&&d<120){e.st='wind';e.t=.6;e.dir=a;e.len=d+40;tels.push({type:'line',x:e.x,y:e.y-3,a,len:e.len,w:9,t:.6,dur:.6,own:e});}}
    else if(e.st==='wind'){e.t-=dt;if(e.t<=0){e.st='dash';e.t=e.len/175;}}
    else if(e.st==='dash'){e.t-=dt;e.x=clamp(e.x+Math.cos(e.dir)*175*dt,TS+4,SW*TS-TS-4);e.y=clamp(e.y+Math.sin(e.dir)*175*dt,TS+8,SH*TS-TS-4);e.face=Math.cos(e.dir)>=0?1:-1;if(e.t<=0){e.st='move';e.cd=2.2+rnd()*1.2;}}
    break;
  case 'crawler':
    if(e.st==='move'){chase(e,dt,e.spd,a);if(e.cd<=0&&d<140){e.st='wind';e.t=.75;}}
    else if(e.st==='wind'){e.t-=dt;if(e.t<=0){const off=rnd()*6.28;for(let i=0;i<6;i++){const b=off+i*Math.PI/3;projs.push({x:e.x,y:e.y-5,vx:Math.cos(b)*58,vy:Math.sin(b)*58,dmg:7*(1+(pw-1)*.1),en:1,life:4});}e.st='rec';e.t=.5;e.cd=3+rnd();}}

  case 'crab':

    else if(e.st==='spit'){e.t-=dt;if(e.t<=0){for(let i=-1;i<=1;i++){const b=a+i*.35;projs.push({x:e.x,y:e.y-5,vx:Math.cos(b)*70,vy:Math.sin(b)*70,dmg:6*(1+(pw-1)*.1),en:1,life:2.5});}e.st='rec';e.t=.5;e.cd=2+rnd();}}

    if(e.st==='move'){chase(e,dt,e.spd,d>30?a:a+Math.PI/2*e.sd);if(d<34&&e.cd<=0){e.st='wind';e.t=.35;e.dir=a;tels.push({type:'line',x:e.x,y:e.y-4,a,len:30,w:10,t:.35,dur:.35,own:e,fixed:1});}
      else if(d>60&&d<130&&e.cd<=0&&rnd()<.01){e.st='throw';e.t=.4;e.dir=a;tels.push({type:'line',x:e.x,y:e.y-4,a,len:Math.min(d+20,130),w:5,t:.4,dur:.4,own:e,fixed:1});}}
    else if(e.st==='wind'){e.t-=dt;if(e.t<=0){move(e,Math.cos(e.dir)*14,Math.sin(e.dir)*14);const ax=Math.cos(e.dir),ay=Math.sin(e.dir),rx=p.x-e.x,ry=p.y-e.y,al=rx*ax+ry*ay,pe=Math.abs(-rx*ay+ry*ax);if(al>-4&&al<32&&pe<7+p.r)hurt(e.dmg);e.st='slash';e.t=.22;}}
    else if(e.st==='slash'){e.t-=dt;if(e.t<=0){e.st='back';e.t=.7;e.cd=1.3+rnd();}}
    else if(e.st==='back'){e.t-=dt;chase(e,dt,e.spd*.9,a+Math.PI+(e.sd*.6));if(e.t<=0)e.st='move';}

    else{e.t-=dt;if(e.t<=0)e.st='move';}
    break;
  case 'guard':
    if(e.st==='move'){if(d>30)chase(e,dt,e.spd,a);if(d<46&&e.cd<=0){e.st='wind';e.t=.7;e.dir=a;tels.push({type:'line',x:e.x,y:e.y-5,a,len:46,w:12,t:.7,dur:.7,own:e,fixed:1});}}
    else if(e.st==='wind'){e.t-=dt;if(e.t<=0){e.st='thrust';e.t=.3;const ax=Math.cos(e.dir),ay=Math.sin(e.dir),rx=p.x-e.x,ry=p.y-e.y,al=rx*ax+ry*ay,pe=Math.abs(-rx*ay+ry*ax);
      if(al>-4&&al<50&&pe<6+p.r)hurt(e.dmg);}}
    else if(e.st==='thrust'){e.t-=dt;if(e.t<=0){e.st='rec';e.t=.6;e.cd=1.6+rnd();}}
    else{e.t-=dt;if(e.t<=0)e.st='move';}
    break;}
  if(d<e.r+p.r+1&&!p.dead){const dash=e.st==='dash';if(WOOD_KINDS.has(e.kind)){if(!dash&&e.kind!=='cultist'&&e.kind!=='infected')hurt(e.dmg*.5);}else if(dash||(e.kind!=='guard'&&e.kind!=='thief'))hurt(dash?e.dmg*1.3:e.dmg*.6);}}

const PAT=['charge','sweep','leap','spikes','charge','call','sweep','leap','spikes'];
function bossAI(e,dt,d,a){const p=P,ph2=e.hp<e.max*.5,wm=ph2?.68:.85,sm=ph2?1.35:1.1;e.face=Math.cos(a)>=0?1:-1;
  if(e.kx||e.ky){e.kx=0;e.ky=0;}
  if(e.st==='intro'){e.t-=dt;if(e.t<=0){e.st='move';e.t=.8;boss=e;$('boss').classList.remove('hide');$('bossn').textContent=e.d.n;}return;}
  if(ph2&&!e.ph2){e.ph2=true;tels=tels.filter(t=>t.own!==e);toast('隊長が門を閉ざす','#ff9a8a');shake(7);e.st='roar';e.t=1.1;e.flash=.3;for(let i=0;i<2;i++)spawnNear('hound',e);return;}
  switch(e.st){
  case 'move':e.t-=dt;if(d>30)chase(e,dt,e.spd*sm,a);if(e.t<=0){const k=PAT[e.pi++%PAT.length];
      if(k==='charge'){e.st='cwind';e.t=.95*wm;e.dir=a;tels.push({type:'line',x:e.x,y:e.y-6,a,len:200,w:16,t:e.t,dur:e.t,own:e,fixed:1});}
      else if(k==='sweep'){e.st='sapp';e.t=1.4;}
      else if(k==='leap'){e.st='lwind';e.t=.9*wm;e.lx=clamp(p.x,TS*2,SW*TS-TS*2);e.ly=clamp(p.y,TS*7,SH*TS-TS*4);e.sx0=e.x;e.sy0=e.y;tels.push({type:'circ',own:e,x:e.lx,y:e.ly,r:38,t:e.t,dur:e.t,at:1});}
      else if(k==='spikes'){const n=ph2?7:5;for(let i=0;i<n;i++){const r=i===0?0:22+rnd()*44,b=rnd()*6.28;tels.push({type:'spike',x:clamp(p.x+Math.cos(b)*r,TS+8,SW*TS-TS-8),y:clamp(p.y+Math.sin(b)*r,TS*7,SH*TS-TS*4),r:12,t:(1+i*.06)*wm,dur:(1+i*.06)*wm,dmg:16});}e.st='spk';e.t=1.2;}
      else{for(let i=0;i<(ph2?3:2);i++)spawnNear('hound',e);e.st='call';e.t=.8;e.flash=.15;}}
    break;
  case 'roar':case 'call':case 'spk':e.t-=dt;if(e.t<=0){e.st='move';e.t=.45*wm;}break;
  case 'cwind':e.t-=dt;if(e.t<=0){e.st='charge';e.t=.8;}break;

    if(e.t<=0){e.jump=0;e.x=e.lx;e.y=e.ly;if(Math.hypot(p.x-e.x,p.y-e.y)<38+p.r)hurt(26);shake(9);hs=Math.max(hs,.08);fx.push({type:'ring',x:e.x,y:e.y-2,r0:8,r1:42,t:0,dur:.3,col:'#ffffff'});
      const n=ph2?10:6;for(let i=0;i<n;i++){const b=i*6.28/n;projs.push({x:e.x,y:e.y-4,vx:Math.cos(b)*70,vy:Math.sin(b)*70,dmg:10,en:1,life:2.4});}
      for(let i=0;i<16;i++)parts.push({x:e.x+(rnd()-.5)*30,y:e.y,vx:(rnd()-.5)*90,vy:-rnd()*80,t:0,life:.6,col:'#8fd6f0',g:1});e.st='rec';e.t=1.0;}break;}
  case 'charge':{e.t-=dt;const ok=move(e,Math.cos(e.dir)*240*sm*dt,Math.sin(e.dir)*240*sm*dt);if(d<e.r+p.r+2)hurt(24);
    if(!ok){shake(6);e.st='rec';e.t=1.4;e.flash=.15;for(let i=0;i<10;i++)parts.push({x:e.x+Math.cos(e.dir)*10,y:e.y-6,vx:(rnd()-.5)*90,vy:-rnd()*70,t:0,life:.5,col:'#8fd6f0',g:1});}
    else if(e.t<=0){e.st='rec';e.t=.8;}break;}
  case 'sapp':e.t-=dt;chase(e,dt,e.spd*1.4*sm,a);if(d<44||e.t<=0){e.st='swind';e.t=.8*wm;tels.push({type:'circ',own:e,r:46,t:e.t,dur:e.t});}break;

// ===================== 主(中ボス) =====================

const SEARCH={crate:.9,barrel:.9,sack:.6,chest:1.7};
function lootFor(o){const out=[],d=pw;const n=o.type==='chest'?2+(rnd()*2.4|0):rnd()<.2?0:1+(rnd()<.4?1:0)+(rnd()<.12?1:0);const bonus=o.type==='chest'?1:0;

    if(o.type==='barrel'){out.push(r<.3?makePotion():r<.45?{coin:1+(rnd()*3|0)}:makeValuable(d));continue;}
    out.push(o.type==='chest'?(r<.45?makeValuable(d):r<.55?makeWeapon(d,bonus):r<.63?makeArmor(d,bonus):r<.8?makePotion():{coin:3+(rnd()*5|0)+d}):(r<.68?makeValuable(d):r<.86?makePotion():{coin:1+(rnd()*3|0)}));}
  return out;}
function openContainer(o){o.opened=true;const L=lootFor(o);rollQuest('box',o.x,o.y-4,o.type,sec.roomAt?sec.roomAt(o.tx,o.ty):null);if(!L.length){toast('空っぽだった','#9aa6cf');}

const keys=new Set();

  if((k==='escape'||k==='p')&&(state==='play'||state==='pause'))togglePause();if((k==='b'||k==='tab')&&(state==='play'||state==='bag')){e.preventDefault();toggleBag();}});

const joy={id:null,on:false,ox:0,oy:0,x:0,y:0},JR=46;
cv.addEventListener('pointerdown',e=>{if(state!=='play'||joy.id!==null)return;joy.id=e.pointerId;joy.on=true;joy.ox=joy.x=e.clientX;joy.oy=joy.y=e.clientY;try{cv.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});

const endJoy=e=>{if(e.pointerId===joy.id){joy.id=null;joy.on=false;}};cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);
document.addEventListener('gesturestart',e=>e.preventDefault());
function input(){let x=0,y=0;if(keys.has('a')||keys.has('arrowleft'))x--;if(keys.has('d')||keys.has('arrowright'))x++;if(keys.has('w')||keys.has('arrowup'))y--;if(keys.has('s')||keys.has('arrowdown'))y++;
  if(x||y){const l=Math.hypot(x,y);return [x/l,y/l];}
  if(joy.on){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.hypot(dx,dy);if(l<5)return [0,0];const m=Math.min(1,(l-4)/(JR*.45));return [dx/l*m,dy/l*m];}return [0,0];}

// ===================== 更新 =====================
function update(dt){T+=dt;const p=P;
  for(let i=later.length-1;i>=0;i--){later[i].t-=dt;if(later[i].t<=0){const f=later[i].f;later.splice(i,1);f();}}

    if(p.kx||p.ky){move(p,p.kx*dt,p.ky*dt);const k=Math.pow(.001,dt);p.kx*=k;p.ky*=k;if(Math.abs(p.kx)<1)p.kx=0;if(Math.abs(p.ky)<1)p.ky=0;}
    const wet=sec.g[Math.floor(p.y/TS)*SW+Math.floor(p.x/TS)]===4;const hs2=p.hasteT>0?1.4:1;move(p,ix*p.spd*hs2*dt*(wet?.6:1),iy*p.spd*hs2*dt*(wet?.6:1));p.moving=mag>.1;if(wet&&p.moving&&rnd()<.3)parts.push({x:p.x+(rnd()-.5)*8,y:p.y,vx:(rnd()-.5)*20,vy:-20-rnd()*20,t:0,life:.3,col:'#9fd8ec',g:1});
    if(sec.seen){const ptx=Math.floor(p.x/TS),pty=Math.floor(p.y/TS);for(let b=-6;b<=6;b++)for(let a=-7;a<=7;a++){const xx=ptx+a,yy=pty+b;if(xx>=0&&yy>=0&&xx<SW&&yy<SH&&a*a+b*b<50)sec.seen[yy*SW+xx]=1;}
      const rm=sec.roomAt(ptx,pty);if(rm&&!rm.seen){rm.seen=1;for(let y=rm.y0-1;y<=rm.y0+rm.h;y++)for(let x=rm.x0-1;x<=rm.x0+rm.w;x++)sec.seen[y*SW+x]=1;}p.room=rm;}
    if(p.moving){p.wt+=dt*Math.max(.6,mag);if(p.wt>=.11){p.wt-=.11;p.fi=(p.fi+1)%4;}if(!p.atk){if(Math.abs(iy)>Math.abs(ix)*1.15)p.dir=iy>0?'down':'up';else p.dir=ix>0?'right':'left';}}
    else{p.wt+=dt;if(p.wt>=.45){p.wt=0;p.fi=(p.fi+1)%2;}}
    p.inv-=dt;p.flash-=dt;p.atkT-=dt;p.hasteT-=dt;if(p.shieldCd&&!p.shield){p.shieldT-=dt;if(p.shieldT<=0){p.shield=1;}}
    if(p.trail&&p.moving){p.trailT-=dt;if(p.trailT<=0){p.trailT=.12;trails.push({x:p.x,y:p.y,t:1.6+p.trail*.6});}}
    if(p.atk){p.atk.t+=dt/p.atk.dur;const hitAt=p.atk.kind==='spear'?.5:(p.atk.kind==='greatsword'||p.atk.kind==='hammer')?.48:.33;if(!p.atk.hit&&p.atk.t>=hitAt){p.atk.hit=true;applyHit();}if(p.atk.t>=1)p.atk=null;}
    if(!p.atk&&p.atkT<=0){const t=nearest(p.x,p.y-4,p.ws.range+P.upRange+4);if(t){startAttack(Math.atan2(-(t.y-(t.fly?10:4)-(p.y-5)),t.x-p.x));p.atkT=p.ws.cd*p.cdM;}}
    if(p.shard){p.shT-=dt;if(p.shT<=0){p.shT=1.6*(p.shardRate||1);const e=nearest(p.x,p.y,130);if(e){const a=Math.atan2(e.y-6-(p.y-8),e.x-p.x);for(let i=0;i<p.shard;i++)later.push({t:i*.12,f:()=>projs.push({x:p.x,y:p.y-8,vx:Math.cos(a)*190,vy:Math.sin(a)*190,dmg:7+p.shard*1.5+pw*.6,life:1,shardP:1})});}}}
    // 漁り:箱のそばで立ち止まる
    let near=null,nd=1e9;for(const o of sec.objs){if(!('opened' in o)||o.opened)continue;const d=Math.hypot(o.x-p.x,o.y-4-(p.y-4));if(d<19&&d<nd){nd=d;near=o;}}
    for(const o of sec.objs)if(o!==near&&o.search>0)o.search=Math.max(0,o.search-dt*2);
    if(near){if(!p.moving){near.search+=dt;if(near.search>=SEARCH[near.type])openContainer(near);}}
    // 帰還の灯
    const b=sec.beacon;if(b){const d=Math.hypot(b.x-p.x,b.y-p.y);if(d<20){extractT+=dt;if(extractT>=3){extract();return;}}else extractT=Math.max(0,extractT-dt*2);}

// 書き出し:JSON → (縮められるなら deflate で縮めて) → base64。末尾に検査用の数字を付けて、途中で切れたら分かるようにする
const b64e=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s);};
const b64d=t=>{const bin=atob(t),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;};
const ck=t=>{let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return h.toString(36);};
async function pipeBytes(u,stream){const s=new Blob([u]).stream().pipeThrough(stream);return new Uint8Array(await new Response(s).arrayBuffer());}
async function encSave(){const raw=new TextEncoder().encode(JSON.stringify(save));let body,tag='RR1';
  try{if(typeof CompressionStream!=='undefined'){body=b64e(await pipeBytes(raw,new CompressionStream('deflate-raw')));tag='RR2';}}catch(e){}
  if(!body)body=b64e(raw);return tag+':'+body+'.'+ck(body);}
async function decSave(t){t=(t||'').replace(/[\s​]/g,'');const m=t.match(/(RR[12]):([A-Za-z0-9+/=]+)(?:\.([a-z0-9]+))?/);if(!m)throw {why:'「RR」から始まる文字列が見つからない'};
  const [,tag,body,sum]=m;if(sum&&ck(body)!==sum)throw {why:'途中で切れている（'+body.length+'文字）。全部をコピーし直して'};if(!sum&&tag==='RR2')throw {why:'最後まで貼り付けられていない（'+body.length+'文字）'};
  let u=b64d(body);if(tag==='RR2'){if(typeof DecompressionStream==='undefined')throw {why:'この端末では読み込めない形式'};u=await pipeBytes(u,new DecompressionStream('deflate-raw'));}
  let o;try{o=JSON.parse(new TextDecoder().decode(u));}catch(e){throw {why:'途中で切れている（'+body.length+'文字）。全部をコピーし直して'};}if(!o||!o.stash||!o.eq)throw {why:'記録の中身が足りない'};return o;}

    $('io-msg').textContent=ok?'コピーした（'+code.length+'文字）':'コピーできなかった。上の枠を長押しして「すべてを選択」→「コピー」';};
  $('b-load').onclick=async()=>{try{const o=await decSave($('io-in').value);save=Object.assign(freshSave(),o);save.t=Date.now();save.resetAt=Math.max(save.resetAt||0,Date.now()-1);fixSave();migrateSave();persist();applyHand();$('io-msg').textContent='読み込んだ';setTimeout(title,600);}

function cmpLine(it){if(!P)return '';if(it.type==='weapon'){const a=wstats(it).dmg,b=wstats(P.eq.weapon).dmg,d=a-b;return `<p class="cmp">攻撃 ${a}　今 ${b}　<b style="color:${d>0?'#8ff0a4':d<0?'#ff8a8a':'#b7bddb'}">${d>0?'▲+'+d:d<0?'▼'+d:'±0'}</b></p>`;}
  if(it.type==='armor'){const df=x=>x?Math.round(ARMOR[x.kind].def*(1+x.rarity*.25))+((x.traits||[]).filter(t=>t.k==='def').reduce((s,t)=>s+t.v,0)):0;const a=df(it),b=df(P.eq.armor),d=a-b;return `<p class="cmp">守り ${a}　今 ${b}　<b style="color:${d>0?'#8ff0a4':d<0?'#ff8a8a':'#b7bddb'}">${d>0?'▲+'+d:d<0?'▼'+d:'±0'}</b></p>`;}return '';}
function bagPick(id,noRe){const p=P,it=p.bag.find(i=>i.id===id);if(!it)return;if(!noRe){showBag(id);return;}const acts=[];
  if(it.type==='weapon')acts.push(['equip','持ち替える']);if(it.type==='armor')acts.push(['equip','着る']);if(it.type==='potion')acts.push(['use','使う']);acts.push(['drop','捨てる']);
  $('bagDetail').innerHTML=itemCard(it,'')+cmpLine(it)+`<div class="acts big2">${acts.map(([k,n])=>`<button class="btn${k==='drop'?' ghost':''}" data-a="${k}">${n}</button>`).join('')}</div>`;paintIcons($('bagDetail'),[it]);
  $('bagDetail').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a,i=p.bag.indexOf(it);
    if(a==='equip'){p.bag.splice(i,1);if(it.type==='weapon'){const old=p.eq.weapon;p.eq.weapon=it;if(!old.starter)p.bag.splice(i,0,old);}else{const old=p.eq.armor;p.eq.armor=it;if(old)p.bag.splice(i,0,old);}recalc(p);}
    if(a==='use'){p.bag.splice(i,1);heal(potHeal(it));if(it.cure)p.poison=0;}
    if(a==='drop'){p.bag.splice(i,1);picks.push({x:p.x,y:p.y+6,vx:0,vy:20,kind:'item',item:it,t:-1,warned:1});}
    hudCache='';showBag();});}
function togglePause(){if(state==='play'){state='pause';joy.on=false;joy.id=null;scr(`<h2>一時停止</h2><p class="cen small">潮の岸 区画 ${depth}</p><button class="btn" id="b-res" type="button">続ける</button><button class="btn ghost" id="b-quit" type="button">あきらめる（すべて失う）</button>`,true);
    $('b-res').onclick=togglePause;$('b-quit').onclick=()=>{hideScr();state='play';P.dead=true;endRun(false);};}
  else if(state==='pause'){hideScr();state='play';}}
$('pause').onclick=togglePause;$('bagb').onclick=toggleBag;$('swapb').onclick=()=>{if(state!=='play'||!swapK)return;const k=swapK,p=P;
  if(k.item.type==='potion'){let lo=null;for(const it of p.bag)if(it.type==='valuable'&&(!lo||it.value<lo.value))lo=it;
    if(lo){p.bag.splice(p.bag.indexOf(lo),1,k.item);k.got=true;runLoot.push(k.item);picks.push({x:p.x+(rnd()-.5)*10,y:p.y+8,vx:0,vy:10,kind:'item',item:lo,t:-1,warned:1,dropped:1});toast(k.item.name+'（'+lo.name+' '+lo.value+' と入れ替え）',RAR[k.item.rarity].c);swapK=null;$('swapb').classList.add('hide');hudCache='';return;}}
  bagSwap=true;toggleBag();};$('mm').onclick=()=>{mmBig=!mmBig;mmT=0;};
$('potb').onclick=()=>{if(state!=='play'||!P||P.dead)return;let i=P.poison>0?P.bag.findIndex(it=>it.cure):-1;if(i<0)i=P.bag.findIndex(it=>it.type==='potion'&&!it.cure);if(i<0)i=P.bag.findIndex(it=>it.type==='potion');if(i<0){toast('薬草がない','#ff9a8a');return;}const it=P.bag.splice(i,1)[0];heal(potHeal(it));if(it.cure)P.poison=0;hudCache='';};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause();});

let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;
  if(state==='play'){if(hs>0)hs-=dt;else update(dt*slow);}
  render();hud();drawToasts();drawMinimap(dt);requestAnimationFrame(frame);}
applyHand();title();requestAnimationFrame(frame);setTimeout(cloudInit,0);
window.__g={get P(){return P;},get enemies(){return enemies;},get state(){return state;},get sec(){return sec;},get depth(){return depth;},get save(){return save;},get picks(){return picks;},
  setGod(v){god=v;},camp,startRun,nextSection:()=>nextSection(),killAll(){enemies.forEach(e=>{e.hp=0;kill(e);});},
  tp(x,y){P.x=x;P.y=y;},openAll(){for(const o of sec.objs)if('opened' in o&&!o.opened)openContainer(o);},extract,levelPick(){const b=document.querySelector('.up');if(b)b.click();}};
