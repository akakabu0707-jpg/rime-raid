// ---- 外周を1ドット削る(頭・フード・兜)。下側(首)は削らない ----
function erode(rows){const h=rows.length,w=rows[0].length;
  // 外につながる空き(穴ではない所)を、上と左右の端から塗りつぶして調べる。下側(首)は外としない
  const out=Array.from({length:h},()=>new Array(w).fill(false)),st=[];
  for(let x=0;x<w;x++)if(rows[0][x]==='.')st.push([x,0]);
  for(let y=0;y<h;y++){if(rows[y][0]==='.')st.push([0,y]);if(rows[y][w-1]==='.')st.push([w-1,y]);}
  while(st.length){const [x,y]=st.pop();if(x<0||y<0||x>=w||y>=h||out[y][x]||rows[y][x]!=='.')continue;out[y][x]=true;st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}
  const isOut=(x,y)=>y<0||x<0||x>=w||(y<h&&out[y][x]);
  return rows.map((r,y)=>r.split('').map((c,x)=>c==='.'||c==='Q'||c==='q'?c:([[1,0],[-1,0],[0,-1]].some(([a,b])=>isOut(x+a,y+b))?'.':c)).join(''));}

const FW=20,FH=22,FX=2,FY=3,FOOT=16;   // 足元 = (FX+8, FY+FOOT)

// 動き:ub = 上半身(頭・胴・手)の上下、lv = 脚の形
const ANIMS={
  idle:[{ub:0},{ub:1}],
  walk:[{ub:1,lv:1,ha:-1},{ub:0,lv:0,ha:0},{ub:1,lv:2,ha:1},{ub:0,lv:0,ha:0}],

function charFrame(armor,dir,anim,i){
  const d=(dir==='left'||dir==='right')?'side':dir,flip=dir==='left',st=ANIMS[anim][i%ANIMS[anim].length];
  const pal=Object.assign({},CPAL,RECOLOR[armor]||{}),ov=OVER[armor]||{};
  const grid=Array.from({length:FH},()=>new Array(FW).fill(null));
  const stamp=(rows,x0,y0)=>{rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const ch=r[x];if(ch==='.')continue;const yy=y0+y,xx=x0+x;if(yy<0||yy>=FH||xx<0||xx>=FW)continue;grid[yy][xx]=ch;}});};
  const ub=st.ub||0;
  stamp(LEGS[d][st.lv||0],FX,FY+14);
  stamp(BODY[d],FX,FY+9+ub);
  if(ov.body&&ov.body[d])stamp(ov.body[d].rows,FX,FY+9+ub+ov.body[d].y);
  stamp(HEAD[d],FX,FY+ub);
  if(ov.head&&ov.head[d])stamp(ov.head[d].rows,FX,FY+ub+ov.head[d].y);
  {const ha=st.ha||0,hr=HANDS[d];stamp(hr.map(r=>r.slice(0,8)+'........'),FX,FY+11+ub+ha);stamp(hr.map(r=>'........'+r.slice(8)),FX,FY+11+ub-ha);}
  const data=new Uint8ClampedArray(FW*FH*4);
  for(let y=0;y<FH;y++)for(let x=0;x<FW;x++){const ch=grid[y][x];if(!ch)continue;const c=hexRGB(pal[ch]||'#ff00ff');const k=(y*FW+x)*4;data[k]=c[0];data[k+1]=c[1];data[k+2]=c[2];data[k+3]=255;}
  // 外側の縁取り:隣の色をうんと暗くした色
  const out=data.slice();
  for(let y=0;y<FH;y++)for(let x=0;x<FW;x++){if(grid[y][x])continue;
    const nb=[[x,y+1],[x,y-1],[x-1,y],[x+1,y]].filter(([a,b])=>a>=0&&b>=0&&a<FW&&b<FH&&grid[b][a]);if(!nb.length)continue;
    const [a,b]=nb[0],c=hexRGB(pal[grid[b][a]]);const k=(y*FW+x)*4;
    out[k]=Math.round(c[0]*.28+6);out[k+1]=Math.round(c[1]*.24+5);out[k+2]=Math.round(c[2]*.3+14);out[k+3]=255;}
  if(flip){for(let y=0;y<FH;y++)for(let x=0;x<FW/2;x++){const a=(y*FW+x)*4,b=(y*FW+FW-1-x)*4;for(let j=0;j<4;j++){const t=out[a+j];out[a+j]=out[b+j];out[b+j]=t;}}}

function gridImg(rows,pal,opt){opt=opt||{};const h=rows.length,w=Math.max(...rows.map(r=>r.length)),P=1,W=w+P*2,H=h+P*2,data=new Uint8ClampedArray(W*H*4);

  if(!opt.noOutline)for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){if(at(x,y)!=='.')continue;const n=[[x,y+1],[x,y-1],[x-1,y],[x+1,y]].find(([a,b])=>at(a,b)!=='.');if(!n)continue;
    const c=hexRGB(pal[at(n[0],n[1])]);const k=((y+P)*W+x+P)*4;data[k]=Math.round(c[0]*.26+6);data[k+1]=Math.round(c[1]*.22+5);data[k+2]=Math.round(c[2]*.28+14);data[k+3]=255;}

const FW_=60,FH_=76;
const THEMES={

  tide:{n:'潮だまり',floor:0,path:0,wall:0,en:['crab','crab','gull']},

  house:{n:'商館',floor:4,path:2,wall:1,en:['guard','thief','guard']},

  hita:{n:'ヒタの寝床',floor:7,path:6,wall:2,en:['boar','serpent','infected']},

const FLOOR_THEMES={1:['cove','cove','tide','street'],2:['cove','tide','dock','street','market'],3:['dock','street','market','house','tide'],4:['street','market','house','house','dock'],6:['house','house','market','street'],7:['house','house','house','market','street']};
function genFloor(d,S){const W=FW_,H=FH_,N=W*H;S=S||{};
  for(let tries=0;tries<40;tries++){
  const g=new Uint8Array(N).fill(1),ft=new Uint8Array(N),wt=new Uint8Array(N);const rnd2=Math.random;

  const pool=(S.themes||FLOOR_THEMES)[d]||(S.themes||FLOOR_THEMES)[4];
  for(let j=0;j<CY;j++)for(let i=0;i<CX;i++){if(rnd2()<.12&&!(j===CY-1&&i===1)){rooms.push(null);continue;}
    const th=pool[rnd2()*pool.length|0];const big=th==='dock'||th==='cove';

  const R=rooms.filter(Boolean);for(const r of R){r.cx=r.x0+(r.w>>1);r.cy=r.y0+(r.h>>1);}

  const noise=(x,y)=>{const fx=x/5,fy=y/5,ix=fx|0,iy=fy|0,tx=fx-ix,ty=fy-iy,sm=t=>t*t*(3-2*t),a=NZ[iy*nzW+ix],b=NZ[iy*nzW+ix+1],c=NZ[(iy+1)*nzW+ix],e=NZ[(iy+1)*nzW+ix+1];const u=sm(tx),v=sm(ty);return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+e*u)*v;};
  const natural=th=>['cove','tide','jungle','river','glade','camp','deep','hita'].includes(th)||(S.natural||[]).includes(th);
  for(const r of R){const T=THEMES[r.th];

      const rx=r.w/2+1,ry=r.h/2+1;

        for(let n=0;n<1+(rnd2()*2|0);n++){const w=3+(rnd2()*5|0),h=3+(rnd2()*4|0);const side=rnd2()*4|0;let x0,y0;
          if(side===0){x0=r.x0+(rnd2()*(r.w-2)|0);y0=r.y0-h+1;}else if(side===1){x0=r.x0+(rnd2()*(r.w-2)|0);y0=r.y0+r.h-1;}
          else if(side===2){x0=r.x0-w+1;y0=r.y0+(rnd2()*(r.h-2)|0);}else{x0=r.x0+r.w-1;y0=r.y0+(rnd2()*(r.h-2)|0);}

  const at=(i,j)=>rooms[j*CX+i];const edges=[],seen=new Set();const start=at(1,CY-1);

    if(!nb.length){stack.pop();continue;}const n=nb[rnd2()*nb.length|0];seen.add(n);edges.push([r,n]);stack.push(n);}
  for(let k=0;k<3;k++){const a=R[rnd2()*R.length|0],b=R[rnd2()*R.length|0];if(a!==b&&Math.abs(a.i-b.i)+Math.abs(a.j-b.j)===1)edges.push([a,b]);}
  const carve=(x,y,f)=>{for(let b=0;b<2;b++)for(let a=0;a<2;a++){const xx=x+a,yy=y+b;if(xx<1||yy<1||xx>=W-1||yy>=H-1)continue;const k=yy*W+xx;if(g[k]===1){g[k]=0;ft[k]=f;}}};
  for(const [a,b] of edges){const f=THEMES[a.th].path===THEMES[b.th].path?THEMES[a.th].path:(rnd2()<.5?THEMES[a.th].path:THEMES[b.th].path);
    // 曲がりくねった道:目的へ寄りつつ、ときどき横へそれる

        if(e.team==='p')Wd.cutProj(e.x,e.y,e.r,e.a);SP.fire(Wd,e,'wave',e.x+Math.cos(e.a)*e.r*.7,e.y+Math.sin(e.a)*e.r*.7,e.a,null);}
      if(e.t>=e.dur)continue;}
    else if(e.k==='nova'){if(!e.done){e.done=true;for(const f of T){if(Math.hypot(f.x-e.x,f.y-yo(f)-e.y)<e.r+f.r){hitT(Wd,e,f,e.dmg,{x:e.x,y:e.y});SP.fire(Wd,e,'impact',f.x,f.y-yo(f),Math.atan2(f.y-e.y,f.x-e.x),f);}}
        if(linksOf(e.node,'ring').length){const n=6,o=Math.random()*6.28;for(let i=0;i<n;i++)SP.fire(Wd,e,'ring',e.x,e.y,o+i*Math.PI*2/n,null);}}
      if(e.t>=e.dur)continue;}
    else if(e.k==='zone'){e.life-=dt;e.tt-=dt;
      if(e.tt<=0){e.tt=e.iv;for(const f of T)if(Math.hypot(f.x-e.x,(f.y-e.y)/.75)<e.r+f.r)hitT(Wd,e,f,e.dmg,{x:e.x,y:e.y,chain:1,zone:1});}
      e.emit-=dt;if(e.emit<=0){e.emit=.8;if(nearT(Wd,e.team,e.x,e.y,140,null))SP.fire(Wd,e,'emit',e.x,e.y-4,0,null);}
      if(Math.random()<dt*e.r*.5)Wd.part(e.x+(Math.random()-.5)*e.r*1.6,e.y+(Math.random()-.5)*e.r*1.1,ELEMS[e.el].c[1+(Math.random()*2|0)],1);
      if(e.life<=0)continue;}
    else if(e.k==='meteor'){if(e.t>=e.dur){Wd.fx({t:'ring',x:e.x,y:e.y,r:e.r,el:e.el,life:.4});Wd.shake(3);
        for(const f of T)if(Math.hypot(f.x-e.x,f.y-yo(f)-e.y)<e.r+f.r)hitT(Wd,e,f,e.dmg,{x:e.x,y:e.y});
        SP.fire(Wd,e,'impact',e.x,e.y,0,null);for(let i=0;i<14;i++)Wd.part(e.x,e.y,ELEMS[e.el].c[i%3]);continue;}}
    out.push(e);}
  Wd.ents.length=0;for(const e of out)Wd.ents.push(e);};
SP.castRoot=function(Wd,n,x,y,ang,anchor,src,twin){if(twin){SP.cast(Wd,n,x,y,ang-.16,0,anchor,null,src);SP.cast(Wd,n,x,y,ang+.16,0,anchor,null,src);}else SP.cast(Wd,n,x,y,ang,0,anchor,null,src);};

const BH={b:[],l:[],k:1,wk:1};
const BCOL={arcane:['#ffffff','#c8a8ff','#6a3ad0'],frost:['#ffffff','#a8e8ff','#3f7ac8'],stone:['#f0e8d8','#a89a88','#4a4038'],lightning:['#ffffff','#fff07a','#c89010'],dark:['#f0d0ff','#b060ff','#3a0a5a'],fire:['#fff4c0','#ffa040','#c0401a'],slime:['#e0fff4','#4ac0a0','#14504a'],blood:['#ffd0d0','#ff3a4a','#5a0a14']};
// 1発。o:{spd,acc,spin,r,dmg,el,kind,life,home,grow,delay}
BH.shot=function(x,y,a,o){if(BH.b.length>700)return;const s=(o.spd||70)*BH.k;BH.b.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,acc:o.acc||0,spin:o.spin||0,r:o.r||3,dmg:o.dmg||8,el:o.el||'arcane',kind:o.kind||'orb',life:o.life||6,home:o.home||0,t:0,delay:o.delay||0,spawn:o.spawn,owner:o.owner,stop:o.stop,then:o.then});};
BH.ring=function(x,y,n,off,o){for(let i=0;i<n;i++){if(o.gap!=null){const k=((i/n)+1)%1;if(Math.abs(((k-o.gap+1.5)%1)-.5)<(o.gw||.08))continue;}BH.shot(x,y,off+i*Math.PI*2/n,o);}};
BH.fan=function(x,y,a,n,spread,o){for(let i=0;i<n;i++)BH.shot(x,y,a+(n>1?(i/(n-1)-.5)*spread:0),o);};
// 光線:warn 秒は予告だけ、そのあと dur 秒当たる。va は回る速さ
BH.laser=function(x,y,a,o){BH.l.push({x,y,a,va:o.va||0,len:o.len||260,w:o.w||5,warn:(o.warn||.7)*BH.wk,dur:o.dur||.8,t:0,dmg:o.dmg||12,el:o.el||'arcane',own:o.own,hitCd:0});};
BH.clear=function(){BH.b.length=0;BH.l.length=0;};
BH.update=function(G,dt){const P=G.P,px=P.x,py=P.y-8,keep=[];
  for(const q of BH.b){q.t+=dt;if(q.delay>0){q.delay-=dt;keep.push(q);continue;}q.life-=dt;
    if(q.spin){const a=Math.atan2(q.vy,q.vx)+q.spin*dt,s=Math.hypot(q.vx,q.vy);q.vx=Math.cos(a)*s;q.vy=Math.sin(a)*s;}
    if(q.acc){const s=Math.hypot(q.vx,q.vy),n=Math.max(0,s+q.acc*dt);if(s>0){q.vx*=n/s;q.vy*=n/s;}}
    if(q.home&&!P.dead){const a=Math.atan2(py-q.y,px-q.x),c=Math.atan2(q.vy,q.vx);let d=a-c;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;const na=c+Math.max(-q.home*dt,Math.min(q.home*dt,d)),s=Math.hypot(q.vx,q.vy);q.vx=Math.cos(na)*s;q.vy=Math.sin(na)*s;}
    if(q.stop&&q.t>q.stop&&!q.stopped){q.stopped=1;q.vx*=.02;q.vy*=.02;}
    q.x+=q.vx*dt;q.y+=q.vy*dt;
    if(q.then&&q.t>q.then.at&&!q.fired){q.fired=1;q.then.f(q);if(q.then.die){continue;}}
    if(q.life<=0||G.solidB(q.x,q.y))continue;
    if(!P.dead&&Math.hypot(q.x-px,q.y-py)<q.r+3){const ok=G.hurt(q.dmg,{x:q.owner?q.owner.x:q.x,y:q.owner?q.owner.y:q.y,proj:1,owner:q.owner,bullet:1});if(ok===false)continue;}
    keep.push(q);}
  BH.b=keep;
  const kl=[];for(const L of BH.l){L.t+=dt;L.a+=L.va*dt*(L.t>L.warn?1:.35);if(L.own){L.x=L.own.x;L.y=L.own.y-10;}
    if(L.t>L.warn&&!P.dead){L.hitCd-=dt;const ax=Math.cos(L.a),ay=Math.sin(L.a),rx=px-L.x,ry=py-L.y,al=rx*ax+ry*ay,pe=Math.abs(-rx*ay+ry*ax);if(al>0&&al<L.len&&pe<L.w/2+3&&L.hitCd<=0){L.hitCd=.4;G.hurt(L.dmg,{x:L.x,y:L.y+10,owner:L.own,laser:1});}}
    if(L.t<L.warn+L.dur&&!(L.own&&L.own.dead))kl.push(L);}
  BH.l=kl;};
// 主人公の魔剣で弾を斬る
BH.cut=function(x,y,r){let n=0;BH.b=BH.b.filter(q=>{if(Math.hypot(q.x-x,q.y-y)<r+q.r){n++;return false;}return true;});return n;};
BH.draw=function(cx,ox,oy,T){for(const q of BH.b){const C=BCOL[q.el]||BCOL.arcane,x=Math.round(q.x-ox),y=Math.round(q.y-oy);if(q.delay>0){cx.globalAlpha=.35;cx.fillStyle=C[1];cx.fillRect(x-1,y-1,3,3);cx.globalAlpha=1;continue;}
    const r=Math.round(q.r);
    if(q.kind==='shard'){const a=Math.atan2(q.vy,q.vx);for(let i=-r-1;i<=r+1;i++){cx.fillStyle=i>r-1?C[0]:C[1];cx.fillRect(Math.round(x+Math.cos(a)*i),Math.round(y+Math.sin(a)*i),1,1);}cx.fillStyle=C[2];cx.fillRect(Math.round(x-Math.cos(a)*(r+2)),Math.round(y-Math.sin(a)*(r+2)),1,1);}
    else if(q.kind==='rock'){cx.fillStyle='#14100c';cx.fillRect(x-r-1,y-r,r*2+3,r*2+1);cx.fillRect(x-r,y-r-1,r*2+1,r*2+3);cx.fillStyle=C[2];cx.fillRect(x-r,y-r,r*2+1,r*2+1);cx.fillStyle=C[1];cx.fillRect(x-r,y-r,r*2,r);cx.fillStyle=C[0];cx.fillRect(x-r+1,y-r,1,1);}
    else if(q.kind==='star'){cx.fillStyle=C[2];cx.fillRect(x-r-1,y,r*2+3,1);cx.fillRect(x,y-r-1,1,r*2+3);cx.fillStyle=C[1];cx.fillRect(x-r,y,r*2+1,1);cx.fillRect(x,y-r,1,r*2+1);cx.fillStyle=C[0];cx.fillRect(x,y,1,1);}
    else{cx.fillStyle=C[2];cx.beginPath();cx.arc(x+.5,y+.5,r+1,0,6.28);cx.fill();cx.fillStyle=C[1];cx.beginPath();cx.arc(x+.5,y+.5,r,0,6.28);cx.fill();cx.fillStyle=C[0];cx.fillRect(x-Math.floor(r/2),y-Math.floor(r/2),Math.max(1,r-1),Math.max(1,r-1));}}
  for(const L of BH.l){const C=BCOL[L.el]||BCOL.arcane,x=L.x-ox,y=L.y-oy;cx.save();cx.translate(Math.round(x),Math.round(y));cx.rotate(L.a);
    if(L.t<L.warn){const k=L.t/L.warn;cx.globalAlpha=.25+.35*k*(.6+.4*Math.sin(T*30));cx.fillStyle='#ff3b4a';cx.fillRect(0,-.5,L.len,1);cx.globalAlpha=.12;cx.fillRect(0,-L.w/2,L.len,L.w);}
    else{const k=1-Math.min(1,(L.t-L.warn)/L.dur),w=Math.max(1,Math.round(L.w*(.6+.4*k)));cx.globalAlpha=1;cx.fillStyle=C[2];cx.fillRect(0,-w/2-1,L.len,w+2);cx.fillStyle=C[1];cx.fillRect(0,-w/2,L.len,w);cx.fillStyle=C[0];cx.fillRect(0,-Math.max(.5,w/4),L.len,Math.max(1,w/2));}
    cx.restore();cx.globalAlpha=1;}};
BH.lights=function(L){let i=0;for(const q of BH.b){if((i++)%3)continue;L(q.x,q.y,12,({arcane:'170,120,255',frost:'140,210,255',stone:'200,180,150',lightning:'255,240,140',dark:'180,90,255',fire:'255,140,50',slime:'80,220,180',blood:'255,60,70'})[q.el]||'200,200,255',.45);}
  for(const Ln of BH.l){if(Ln.t<Ln.warn)continue;for(let s=0;s<Ln.len;s+=40)L(Ln.x+Math.cos(Ln.a)*s,Ln.y+Math.sin(Ln.a)*s,24,({arcane:'170,120,255',frost:'140,210,255',lightning:'255,240,140',dark:'180,90,255'})[Ln.el]||'255,255,255',.5);}};

function s2x(rows){const h=rows.length,w=Math.max(...rows.map(r=>r.length)),at=(x,y)=>(x<0||y<0||x>=w||y>=h)?'.':(rows[y][x]||'.'),out=[];
  for(let y=0;y<h;y++){let a='',b='';for(let x=0;x<w;x++){const P=at(x,y),A=at(x,y-1),B=at(x+1,y),C=at(x-1,y),D=at(x,y+1);
    a+=(C===A&&C!==D&&A!==B?A:P)+(A===B&&A!==C&&B!==D?B:P);b+=(D===C&&D!==B&&C!==A?C:P)+(B===D&&B!==A&&D!==C?D:P);}out.push(a,b);}return out;}

function monAI(G,e,dt){const p=G.P,dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx),D=e.D;
  e.cd-=dt;e.ccd-=dt;if(Math.abs(dx)>2)e.face=dx>=0?1:-1;
  const tl=o=>G.tels.push(Object.assign({own:e},o));
  switch(D.ai){
  case 'chase':G.chase(e,dt,e.spd,a);touch(G,e,d);break;
  case 'bat':{if(e.st==='wind'){e.t-=dt;if(e.t<=0){e.st='dash';e.t=.42;}break;}
    if(e.st==='dash'){e.t-=dt;G.move(e,Math.cos(e.dir)*150*dt,Math.sin(e.dir)*150*dt);touch(G,e,d);if(e.t<=0){e.st='idle';e.cd=1.6+Math.random()*1.2;}break;}
    e.ang+=dt*1.6*e.sd;const tx=p.x+Math.cos(e.ang)*46,ty=p.y-6+Math.sin(e.ang)*34;G.chase(e,dt,e.spd,Math.atan2(ty-e.y,tx-e.x));touch(G,e,d,.8);
    if(e.cd<=0&&d<120){e.st='wind';e.t=.55;e.dir=a;tl({type:'line',x:e.x,y:e.y,a,len:70,w:7,t:.55,dur:.55,fixed:1});}break;}
  case 'caster':case 'imp':{const want=D.keep;e.ang+=dt*.7*e.sd;const tx=p.x-Math.cos(a)*want+Math.cos(e.ang)*18,ty=p.y-Math.sin(a)*want+Math.sin(e.ang)*14;
    if(e.st!=='wind')G.chase(e,dt,e.spd,Math.atan2(ty-e.y,tx-e.x));
    if(e.st==='wind'){e.t-=dt;if(e.t<=0){const aa=angTo(e,p);if(D.ai==='imp')BH.fan(e.x,e.y-6,aa,3,.7,{spd:56,r:3,dmg:e.dmg,el:'fire',owner:e,life:5});else BH.shot(e.x,e.y-6,aa,{spd:62,r:3,dmg:e.dmg,el:'arcane',owner:e,life:5});e.st='idle';e.cd=D.cd*(.8+Math.random()*.4);}}
    else if(e.cd<=0&&d<190){e.st='wind';e.t=.75;tl({type:'line',x:e.x,y:e.y-6,a:angTo(e,p),len:46,w:4,t:.75,dur:.75,fixed:1});}
