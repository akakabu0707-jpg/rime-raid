// ---- 外周を1ドット削る(頭・フード・兜)。下側(首)は削らない ----
function erode(rows){const h=rows.length,w=rows[0].length;
  // 外につながる空き(穴ではない所)を、上と左右の端から塗りつぶして調べる。下側(首)は外としない
  const out=Array.from({length:h},()=>new Array(w).fill(false)),st=[];
  for(let x=0;x<w;x++)if(rows[0][x]==='.')st.push([x,0]);
  for(let y=0;y<h;y++){if(rows[y][0]==='.')st.push([0,y]);if(rows[y][w-1]==='.')st.push([w-1,y]);}
  while(st.length){const [x,y]=st.pop();if(x<0||y<0||x>=w||y>=h||out[y][x]||rows[y][x]!=='.')continue;out[y][x]=true;st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}
  const isOut=(x,y)=>y<0||x<0||x>=w||(y<h&&out[y][x]);
  return rows.map((r,y)=>r.split('').map((c,x)=>c==='.'||c==='Q'||c==='q'?c:([[1,0],[-1,0],[0,-1]].some(([a,b])=>isOut(x+a,y+b))?'.':c)).join(''));}

function charFrame(armor,dir,anim,i){

  stamp(HEAD[d],FX,FY+ub);
  if(ov.head&&ov.head[d])stamp(ov.head[d].rows,FX,FY+ub+ov.head[d].y);

// =====================================================================
//  潮の岸の区画:不思議のダンジョン式(部屋と通路)。60×76 マス

// =====================================================================
const FW_=60,FH_=76;
const THEMES={
  cove:{n:'浜',floor:0,path:0,wall:0,en:['crab','crab','gull','hound']},
  tide:{n:'潮だまり',floor:0,path:0,wall:0,en:['crab','crab','gull']},
  dock:{n:'桟橋',floor:3,path:3,wall:0,en:['gull','thief','hound']},
  street:{n:'港町',floor:2,path:2,wall:1,en:['hound','guard','thief']},
  market:{n:'市場',floor:2,path:2,wall:1,en:['thief','hound','guard']},
  house:{n:'商館',floor:4,path:2,wall:1,en:['guard','thief','guard']},
  jungle:{n:'密林',floor:6,path:6,wall:2,en:['boar','frog','serpent']},
  river:{n:'川辺',floor:6,path:6,wall:2,en:['frog','serpent','boar']},
  glade:{n:'空き地',floor:7,path:6,wall:2,en:['boar','infected','frog']},
  camp:{n:'不朽派の野営',floor:7,path:6,wall:2,en:['cultist','cultist','infected']},
  deep:{n:'森の奥',floor:6,path:6,wall:2,en:['serpent','boar','infected','frog']},
  hita:{n:'ヒタの寝床',floor:7,path:6,wall:2,en:['boar','serpent','infected']},
};
const FLOOR_THEMES={1:['cove','cove','tide','street'],2:['cove','tide','dock','street','market'],3:['dock','street','market','house','tide'],4:['street','market','house','house','dock'],6:['house','house','market','street'],7:['house','house','house','market','street']};
function genFloor(d,S){const W=FW_,H=FH_,N=W*H;S=S||{};
  for(let tries=0;tries<40;tries++){
  const g=new Uint8Array(N).fill(1),ft=new Uint8Array(N),wt=new Uint8Array(N);const rnd2=Math.random;
  const set=(x,y,v,f)=>{if(x<1||y<1||x>=W-1||y>=H-1)return;const k=y*W+x;g[k]=v;if(f!=null)ft[k]=f;};
  // 部屋:3×4 の升目に一つずつ
  const CX=3,CY=4,cw=Math.floor((W-2)/CX),ch=Math.floor((H-2)/CY),rooms=[];
  const pool=(S.themes||FLOOR_THEMES)[d]||(S.themes||FLOOR_THEMES)[4];
  for(let j=0;j<CY;j++)for(let i=0;i<CX;i++){if(rnd2()<.12&&!(j===CY-1&&i===1)){rooms.push(null);continue;}
    const th=pool[rnd2()*pool.length|0];const big=th==='dock'||th==='cove';
    const w=(big?11:8)+(rnd2()*(big?6:7)|0),h=(big?10:7)+(rnd2()*(big?6:6)|0);
    const x0=1+i*cw+1+(rnd2()*Math.max(1,cw-w-2)|0),y0=1+j*ch+2+(rnd2()*Math.max(1,ch-h-3)|0);
    rooms.push({i,j,x0,y0,w:Math.min(w,cw-2),h:Math.min(h,ch-3),th});}
  const R=rooms.filter(Boolean);for(const r of R){r.cx=r.x0+(r.w>>1);r.cy=r.y0+(r.h>>1);}
  // 部屋の床
  // なめらかな揺らぎ(粗い升目の乱数を補間)
  const NZ=[];const nzW=Math.ceil(W/5)+2,nzH=Math.ceil(H/5)+2;for(let i=0;i<nzW*nzH;i++)NZ.push(rnd2());
  const noise=(x,y)=>{const fx=x/5,fy=y/5,ix=fx|0,iy=fy|0,tx=fx-ix,ty=fy-iy,sm=t=>t*t*(3-2*t),a=NZ[iy*nzW+ix],b=NZ[iy*nzW+ix+1],c=NZ[(iy+1)*nzW+ix],e=NZ[(iy+1)*nzW+ix+1];const u=sm(tx),v=sm(ty);return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+e*u)*v;};
  const natural=th=>['cove','tide','jungle','river','glade','camp','deep','hita'].includes(th)||(S.natural||[]).includes(th);
  for(const r of R){const T=THEMES[r.th];
    if(natural(r.th)){// 浜と潮だまりは丸みのある不揃いな形
      const rx=r.w/2+1,ry=r.h/2+1;
      for(let y=r.y0-1;y<=r.y0+r.h;y++)for(let x=r.x0-1;x<=r.x0+r.w;x++){const e=((x-r.cx)/rx)**2+((y-r.cy)/ry)**2;if(e<.62+noise(x,y)*.55)set(x,y,0,T.floor);}
      for(let y=r.cy-2;y<=r.cy+2;y++)for(let x=r.cx-2;x<=r.cx+2;x++)set(x,y,0,T.floor);}
    else{for(let y=r.y0;y<r.y0+r.h;y++)for(let x=r.x0;x<r.x0+r.w;x++)set(x,y,0,T.floor);
      // 町の部屋は長方形を重ねて L 字や T 字に
      if(r.th!=='dock'){const bx0=1+r.i*cw+1,by0=1+r.j*ch+1,bx1=bx0+cw-3,by1=by0+ch-3;
        for(let n=0;n<1+(rnd2()*2|0);n++){const w=3+(rnd2()*5|0),h=3+(rnd2()*4|0);const side=rnd2()*4|0;let x0,y0;
          if(side===0){x0=r.x0+(rnd2()*(r.w-2)|0);y0=r.y0-h+1;}else if(side===1){x0=r.x0+(rnd2()*(r.w-2)|0);y0=r.y0+r.h-1;}
          else if(side===2){x0=r.x0-w+1;y0=r.y0+(rnd2()*(r.h-2)|0);}else{x0=r.x0+r.w-1;y0=r.y0+(rnd2()*(r.h-2)|0);}
          for(let y=Math.max(by0,y0);y<Math.min(by1,y0+h);y++)for(let x=Math.max(bx0,x0);x<Math.min(bx1,x0+w);x++){set(x,y,0,T.floor);}}}
      // 角を少し欠く
      for(const [cx_,cy_] of [[r.x0,r.y0],[r.x0+r.w-1,r.y0],[r.x0,r.y0+r.h-1],[r.x0+r.w-1,r.y0+r.h-1]])if(rnd2()<.5)set(cx_,cy_,1);}
    for(let y=r.y0-1;y<=r.y0+r.h;y++)for(let x=r.x0-1;x<=r.x0+r.w;x++)if(x>0&&y>0&&x<W-1&&y<H-1&&g[y*W+x]===1)wt[y*W+x]=T.wall;}
  // つなぐ:隣の升目どうしの木 + 輪を少し
  const at=(i,j)=>rooms[j*CX+i];const edges=[],seen=new Set();const start=at(1,CY-1);
  const stack=[start];seen.add(start);
  while(stack.length){const r=stack[stack.length-1];const nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>{let k=1,n=null;while(!n){const ii=r.i+a*k,jj=r.j+b*k;if(ii<0||jj<0||ii>=CX||jj>=CY)break;n=at(ii,jj);k++;}return n;}).filter(n=>n&&!seen.has(n));
    if(!nb.length){stack.pop();continue;}const n=nb[rnd2()*nb.length|0];seen.add(n);edges.push([r,n]);stack.push(n);}
  for(let k=0;k<3;k++){const a=R[rnd2()*R.length|0],b=R[rnd2()*R.length|0];if(a!==b&&Math.abs(a.i-b.i)+Math.abs(a.j-b.j)===1)edges.push([a,b]);}
  const carve=(x,y,f)=>{for(let b=0;b<2;b++)for(let a=0;a<2;a++){const xx=x+a,yy=y+b;if(xx<1||yy<1||xx>=W-1||yy>=H-1)continue;const k=yy*W+xx;if(g[k]===1){g[k]=0;ft[k]=f;}}};
  for(const [a,b] of edges){const f=THEMES[a.th].path===THEMES[b.th].path?THEMES[a.th].path:(rnd2()<.5?THEMES[a.th].path:THEMES[b.th].path);
    // 曲がりくねった道:目的へ寄りつつ、ときどき横へそれる
    let x=a.cx,y=a.cy,lastSide=0,guard=0;const wide=f===0||f===5;
    while((x!==b.cx||y!==b.cy)&&guard++<600){carve(x,y,f);if(wide&&rnd2()<.25)carve(x-1,y-1,f);
      const dx=b.cx-x,dy=b.cy-y,ax=Math.abs(dx),ay=Math.abs(dy);let mx=0,my=0;
      if(rnd2()<.22&&ax+ay>4){if(ax>ay){my=lastSide||(rnd2()<.5?-1:1);}else{mx=lastSide||(rnd2()<.5?-1:1);}if(rnd2()<.3)lastSide=-lastSide||1;}
      else if(rnd2()*(ax+ay)<ax)mx=Math.sign(dx);else my=Math.sign(dy);
      const nx=x+mx,ny=y+my;if(nx<2||ny<2||nx>=W-3||ny>=H-3){if(ax)x+=Math.sign(dx);else y+=Math.sign(dy);continue;}x=nx;y=ny;}
    carve(x,y,f);}
  // 通路の壁の種類:近い部屋に合わせる
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const k=y*W+x;if(g[k]!==1)continue;let near=null,nd=1e9;for(const r of R){const dd=Math.abs(r.cx-x)+Math.abs(r.cy-y);if(dd<nd){nd=dd;near=r;}}if(near)wt[k]=THEMES[near.th].wall;}
  // 崖の縁を崩して自然な形に(建物の壁はまっすぐのまま)
  const nbF=(x,y)=>{let n=0;for(let b=-1;b<=1;b++)for(let a=-1;a<=1;a++){if(!a&&!b)continue;if(g[(y+b)*W+x+a]!==1)n++;}return n;};
  const rough=[];for(let y=2;y<H-2;y++)for(let x=2;x<W-2;x++){const k=y*W+x;if(g[k]===1&&wt[k]!==1&&nbF(x,y)>=3&&rnd2()<.32+noise(x,y)*.2)rough.push(k);}
  for(const k of rough){g[k]=0;let best=0,bn=0;for(const o of [1,-1,W,-W]){if(g[k+o]===0){best=ft[k+o];bn=1;break;}}ft[k]=bn?best:0;}
  for(let it=0;it<2;it++){const fill=[],open=[];
    for(let y=2;y<H-2;y++)for(let x=2;x<W-2;x++){const k=y*W+x,n=nbF(x,y);if(wt[k]===1)continue;if(g[k]===0&&n<=2)fill.push(k);else if(g[k]===1&&n>=6)open.push(k);}
    for(const k of fill)g[k]=1;for(const k of open){g[k]=0;ft[k]=ft[k-1]||ft[k+1]||0;}}
  for(const r of R)for(let y=r.cy-1;y<=r.cy+1;y++)for(let x=r.cx-1;x<=r.cx+1;x++)if(g[y*W+x]===1)g[y*W+x]=0;
  // 建物の壁は、町の床のそばだけ。奥は崖の暗がりに
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const k=y*W+x;if(g[k]!==1||wt[k]!==1)continue;let near=false;
    for(let b=-2;b<=2&&!near;b++)for(let a=-2;a<=2;a++){const xx=x+a,yy=y+b;if(xx<0||yy<0||xx>=W||yy>=H)continue;const kk=yy*W+xx;if(g[kk]!==1&&(ft[kk]===2||ft[kk]===4)){near=true;break;}}
    if(!near)wt[k]=0;}
  // 部屋の中身(水・桟橋・潮だまり・建物)
  const objs=[],decor=[];const used=new Set();
  for(const r of R){const T=r.th;if(S.terrain)S.terrain(r,{g,ft,wt,W,H,rnd:rnd2,noise});
    if(T==='cove'){const side=['n','e','w'][rnd2()*3|0];const depth=3+(rnd2()*2|0);
      for(let y=r.y0;y<r.y0+r.h;y++)for(let x=r.x0;x<r.x0+r.w;x++){const dd=side==='n'?y-r.y0:side==='e'?r.x0+r.w-1-x:x-r.x0;const k=y*W+x;
        if(g[k]!==0)continue;const dn=dd-(noise(x*1.6,y*1.6)-.5)*5;if(dn<depth-1&&!(Math.abs(x-r.cx)<2&&Math.abs(y-r.cy)<2)){g[k]=3;}else if(dn<depth){g[k]=4;}else if(dn<depth+2){ft[k]=1;}}
      r.water=side;}
    if(T==='tide'){for(let n=0;n<3+(rnd2()*3|0);n++){const px=r.x0+1+(rnd2()*(r.w-3)|0),py=r.y0+1+(rnd2()*(r.h-3)|0),rr=1+rnd2()*1.6;
      for(let y=py-2;y<=py+2;y++)for(let x=px-2;x<=px+2;x++){if(x<r.x0||y<r.y0||x>=r.x0+r.w||y>=r.y0+r.h)continue;const dd=Math.hypot(x-px,y-py);const k=y*W+x;if(dd<rr)g[k]=4;else if(dd<rr+1&&ft[k]===0)ft[k]=1;}}}

      const walk=(x,y)=>{const k=y*W+x;g[k]=0;ft[k]=3;};

      for(let n=0;n<2;n++){const px=r.x0+1+(rnd2()*(r.w-4)|0),py=r.y0+1+(rnd2()*(r.h-4)|0);for(let y=py;y<py+3;y++)for(let x=px;x<px+3;x++)walk(x,y);}
      // 通路の入口は板に
      for(let y=r.y0;y<r.y0+r.h;y++)for(let x=r.x0;x<r.x0+r.w;x++){if(g[y*W+x]!==3)continue;for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){const xx=x+a,yy=y+b;if(xx<r.x0||yy<r.y0||xx>=r.x0+r.w||yy>=r.y0+r.h){if(g[yy*W+xx]===0&&ft[yy*W+xx]!==3){walk(x,y);}}}}}
    if(T==='river'){const y0=r.cy-1+(rnd2()<.5?0:1),fx=r.x0+2+(rnd2()*Math.max(1,r.w-5)|0);
      for(let y=y0-1;y<=y0+1;y++)for(let x=r.x0-1;x<=r.x0+r.w;x++){const k=y*W+x;if(g[k]!==0)continue;g[k]=(x>=fx&&x<fx+3)?4:(y===y0?3:(rnd2()<.6?3:4));}
      for(let y=y0-1;y<=y0+1;y++)for(const x of [r.cx,r.cx+1])if(g[y*W+x]===3&&Math.abs(x-fx)>6)g[y*W+x]=4;}

// =====================================================================
const PFX=(()=>{let gl=null,cvs=null,on=false,W=1,H=1,S=1,DPR=1,prog={},tex={},fb={},buf=null;
  const VS='attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
  const FS={
    comp:`precision mediump float;varying vec2 v;uniform sampler2D sc,li;uniform vec2 px;
      void main(){vec3 b=texture2D(sc,v).rgb;vec3 L=texture2D(li,v).rgb*2.0;
        float e=smoothstep(.72,.95,b.b)*smoothstep(.68,.9,b.g)*smoothstep(.08,.22,b.b-b.r);
        vec3 c=b*L+L*L*.025+b*e*.45;gl_FragColor=vec4(c*.5,1.);}`,
    bright:`precision mediump float;varying vec2 v;uniform sampler2D t;void main(){vec3 c=texture2D(t,v).rgb*2.;float l=max(c.r,max(c.g,c.b));gl_FragColor=vec4(c*smoothstep(.8,1.35,l)*.5,1.);}`,
    blur:`precision mediump float;varying vec2 v;uniform sampler2D t;uniform vec2 d;
      void main(){vec4 s=texture2D(t,v)*.2270;s+=(texture2D(t,v+d*1.385)+texture2D(t,v-d*1.385))*.3162;s+=(texture2D(t,v+d*3.231)+texture2D(t,v-d*3.231))*.0703;gl_FragColor=s;}`,
    fin:`precision mediump float;varying vec2 v;uniform sampler2D t,bl;uniform float asp,str;
      void main(){vec3 c=texture2D(t,v).rgb*2.;vec3 g=texture2D(bl,v).rgb*2.;c+=g*str;
        float l=dot(c,vec3(.299,.587,.114));c=mix(vec3(l),c,1.12);
        c=mix(c*vec3(.86,.92,1.08),c*vec3(1.04,1.,.94),smoothstep(.15,.7,l));
        c=c/(1.+max(l-1.,0.)*.35);
        vec2 q=(v-.5)*vec2(asp,1.);c*=mix(.55,1.,smoothstep(.95,.32,length(q)));gl_FragColor=vec4(c,1.);}`};

  const U=(p,n)=>p.u[n]!==undefined?p.u[n]:(p.u[n]=gl.getUniformLocation(p,n));

  function init(){try{cvs=document.createElement('canvas');cvs.id='pfxcv';cvs.style.cssText='position:fixed;left:0;top:0;display:none;touch-action:none';
      const base=document.getElementById('cv');base.parentNode.insertBefore(cvs,base);
      gl=cvs.getContext('webgl',{alpha:false,antialias:false,premultipliedAlpha:false,preserveDrawingBuffer:false});if(!gl)return false;

  return {init,resize,draw,setEnabled,get ok(){return !!gl;},get on(){return on;}};})();

const PAYV={shot:'撃つ',zone:'広げる',burst:'弾けさせる',chain:'走らせる',slash:'斬りかからせる',sphere:'放つ'};
function linkModes(M,S){const C=M.car,Pp=S.pay,out=[],sn=S.n;
  if(C==='guard'){out.push({k:'counter',n:'受け止めた瞬間、'+sn+'を'+PAYV[Pp]});return out;}
  if((C==='fly'||C==='sphere')&&Pp==='zone')out.push({k:'trail',n:'通った跡に'+sn+'を残す'});
  if(C==='fly'&&(Pp==='shot'||Pp==='chain'))out.push({k:'trail',n:'飛びながら'+sn+'を撒く'});
  if(C==='sphere'||C==='zone'){if(!(C==='zone'&&Pp==='zone'))out.push({k:'emit',n:M.n+'から'+sn+'を'+PAYV[Pp]});}
  if(C==='slash'&&(Pp==='shot'||Pp==='chain'||Pp==='sphere'))out.push({k:'wave',n:'刃の先から'+sn+'が飛ぶ'});
  if(C==='burst'&&(Pp==='shot'||Pp==='sphere'))out.push({k:'ring',n:'輪の形に'+sn+'を撃ち出す'});
  if(['fly','slash','burst','chain','meteor'].includes(C))out.push({k:'impact',n:'当たった所で'+sn+'を'+PAYV[Pp]});
  if(S.el!==M.el&&S.el!=='arcane')out.push({k:'infuse',n:ELEMS[S.el].n+'の力をまとう'});
  if(!out.length)out.push({k:'impact',n:'当たった所で'+sn+'を'+PAYV[Pp]});
  return out;}
const modeName=(M,S,k)=>{const m=linkModes(M,S).find(x=>x.k===k);return m?m.n:'—';};
const mkNode=s=>({s,links:[]});
function weightOf(n){let w=SPELLS[n.s].w;for(const l of n.links)w+=1+(l.m==='infuse'?1:weightOf(l.n));return w;}
function countOf(n){let c=1;for(const l of n.links)c+=countOf(l.n);return c;}
function depthOf(n){let d=0;for(const l of n.links)d=Math.max(d,1+depthOf(l.n));return d;}
function elOf(n){let el=SPELLS[n.s].el;for(const l of n.links)if(l.m==='infuse')el=SPELLS[l.n.s].el;return el;}
function spellText(n){const S=SPELLS[n.s];let s=S.n;const L=n.links.map(l=>modeName(S,SPELLS[l.n.s],l.m));if(L.length)s+=' ＋ '+L.join('、');return s;}

const SP={};
const tgts=(Wd,team)=>team==='p'?Wd.foes.filter(f=>!f.dead&&!f.hide):(Wd.P&&!Wd.P.dead?[Wd.P]:[]);
const yo=t=>t.isP?8:6; // 当たりの高さ
function nearT(Wd,team,x,y,r,ex,seen){let b=null,bd=r;for(const t of tgts(Wd,team)){if(t===ex||(seen&&seen.has(t)))continue;const d=Math.hypot(t.x-x,t.y-yo(t)-y);if(d<bd){bd=d;b=t;}}return b;}
const aimA=(Wd,team,x,y,r,ang,ex)=>{const t=nearT(Wd,team,x,y,r,ex);return t?Math.atan2(t.y-yo(t)-y,t.x-x):ang;};
const linksOf=(n,m)=>n.links.filter(l=>l.m===m);
SP.cast=function(Wd,n,x,y,ang,depth,anchor,mode,src){
  if(depth>4||Wd.ents.length>420)return;
  const S=SPELLS[n.s],el=elOf(n),inf=linksOf(n,'infuse').length,kid=depth>0,scale=kid?(mode==='trail'?.55:.7):1;
  const dmg=S.dmg*src.mul*(src.team==='p'?Wd.pmul(n.s,el,kid):1)*(kid?.75:1)*(1+inf*.15);
  const base={node:n,depth,el,dmg,t:0,src,team:src.team};
  if(S.car==='fly'){const cnt=S.cnt||1,rng=src.team==='p'?Wd.prange():1;
    for(let i=0;i<cnt;i++){const a=ang+(cnt>1?(i-(cnt-1)/2)*(S.spr/(cnt-1)):0);
      Wd.ents.push(Object.assign({k:'proj',x,y,vx:Math.cos(a)*S.spd,vy:Math.sin(a)*S.spd,spd:S.spd,r:S.r,life:S.life*(kid?.85:1)*rng,pierce:S.pierce||0,boom:S.boom||0,homing:S.homing,hit:new Set(),tick:.12,side:1},base));}}
  else if(S.car==='sphere'){Wd.ents.push(Object.assign({k:'sphere',x,y,vx:Math.cos(ang)*S.spd,vy:Math.sin(ang)*S.spd,r:S.r,life:S.life*(kid?.6:1),iv:S.iv,tt:.25,tick:.15,hcd:new Map()},base));}
  else if(S.car==='slash'){let bx=x,by=y,a=ang;
    if(kid){const t=nearT(Wd,src.team,x,y,110,null);if(t){a=Math.atan2(t.y-yo(t)-y,t.x-x);bx=t.x-Math.cos(a)*14;by=t.y-yo(t)-Math.sin(a)*14;}}else{bx=x+Math.cos(a)*6;by=y+Math.sin(a)*6;}
    Wd.ents.push(Object.assign({k:'blade',x:bx,y:by,a,r:S.r*(kid?.85:1),dur:.24,done:false},base));}
  else if(S.car==='burst'){Wd.ents.push(Object.assign({k:'nova',x,y,r:S.r*scale,dur:.3,done:false},base));}
  else if(S.car==='chain'){SP.chain(Wd,base,x,y,S.r,S.jumps);}
  else if(S.car==='zone'){const zx=kid||!anchor?x:anchor.x,zy=kid||!anchor?y:anchor.y;
    Wd.ents.push(Object.assign({k:'zone',x:zx,y:zy,r:S.r*scale,life:S.life*(kid?(mode==='trail'?.5:.7):1),iv:S.iv,tt:.3,emit:.4},base));}
  else if(S.car==='meteor'){let tx=x,ty=y;if(!kid){const t=nearT(Wd,src.team,x,y,130,null);if(t){tx=t.x;ty=t.y-yo(t);}else{tx=x+Math.cos(ang)*50;ty=y+Math.sin(ang)*50;}}
    Wd.ents.push(Object.assign({k:'meteor',x:tx,y:ty,r:S.r*scale,dur:S.delay*(kid?.7:1)},base));}
};
SP.chain=function(Wd,base,x,y,r,j){let px=x,py=y;const seen=new Set();let d=base.dmg;
  for(let i=0;i<=j;i++){const t=nearT(Wd,base.team,px,py,i?70:r,null,seen);if(!t)break;seen.add(t);Wd.fx({t:'zap',x:px,y:py,x2:t.x,y2:t.y-yo(t),el:base.el});
    Wd.hit(t,d,base.el,{x:t.x,y:t.y-yo(t),chain:1,s:base.node.s,team:base.team,ent:base});SP.fire(Wd,base,'impact',t.x,t.y-yo(t),Math.atan2(t.y-py,t.x-px),t);px=t.x;py=t.y-yo(t);d*=.8;}};
SP.fire=function(Wd,e,m,x,y,ang,ex){for(const l of e.node.links){if(l.m!==m)continue;const S=SPELLS[l.n.s];let a=ang;
  if(m==='trail'&&S.pay==='shot'){e.side=-(e.side||1);a=ang+Math.PI/2*e.side;}
  else if(m!=='ring'&&m!=='wave')a=aimA(Wd,e.team,x,y,150,ang,ex);
  SP.cast(Wd,l.n,x,y,a,e.depth+1,null,m,e.src);}};
// 当てる:戻り値 false なら弾は消える(受け流された等)
function hitT(Wd,e,t,dmg,o){o.s=e.node.s;o.team=e.team;o.ent=e;return Wd.hit(t,dmg,e.el,o);}
SP.update=function(Wd,dt){const out=[];
  for(const e of Wd.ents){e.t+=dt;if(e.gone)continue;const T=tgts(Wd,e.team);
    if(e.k==='proj'){e.life-=dt;
      if(e.homing){const t=nearT(Wd,e.team,e.x,e.y,130,null);if(t){const want=Math.atan2(t.y-yo(t)-e.y,t.x-e.x);let a=Math.atan2(e.vy,e.vx),d=want-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;a+=Math.max(-6*dt,Math.min(6*dt,d));e.vx=Math.cos(a)*e.spd;e.vy=Math.sin(a)*e.spd;}}
      const steps=Math.ceil(e.spd*dt/4);let dead=false;
      for(let s=0;s<steps&&!dead;s++){const nx=e.x+e.vx*dt/steps,ny=e.y+e.vy*dt/steps;if(Wd.solid(nx,ny)){dead=true;break;}e.x=nx;e.y=ny;
        for(const f of T){if(e.hit.has(f))continue;if(Math.hypot(f.x-e.x,f.y-yo(f)-e.y)<f.r+e.r+1){e.hit.add(f);const ok=hitT(Wd,e,f,e.dmg,{x:e.x,y:e.y,proj:1});if(ok===false||e.gone){dead=true;e.nofire=1;break;}
          SP.fire(Wd,e,'impact',e.x,e.y,Math.atan2(e.vy,e.vx),f);if(e.pierce>0)e.pierce--;else{dead=true;break;}}}}
      if(!e.gone){e.tick-=dt;if(e.tick<=0){e.tick=.12;SP.fire(Wd,e,'trail',e.x,e.y,Math.atan2(e.vy,e.vx),null);}}
      if(e.gone)continue;
      if(dead||e.life<=0){if(e.boom&&!e.nofire){Wd.fx({t:'ring',x:e.x,y:e.y,r:e.boom,el:e.el});for(const f of tgts(Wd,e.team))if(Math.hypot(f.x-e.x,f.y-yo(f)-e.y)<e.boom+f.r)hitT(Wd,e,f,e.dmg*.6,{x:e.x,y:e.y,chain:1});}
        if(!e.hit.size&&!e.nofire)SP.fire(Wd,e,'impact',e.x,e.y,Math.atan2(e.vy,e.vx),null);Wd.fx({t:'pop',x:e.x,y:e.y,el:e.el});continue;}}
    else if(e.k==='sphere'){e.life-=dt;const nx=e.x+e.vx*dt,ny=e.y+e.vy*dt;if(!Wd.solid(nx,ny)){e.x=nx;e.y=ny;}else{e.vx*=-1;e.vy*=-1;}
      for(const f of T){if(Math.hypot(f.x-e.x,f.y-yo(f)-e.y)<f.r+e.r&&!((e.hcd.get(f)||0)>e.t)){e.hcd.set(f,e.t+.5);hitT(Wd,e,f,e.dmg*.5,{x:e.x,y:e.y,chain:1});}}
      e.tt-=dt;if(e.tt<=0){e.tt=e.iv;const t=nearT(Wd,e.team,e.x,e.y,80,null);if(t){if(linksOf(e.node,'emit').length)SP.fire(Wd,e,'emit',e.x,e.y,0,null);else{Wd.fx({t:'zap',x:e.x,y:e.y,x2:t.x,y2:t.y-yo(t),el:e.el});hitT(Wd,e,t,e.dmg,{x:t.x,y:t.y-yo(t),chain:1});}}}
      e.tick-=dt;if(e.tick<=0){e.tick=.15;SP.fire(Wd,e,'trail',e.x,e.y,Math.atan2(e.vy,e.vx),null);}
      if(e.life<=0){Wd.fx({t:'ring',x:e.x,y:e.y,r:12,el:e.el});continue;}}
    else if(e.k==='blade'){if(!e.done&&e.t>=.07){e.done=true;for(const f of T){const dx=f.x-e.x,dy=f.y-yo(f)-e.y,d=Math.hypot(dx,dy);let da=Math.atan2(dy,dx)-e.a;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
        if(d<e.r+f.r&&(Math.abs(da)<1.25||d<10)){hitT(Wd,e,f,e.dmg,{x:f.x,y:f.y-yo(f)});SP.fire(Wd,e,'impact',f.x,f.y-yo(f),e.a,f);}}
        if(e.team==='p')Wd.cutProj(e.x,e.y,e.r,e.a);SP.fire(Wd,e,'wave',e.x+Math.cos(e.a)*e.r*.7,e.y+Math.sin(e.a)*e.r*.7,e.a,null);}
      if(e.t>=e.dur)continue;}
    else if(e.k==='nova'){if(!e.done){e.done=true;for(const f of T){if(Math.hypot(f.x-e.x,f.y-yo(f)-e.y)<e.r+f.r){hitT(Wd,e,f,e.dmg,{x:e.x,y:e.y});SP.fire(Wd,e,'impact',f.x,f.y-yo(f),Math.atan2(f.y-e.y,f.x-e.x),f);}}
        if(linksOf(e.node,'ring').length){const n=6,o=Math.random()*6.28;for(let i=0;i<n;i++)SP.fire(Wd,e,'ring',e.x,e.y,o+i*Math.PI*2/n,null);}}
      if(e.t>=e.dur)continue;}
    else if(e.k==='zone'){e.life-=dt;e.tt-=dt;
      if(e.tt<=0){e.tt=e.iv;for(const f of T)if(Math.hypot(f.x-e.x,(f.y-e.y)/.75)<e.r+f.r)hitT(Wd,e,f,e.dmg,{x:e.x,y:e.y,chain:1,zone:1});}
      e.emit-=dt;if(e.emit<=0){e.emit=.8;if(nearT(Wd,e.team,e.x,e.y,140,null))SP.fire(Wd,e,'emit',e.x,e.y-4,0,null);}
      if(Math.random()<dt*e.r*.5)Wd.part(e.x+(Math.random()-.5)*e.r*1.6,e.y+(Math.random()-.5)*e.r*1.1,ELEMS[e.el].c[1+(Math.random()*2|0)],1);
      if(e.life<=0)continue;}
    else if(e.k==='meteor'){if(e.t>=e.dur){Wd.fx({t:'ring',x:e.x,y:e.y,r:e.r,el:e.el,life:.4});Wd.shake(3);
        for(const f of T)if(Math.hypot(f.x-e.x,f.y-yo(f)-e.y)<e.r+f.r)hitT(Wd,e,f,e.dmg,{x:e.x,y:e.y});
        SP.fire(Wd,e,'impact',e.x,e.y,0,null);for(let i=0;i<14;i++)Wd.part(e.x,e.y,ELEMS[e.el].c[i%3]);continue;}}
    out.push(e);}
  Wd.ents.length=0;for(const e of out)Wd.ents.push(e);};
SP.castRoot=function(Wd,n,x,y,ang,anchor,src,twin){if(twin){SP.cast(Wd,n,x,y,ang-.16,0,anchor,null,src);SP.cast(Wd,n,x,y,ang+.16,0,anchor,null,src);}else SP.cast(Wd,n,x,y,ang,0,anchor,null,src);};

BH.clear=function(){BH.b.length=0;BH.l.length=0;};
BH.update=function(G,dt){const P=G.P,px=P.x,py=P.y-8,keep=[];

    if(q.spin){const a=Math.atan2(q.vy,q.vx)+q.spin*dt,s=Math.hypot(q.vx,q.vy);q.vx=Math.cos(a)*s;q.vy=Math.sin(a)*s;}
    if(q.acc){const s=Math.hypot(q.vx,q.vy),n=Math.max(0,s+q.acc*dt);if(s>0){q.vx*=n/s;q.vy*=n/s;}}
    if(q.home&&!P.dead){const a=Math.atan2(py-q.y,px-q.x),c=Math.atan2(q.vy,q.vx);let d=a-c;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;const na=c+Math.max(-q.home*dt,Math.min(q.home*dt,d)),s=Math.hypot(q.vx,q.vy);q.vx=Math.cos(na)*s;q.vy=Math.sin(na)*s;}

    if(q.then&&q.t>q.then.at&&!q.fired){q.fired=1;q.then.f(q);if(q.then.die){continue;}}
    if(q.life<=0||G.solidB(q.x,q.y))continue;

    if(e.burn>0){e.burn-=dt;e.bt-=dt;if(e.bt<=0){e.bt=.5;const v=Math.round((3+save.lv*.4)*(e.dark?1.6:1));e.hp-=v;nums.push({x:e.x+(rnd()-.5)*8,y:e.y-16,v,t:0,col:e.dark?'#c080ff':'#ff9a50'});if(e.hp<=0&&e.kind!=='dummy'){killMon(e);continue;}}}else e.dark=0;

  if(a.k==='acc'){const Q=QUESTS[a.id];save.quests[a.id]='active';save.prog[a.id]=0;if(Q.accept&&Q.accept.spell){save.known[Q.accept.spell]=1;let k=-1;for(let i=0;i<nSlots();i++)if(!slotN(i)){k=i;break;}if(k>=0)save.slots[k]=mkNode(Q.accept.spell);toast('「'+SPELLS[Q.accept.spell].n+'」を覚えた。'+(k>=0?'右下の枠に入れた。当たる瞬間に押そう':'杖と魔術で枠に入れよう'),'#c8a8ff');}
    if(Q.type==='boss'&&save.flags[Q.flag])save.quests[a.id]='ready';persist();hud();}
  if(a.k==='exam'){loadArea('duel');}
  if(a.k==='spells')openMenu('learn');if(a.k==='staffs')openMenu('staffs');}

// ===================== 杖と魔術(メニュー) =====================
let menuTab='staff',slotSel=null;
function openMenu(tab){if(state!=='play'&&state!=='menu')return;state='menu';joy={on:false,id:null,ox:0,oy:0,x:0,y:0};menuTab=tab||menuTab;if(menuTab==='learn'||menuTab==='staffs'){}$('menu').classList.remove('hide');renderMenu();}
function closeMenu(){state='play';$('menu').classList.add('hide');$('pk').classList.add('hide');persist();hud();}
$('b-mclose').onclick=closeMenu;$('pk-x').onclick=()=>{$('pk').classList.add('hide');if(state==='menu'&&$('menu').classList.contains('hide'))state='play';};
function pick(title,items,cb){$('pk-t').textContent=title;$('pk-l').innerHTML=items.map((it,i)=>`<button class="pi ${it.cls||''}" data-i="${i}" ${it.off?'disabled':''}><b>${it.n}</b><span>${it.d||''}</span><em>${it.w!=null?'理解 '+it.w:''}</em></button>`).join('')||'<p class="small">選べるものがない</p>';
  $('pk').classList.remove('hide');$('pk-l').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{$('pk').classList.add('hide');cb(items[+b.dataset.i].k);if(!$('menu').classList.contains('hide'))renderMenu();});}
function renderMenu(){const tabs=[['staff','杖'],['book','魔術'],['tree','星図'],['quest','課題']];if(menuTab==='learn'||menuTab==='staffs')tabs.push([menuTab,menuTab==='learn'?'書庫':'工房']);
  $('m-tabs').innerHTML=tabs.map(([k,n])=>`<button class="tab${k===menuTab?' on':''}" data-t="${k}">${n}</button>`).join('');$('m-tabs').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{menuTab=b.dataset.t;renderMenu();});
  $('m-head').innerHTML=`Lv ${save.lv} ・ ランク${save.rank} ・ 魔晶 ${save.gems} ・ 理解 ${capOf()}`;
  const B=$('m-body');B.className='m-'+menuTab;
  if(menuTab==='staff')renderStaff(B);else if(menuTab==='book')renderBook(B);else if(menuTab==='tree')renderTree(B);else if(menuTab==='quest')renderQuests(B);else if(menuTab==='learn')renderLearn(B);else renderStaffs(B);}
// ---- 杖:枠ごとに、主の穴と結びの穴 ----
const elCol=el=>ELEMS[el].c[1];
function sockList(st){const L=[];st.slots.forEach((cnt,gi)=>{const root=save.slots[gi];for(let i=0;i<cnt;i++)L.push({g:gi,i,n:i===0?root:(root&&root.links[i-1]?root.links[i-1].n:null)});});return L;}
function renderStaff(B){const st=staff(),cap=capOf(),socks=sockList(st);
  B.innerHTML=`<div class="staffwrap"><canvas id="staffcv" width="64" height="170"></canvas>${socks.map((s,k)=>{const [x,y]=sockXY(st,s.g,s.i);return `<button class="sock${s.n?' full':''}${s.i?' link':''}" data-k="${k}" style="--c:${s.n?elCol(SPELLS[s.n.s].el):'#4a4f70'};left:${x*2-15}px;top:${y*2-15}px">${s.n?(SPELLS[s.n.s].sh||SPELLS[s.n.s].n.slice(0,2)):s.i?'結':s.g+1}</button>`;}).join('')}</div>
    <div class="slots"><h4>${st.n}</h4><p class="small">${st.d}</p><p class="small dim">理解の上限 ${cap}（枠ごと）</p>
      ${st.slots.map((cnt,gi)=>{const n=save.slots[gi],w=n?weightOf(n):0;return `<div class="grp"><h5>枠 ${gi+1}${n?(isGrd(n)?'・守り（押して唱える）':'・攻め（押すと切り替え）'):''}</h5>
        ${n?`<div class="wbar"><div class="wfill${w>cap?' bad':''}" style="width:${Math.min(100,w/cap*100)}%"></div><span>理解 ${w} / ${cap}</span></div>`:''}
        ${n?`<div class="srow"><span class="dot" style="background:${elCol(SPELLS[n.s].el)}"></span><b>${SPELLS[n.s].n}</b></div>`+n.links.map((l,li)=>`<div class="srow sub">└ <b>${SPELLS[l.n.s].n}</b><button class="chip mode" data-mode="${gi}:${li}">${modeName(SPELLS[n.s],SPELLS[l.n.s],l.m)} ▾</button></div>`).join(''):'<p class="small dim">空いている。杖の宝石を押して魔術をはめる</p>'}
        ${cnt>1&&n?`<p class="small dim">結べる数 ${n.links.length} / ${cnt-1}</p>`:''}</div>`;}).join('')}</div>`;
  drawStaffArt($('staffcv'),st,socks);
  B.querySelectorAll('.sock').forEach(b=>b.onclick=()=>slotPick(socks[+b.dataset.k]));
  B.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{const [gi,li]=b.dataset.mode.split(':').map(Number),root=save.slots[gi],L=root.links[li];
    pick('結び方',linkModes(SPELLS[root.s],SPELLS[L.n.s]).map(m=>({k:m.k,n:m.n})),k=>{L.m=k;});});}
// 杖の絵(64×170 を2倍で見せる)と宝石の位置
function sockXY(st,gi,i){const head=st.shape==='fork'?[[14,22],[50,22],[32,10]]:st.shape==='ward'?[[22,20],[42,20],[32,8]]:st.shape==='thin'?[[32,14],[24,30],[40,30]]:[[32,16],[32,40],[32,64]];
  if(gi===0)return head[i];const y=gi===1?96:132;return i===0?[32,y]:[i%2?18:46,y+10];}
function drawStaffArt(c,st,socks){const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,64,170);const wood=st.wood,dk='#140e0c',hi='rgba(255,240,220,.28)';
  const glow=(x,y,r,col)=>{const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);};
  glow(32,20,36,st.head+'40');
  // 柄:木目と、ところどころの金の輪
  for(let y=26;y<166;y++){const x=32+Math.round(Math.sin(y*.06)*1.2);g.fillStyle=dk;g.fillRect(x-4,y,9,1);g.fillStyle=wood;g.fillRect(x-3,y,7,1);g.fillStyle=hi;g.fillRect(x-2,y,1,1);g.fillStyle='rgba(0,0,0,.28)';g.fillRect(x+2,y,2,1);if((y*7)%11===0){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x-1,y,2,1);}}
  for(const y of [84,120,156]){g.fillStyle=dk;g.fillRect(27,y-1,11,6);g.fillStyle='#c8a040';g.fillRect(28,y,9,4);g.fillStyle='#f2d070';g.fillRect(28,y,9,1);g.fillStyle='#8a6a20';g.fillRect(28,y+3,9,1);}
  g.fillStyle=dk;g.fillRect(28,164,9,5);g.fillStyle='#c8a040';g.fillRect(29,165,7,3);
  // 頭
  const vine=(x0,y0,x1,y1)=>{for(let t=0;t<=1;t+=.02){const x=x0+(x1-x0)*t+Math.sin(t*9)*1.5,y=y0+(y1-y0)*t;g.fillStyle=dk;g.fillRect(Math.round(x)-2,Math.round(y)-1,5,3);g.fillStyle=wood;g.fillRect(Math.round(x)-1,Math.round(y),3,1);}};
  if(st.shape==='fork'){vine(32,34,14,22);vine(32,34,50,22);vine(14,22,10,8);vine(50,22,54,8);vine(32,34,32,12);}
  else if(st.shape==='ward'){g.fillStyle=dk;g.fillRect(12,6,41,28);g.fillStyle='#3a3a48';g.fillRect(13,7,39,26);g.fillStyle='#5a5a6a';g.fillRect(13,7,39,3);g.fillStyle='#2a2a36';g.fillRect(13,30,39,3);for(const x of [16,48]){g.fillStyle='#8a93a8';g.fillRect(x,10,1,20);}g.fillStyle=dk;g.fillRect(29,33,7,4);}
  else if(st.shape==='thin'){vine(32,34,32,6);vine(32,30,22,24);vine(32,30,42,24);g.fillStyle='#6fe8c8';g.fillRect(31,4,3,3);}
  else{g.fillStyle=dk;g.beginPath();g.arc(32,18,14,0,6.28);g.fill();g.fillStyle=wood;g.beginPath();g.arc(32,18,12,0,6.28);g.fill();g.fillStyle=dk;g.beginPath();g.arc(32,18,8,0,6.28);g.fill();g.fillStyle=hi;g.fillRect(24,10,3,2);}
  // 枠ごとの結び(主の宝石から光の線)
  st.slots.forEach((cnt,gi)=>{const ss=socks.filter(s=>s.g===gi);if(!ss[0].n)return;const [x0,y0]=sockXY(st,gi,0);for(const s of ss.slice(1)){if(!s.n)continue;const [x1,y1]=sockXY(st,gi,s.i),col=ELEMS[SPELLS[s.n.s].el].c[1];
    g.strokeStyle=col;g.globalAlpha=.4;g.lineWidth=4;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();g.globalAlpha=1;g.lineWidth=1;g.strokeStyle='#ffffff';g.beginPath();g.moveTo(x0+.5,y0+.5);g.lineTo(x1+.5,y1+.5);g.stroke();}});
  // 宝石の台座
  for(const s of socks){const [x,y]=sockXY(st,s.g,s.i);if(s.n)glow(x,y,14,ELEMS[SPELLS[s.n.s].el].c[1]+'99');g.fillStyle=dk;g.beginPath();g.arc(x,y,9,0,6.28);g.fill();g.fillStyle='#c8a040';g.beginPath();g.arc(x,y,8,0,6.28);g.fill();g.fillStyle='#8a6a20';g.beginPath();g.arc(x,y,6,0,6.28);g.fill();}}
function slotPick(s){const gi=s.g,i=s.i,root=save.slots[gi],known=Object.keys(SPELLS).filter(k=>save.known[k]);
  if(i===0){const items=known.map(k=>({k,n:SPELLS[k].n,d:(SPELLS[k].kind==='grd'?'【守り】':'')+SPELLS[k].d,w:SPELLS[k].w,cls:'el-'+SPELLS[k].el}));if(root)items.push({k:'__rm',n:'外す',d:''});
    pick('枠 '+(gi+1)+' の魔術',items,k=>{if(k==='__rm'){save.slots[gi]=null;return;}if(root){root.s=k;if(isGrd(root))for(const l of root.links)l.m='counter';fixModes(root);}else save.slots[gi]=mkNode(k);});return;}
  if(!root){toast('先に、主の宝石に魔術をはめよう','#cfd8ec');return;}
  const L=root.links[i-1],atk=known.filter(k=>SPELLS[k].kind==='atk');const items=atk.map(k=>({k,n:SPELLS[k].n,d:linkModes(SPELLS[root.s],SPELLS[k]).map(m=>m.n).join(' ／ '),w:SPELLS[k].w+1,cls:'el-'+SPELLS[k].el}));if(L)items.push({k:'__rm',n:'外す',d:''});
  pick(SPELLS[root.s].n+'に結ぶ魔術',items,k=>{if(k==='__rm'){root.links.splice(i-1,1);return;}const m=linkModes(SPELLS[root.s],SPELLS[k])[0].k;if(L){L.n=mkNode(k);L.m=m;}else root.links.push({m,n:mkNode(k)});fixModes(root);});}
function fixModes(n){for(const l of n.links){const ms=linkModes(SPELLS[n.s],SPELLS[l.n.s]);if(!ms.find(m=>m.k===l.m))l.m=ms[0].k;}}
// ---- 魔術の一覧 ----
function renderBook(B){const known=Object.keys(SPELLS).filter(k=>save.known[k]);
  B.innerHTML=known.map(k=>{const S=SPELLS[k],m=save.mast[k]||0,l=mastLv(m),nx=MAST[l]||null,up=Object.keys(SPELLS).find(u=>SPELLS[u].req&&SPELLS[u].req.from&&SPELLS[u].req.from[0]===k);
    return `<div class="card"><div class="ct"><span class="dot" style="background:${elCol(S.el)}"></span><b>${S.n}</b><em>${S.kind==='grd'?'守り':ELEMS[S.el].n}・理解 ${S.w}</em></div><p class="small">${S.d}</p>
      <div class="mbar"><div style="width:${nx?Math.min(100,(m-MAST[l-1])/(nx-MAST[l-1])*100):100}%"></div><span>熟練 Lv${l}${nx?'':'（極み）'}　傷 +${(l-1)*8}%</span></div>${up?`<p class="small dim">熟練 Lv${SPELLS[up].req.from[1]} で「${save.known[up]?SPELLS[up].n:'？？？'}」を学べる</p>`:''}</div>`;}).join('');}
// ---- 書庫 ----
function learnState(k){const S=SPELLS[k],r=S.req||{};if(save.known[k])return {st:'known'};
  if(r.quest||r.accept)return {st:'quest',why:'課題の礼で覚える'};
  if(r.from){const ok=mastLv(save.mast[r.from[0]]||0)>=r.from[1]&&save.known[r.from[0]];return ok?{st:'can',cost:r.cost}:{st:'lock',why:SPELLS[r.from[0]].n+'の熟練 Lv'+r.from[1]+' で学べる',hide:!save.known[r.from[0]]};}
  if(r.rank){const d=rankIx(r.rank)-rankIx(save.rank);if(d<=0)return {st:'can',cost:r.cost};return {st:'lock',why:r.forbid?'禁書。まだ表紙も開かない':'ランク'+r.rank+' で学べる',hide:d>1&&!r.forbid,forbid:r.forbid};}
  return {st:'lock',why:''};}
function renderLearn(B){const L=Object.keys(SPELLS).filter(k=>!SPELLS[k].enemy&&!SPELLS[k].req.start);
  B.innerHTML='<p class="small">書庫番オーウェン「読める本から、読んでいきなさい」</p>'+L.map(k=>{const S=SPELLS[k],s=learnState(k);const name=s.hide?'？？？':s.forbid?'？？？（黒い背表紙）':S.n;
    return `<div class="card ${s.st}"><div class="ct"><span class="dot" style="background:${s.hide||s.forbid?'#3a3f5c':elCol(S.el)}"></span><b>${name}</b><em>${s.hide||s.forbid?'':(S.kind==='grd'?'守り':ELEMS[S.el].n)}</em></div>${s.hide||s.forbid?'':`<p class="small">${S.d}</p>`}
      ${s.st==='known'?'<p class="small ok">修得済み</p>':s.st==='can'?`<button class="pf buy" data-l="${k}" ${save.gems<s.cost?'disabled':''}>魔晶 ${s.cost} で学ぶ</button>`:`<p class="small dim">${s.why}</p>`}</div>`;}).join('');
  B.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const k=b.dataset.l,s=learnState(k);if(save.gems<s.cost)return;save.gems-=s.cost;save.known[k]=1;toast('「'+SPELLS[k].n+'」を学んだ','#c8a8ff');persist();renderMenu();});}
// ---- 工房(杖) ----
function renderStaffs(B){B.innerHTML='<p class="small">杖職人ベルナ「どれでも手に取ってみな」</p>'+Object.keys(STAFFS).map(k=>{const s=STAFFS[k],own=save.staffs.includes(k),r=s.req||{},ok=!r.rank||rankIx(save.rank)>=rankIx(r.rank);
    return `<div class="card"><div class="ct"><span class="dot" style="background:${s.head}"></span><b>${ok||own?s.n:'？？？'}</b><em>枠 ${s.slots.length}・結び ${s.slots.map(c=>c-1).join('/')}</em></div><p class="small">${ok||own?s.d:'ランク'+r.rank+'になったら見せてやるよ'}</p>
      ${own?(save.staff===k?'<p class="small ok">手にしている</p>':`<button class="pf buy" data-eq="${k}">持ち替える</button>`):ok&&r.cost?`<button class="pf buy" data-buy="${k}" ${save.gems<r.cost?'disabled':''}>魔晶 ${r.cost} で買う</button>`:ok&&r.reward?'<p class="small dim">課題の礼で手に入る</p>':''}</div>`;}).join('');
  B.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{equipStaff(b.dataset.eq);renderMenu();});
  B.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const k=b.dataset.buy;if(save.gems<STAFFS[k].req.cost)return;save.gems-=STAFFS[k].req.cost;save.staffs.push(k);equipStaff(k);toast('「'+STAFFS[k].n+'」を買った','#ffd27a');renderMenu();});}
function equipStaff(k){save.staff=k;const st=STAFFS[k];for(let gi=0;gi<st.slots.length;gi++){const n=save.slots[gi];if(n)while(n.links.length>st.slots[gi]-1)n.links.pop();}persist();hudSlots();}
// ---- 星図 ----
let treeSel=0;
function treeAvail(id){return !save.tree.includes(id)&&TREE[id].adj.some(a=>save.tree.includes(a));}
const pts=()=>save.lv-1-(save.tree.length-1);
function renderTree(B){const sel=TREE[treeSel],own=save.tree.includes(treeSel),av=treeAvail(treeSel);
  const lines=[];for(const n of TREE)for(const a of n.adj)if(a>n.id){const m=TREE[a],on=save.tree.includes(n.id)&&save.tree.includes(a);lines.push(`<line x1="${n.x}" y1="${n.y}" x2="${m.x}" y2="${m.y}" class="${on?'on':''}"/>`);}
  B.innerHTML=`<div class="treebox"><svg viewBox="-215 -215 430 430" id="treesvg">${lines.join('')}${TREE.map(n=>`<circle cx="${n.x}" cy="${n.y}" r="${n.big?9:5}" class="nd${save.tree.includes(n.id)?' own':treeAvail(n.id)?' av':''}${n.id===treeSel?' sel':''}" style="--c:${n.c||'#f2c440'}" data-n="${n.id}"/>`).join('')}</svg></div>
    <div class="tinfo"><b>${sel.n}</b><p class="small">${sel.d}</p><p class="small">振れる点：${pts()}</p>
    ${own&&treeSel?'<p class="small ok">振ってある</p>':av?`<button class="pf buy" id="t-take" ${pts()<=0?'disabled':''}>この星に点を振る</button>`:treeSel?'<p class="small dim">つながった星からしか振れない</p>':''}
    <button class="pf chip" id="t-reset">星図を解く（点を戻す）</button></div>`;
  B.querySelectorAll('[data-n]').forEach(c=>c.onclick=()=>{treeSel=+c.dataset.n;renderMenu();});
  if($('t-take'))$('t-take').onclick=()=>{if(pts()<=0)return;save.tree.push(treeSel);calcMods();persist();hud();renderMenu();};
  $('t-reset').onclick=()=>{save.tree=[0];calcMods();persist();hud();renderMenu();};}
function renderQuests(B){const L=Object.keys(QUESTS).filter(id=>['active','ready'].includes(qSt(id)));const D=Object.keys(QUESTS).filter(id=>qSt(id)==='done');
  B.innerHTML=(L.length?L.map(id=>{const Q=QUESTS[id];return `<div class="card"><div class="ct"><b>${Q.name}</b><em>${PEOPLE[Q.who].n}</em></div><p class="small">${Q.desc}</p><p class="small ${qSt(id)==='ready'?'ok':''}">${qSt(id)==='ready'?'果たした。報告しよう':Q.n?(save.prog[id]||0)+' / '+Q.n:'まだ'}</p></div>`;}).join(''):'<p class="small">受けている課題はない。学院の人と話してみよう</p>')+
    (D.length?'<h5>果たした課題</h5>'+D.map(id=>`<p class="small dim">${QUESTS[id].name}</p>`).join(''):'');}

// ===================== はじめ =====================
function title(){state='title';$('title').classList.remove('hide');$('t-ver').textContent='ver'+GAME_V;
  $('t-go').textContent=save.started?'つづきから':'入学する';$('t-go').onclick=()=>{$('title').classList.add('hide');state='play';const first=!save.started;save.started=1;calcMods();P.max=maxHp();P.hp=P.max;loadArea(save.area||'academy');hud();
    if(first)later.push({t:.8,f:()=>toast('教授に話しかけてみよう（近くで「話す」）','#ffd27a')});};
  $('t-reset').onclick=()=>{if(confirm('記録を消して、はじめから入学しなおしますか？')){save=fresh();persist();title();}};}
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(state==='play')step(dt);render();requestAnimationFrame(frame);}
title();requestAnimationFrame(frame);
window.__g={P,get mons(){return mons;},get save(){return save;},loadArea,get state(){return state;},talk,openMenu,closeMenu,gainExp,get ents(){return ents;},questProg,hurt,useSlot,dialog,setGod:v=>{window.__god=v;}};

// 新しい版を探す:開いたとき・前に戻ってきたとき。タイトルか宿営地にいれば、そのまま読み込み直す
let __pendingUpd=false;function __chkUpd(){if(location.protocol!=='https:')return;fetch('version.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{if(j&&j.v&&j.v!==window.BUILD_V){let done='';try{done=localStorage.getItem('js_upd')||'';}catch(e){}if(done!==j.v){__pendingUpd=j.v;__tryUpd();}}}).catch(()=>{});}
function __tryUpd(){if(!__pendingUpd)return;try{if(typeof state!=='undefined'&&(state==='title'||state==='menu')){try{localStorage.setItem('js_upd',__pendingUpd);}catch(e){}__pendingUpd=false;location.reload();}}catch(e){}}
addEventListener('load',()=>setTimeout(__chkUpd,1500));document.addEventListener('visibilitychange',()=>{if(!document.hidden)__chkUpd();});setInterval(__tryUpd,3000);</script></body></html>
