function gridImg(rows,pal,opt){opt=opt||{};const h=rows.length,w=Math.max(...rows.map(r=>r.length)),P=1,W=w+P*2,H=h+P*2,data=new Uint8ClampedArray(W*H*4);
  const at=(x,y)=>(y<0||y>=h||x<0||x>=w)?'.':(rows[y][x]||'.');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=at(x,y);if(ch==='.')continue;const c=hexRGB(pal[ch]||'#ff00ff');const k=((y+P)*W+x+P)*4;data[k]=c[0];data[k+1]=c[1];data[k+2]=c[2];data[k+3]=255;}
  if(!opt.noOutline)for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){if(at(x,y)!=='.')continue;const n=[[x,y+1],[x,y-1],[x-1,y],[x+1,y]].find(([a,b])=>at(a,b)!=='.');if(!n)continue;
    const c=hexRGB(pal[at(n[0],n[1])]);const k=((y+P)*W+x+P)*4;data[k]=Math.round(c[0]*.26+6);data[k+1]=Math.round(c[1]*.22+5);data[k+2]=Math.round(c[2]*.28+14);data[k+3]=255;}
  return {w:W,h:H,data};}

const FW_=60,FH_=76;
const THEMES={

  tide:{n:'潮だまり',floor:0,path:0,wall:0,en:['crab','crab','gull']},

  house:{n:'商館',floor:4,path:2,wall:1,en:['guard','thief','guard']},

  hita:{n:'ヒタの寝床',floor:7,path:6,wall:2,en:['boar','serpent','infected']},

const FLOOR_THEMES={1:['cove','cove','tide','street'],2:['cove','tide','dock','street','market'],3:['dock','street','market','house','tide'],4:['street','market','house','house','dock'],6:['house','house','market','street'],7:['house','house','house','market','street']};
function genFloor(d,S){const W=FW_,H=FH_,N=W*H;S=S||{};
  for(let tries=0;tries<40;tries++){
  const g=new Uint8Array(N).fill(1),ft=new Uint8Array(N),wt=new Uint8Array(N);const rnd2=Math.random;

  const pool=(S.themes||FLOOR_THEMES)[d]||(S.themes||FLOOR_THEMES)[4];
  for(let j=0;j<CY;j++)for(let i=0;i<CX;i++){if(rnd2()<.12&&!(j===CY-1&&i===1)){rooms.push(null);continue;}
    const th=pool[rnd2()*pool.length|0];const big=th==='dock'||th==='cove';

  const R=rooms.filter(Boolean);for(const r of R){r.cx=r.x0+(r.w>>1);r.cy=r.y0+(r.h>>1);}

  const noise=(x,y)=>{const fx=x/5,fy=y/5,ix=fx|0,iy=fy|0,tx=fx-ix,ty=fy-iy,sm=t=>t*t*(3-2*t),a=NZ[iy*nzW+ix],b=NZ[iy*nzW+ix+1],c=NZ[(iy+1)*nzW+ix],e=NZ[(iy+1)*nzW+ix+1];const u=sm(tx),v=sm(ty);return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+e*u)*v;};
  const natural=th=>['cove','tide','jungle','river','glade','camp','deep','hita'].includes(th)||(S.natural||[]).includes(th);
  for(const r of R){const T=THEMES[r.th];

      const rx=r.w/2+1,ry=r.h/2+1;

        for(let n=0;n<1+(rnd2()*2|0);n++){const w=3+(rnd2()*5|0),h=3+(rnd2()*4|0);const side=rnd2()*4|0;let x0,y0;
          if(side===0){x0=r.x0+(rnd2()*(r.w-2)|0);y0=r.y0-h+1;}else if(side===1){x0=r.x0+(rnd2()*(r.w-2)|0);y0=r.y0+r.h-1;}
          else if(side===2){x0=r.x0-w+1;y0=r.y0+(rnd2()*(r.h-2)|0);}else{x0=r.x0+r.w-1;y0=r.y0+(rnd2()*(r.h-2)|0);}

  const at=(i,j)=>rooms[j*CX+i];const edges=[],seen=new Set();const start=at(1,CY-1);

    if(!nb.length){stack.pop();continue;}const n=nb[rnd2()*nb.length|0];seen.add(n);edges.push([r,n]);stack.push(n);}
  for(let k=0;k<3;k++){const a=R[rnd2()*R.length|0],b=R[rnd2()*R.length|0];if(a!==b&&Math.abs(a.i-b.i)+Math.abs(a.j-b.j)===1)edges.push([a,b]);}
  const carve=(x,y,f)=>{for(let b=0;b<2;b++)for(let a=0;a<2;a++){const xx=x+a,yy=y+b;if(xx<1||yy<1||xx>=W-1||yy>=H-1)continue;const k=yy*W+xx;if(g[k]===1){g[k]=0;ft[k]=f;}}};
  for(const [a,b] of edges){const f=THEMES[a.th].path===THEMES[b.th].path?THEMES[a.th].path:(rnd2()<.5?THEMES[a.th].path:THEMES[b.th].path);
    // 曲がりくねった道:目的へ寄りつつ、ときどき横へそれる

// ---- 毒 ----
function poisonP(sec){if(!P||P.dead||god)return;const was=P.poison>0;P.poison=Math.max(P.poison||0,sec);if(!was)nums.push({x:P.x,y:P.y-22,v:'毒',t:0,col:'#9ae07a'});}

// ---- 普通の敵 ----
function woodAI(e,dt,d,a){const p=P;
  switch(e.kind){
  case 'boar':
    if(e.st==='move'){chase(e,dt,e.spd,a);if(d<96&&e.cd<=0){e.st='wind';e.t=.6;e.dir=a;tels.push({type:'line',x:e.x,y:e.y-3,a,len:100,w:12,t:.6,dur:.6,own:e,fixed:1});}}

    else if(e.st==='dash'){e.t-=dt;const ok=move(e,Math.cos(e.dir)*220*dt,Math.sin(e.dir)*220*dt);e.face=Math.cos(e.dir)>=0?1:-1;
      if(!e.hit&&d<e.r+p.r+3){e.hit=1;hurt(e.dmg*1.3);p.kx=(p.kx||0)+Math.cos(e.dir)*140;p.ky=(p.ky||0)+Math.sin(e.dir)*140;}
      if(!ok){e.st='rec';e.t=.9;shake(2);for(let i=0;i<6;i++)parts.push({x:e.x,y:e.y-4,vx:(rnd()-.5)*60,vy:-rnd()*50,t:0,life:.4,col:'#8a6a48',g:1});}
      else if(e.t<=0){e.st='rec';e.t=.5;}if(e.st==='rec')e.cd=1.6+rnd();}
    else{e.t-=dt;if(e.t<=0)e.st='move';}
    break;
  case 'frog':
    if(e.st==='move'){e.hop=(e.hop||0)-dt;if(e.hop<=0){e.hop=.7+rnd()*.5;e.ang=a+(rnd()-.5)*2.4+(d<50?Math.PI:0);}if(e.hop>.45)chase(e,dt,e.spd*2.2,e.ang);
      if(e.cd<=0&&d<130){e.st='wind';e.t=.55;e.dir=a;e.tx=p.x;e.ty=p.y;tels.push({type:'circ',own:e,x:p.x,y:p.y,r:12,t:.95,dur:.95,at:1});}}
    else if(e.st==='wind'){e.t-=dt;if(e.t<=0){const dx=e.tx-e.x,dy=e.ty-e.y,l=Math.hypot(dx,dy)||1;projs.push({x:e.x,y:e.y-6,vx:dx/l*Math.min(130,l/.4),vy:dy/l*Math.min(130,l/.4),dmg:e.dmg,en:1,life:.42,glob:1,poison:3.5,puddle:1});e.st='rec';e.t=.5;e.cd=2.2+rnd();}}
    else{e.t-=dt;if(e.t<=0)e.st='move';}
    break;

    if(e.st==='move'){chase(e,dt,e.spd,d>30?a+Math.sin(T*6+e.x)*.6:a+Math.PI/2*e.sd);if(d<56&&e.cd<=0){e.st='wind';e.t=.35;e.dir=a;tels.push({type:'line',x:e.x,y:e.y-3,a,len:56,w:7,t:.35,dur:.35,own:e,fixed:1});}}
    else if(e.st==='wind'){e.t-=dt;if(e.t<=0){e.st='dash';e.t=.22;e.hit=0;}}
    else if(e.st==='dash'){e.t-=dt;move(e,Math.cos(e.dir)*260*dt,Math.sin(e.dir)*260*dt);e.face=Math.cos(e.dir)>=0?1:-1;if(!e.hit&&d<e.r+p.r+3){e.hit=1;hurt(e.dmg);poisonP(3);}if(e.t<=0){e.st='back';e.t=.6;e.cd=1.4+rnd();}}

function s2x(rows){const h=rows.length,w=Math.max(...rows.map(r=>r.length)),at=(x,y)=>(x<0||y<0||x>=w||y>=h)?'.':(rows[y][x]||'.'),out=[];
  for(let y=0;y<h;y++){let a='',b='';for(let x=0;x<w;x++){const P=at(x,y),A=at(x,y-1),B=at(x+1,y),C=at(x-1,y),D=at(x,y+1);
    const e0=C===A&&C!==D&&A!==B?A:P,e1=A===B&&A!==C&&B!==D?B:P,e2=D===C&&D!==B&&C!==A?C:P,e3=B===D&&B!==A&&D!==C?D:P;a+=e0+e1;b+=e2+e3;}out.push(a,b);}return out;}

function mineTerrain(r,c){const T=r.th,{g,ft,W}=c,rn=c.rnd;
  const pool=(n,rmin,rmax)=>{for(let k=0;k<n;k++){const px=r.x0+2+(rn()*Math.max(1,r.w-4)|0),py=r.y0+2+(rn()*Math.max(1,r.h-4)|0);if(Math.abs(px-r.cx)<3&&Math.abs(py-r.cy)<3)continue;const rr=rmin+rn()*(rmax-rmin);
    for(let y=py-3;y<=py+3;y++)for(let x=px-3;x<=px+3;x++){if(x<r.x0||y<r.y0||x>=r.x0+r.w||y>=r.y0+r.h)continue;const k2=y*W+x;if(g[k2]!==0)continue;const dd=Math.hypot(x-px,y-py);if(dd<rr)g[k2]=3;else if(dd<rr+1)g[k2]=4;}}};
  if(T==='slag')pool(2+(rn()*2|0),1,2);if(T==='cavern'&&rn()<.35)pool(1,1,1.6);if(T==='vein'&&rn()<.2)pool(1,.8,1.4);}
function mineDress(r,c){const T=r.th,{place,decor,rnd:rn}=c,X=()=>r.x0+rn()*r.w,Y=()=>r.y0+rn()*r.h;
  if(T==='shaft'){for(let n=0;n<3;n++)decor.push(['crack',X(),Y()]);if(rn()<.5)place(r,'lamp',{});if(rn()<.25)place(r,'cart',{});}
  if(T==='cavern'){for(let n=0;n<2+(rn()*2|0);n++)place(r,'ore',{});for(let n=0;n<2;n++)decor.push(['crack',X(),Y()]);}
  if(T==='rail'){const y=r.cy+(rn()<.5?-1:1);for(let x=r.x0;x<r.x0+r.w;x++)decor.push(['rail',x,y]);place(r,'cart',{});if(rn()<.5)place(r,'cart',{});if(rn()<.5)place(r,'lamp',{});}
  if(T==='vein'){for(let n=0;n<3+(rn()*2|0);n++)place(r,'ore',{});for(let n=0;n<2;n++)place(r,'crystal',{seed:(rn()*1e6)|0});}
  if(T==='slag'){for(let n=0;n<7;n++)decor.push(['ember',X(),Y()]);for(let n=0;n<3;n++)decor.push(['crack',X(),Y()]);if(rn()<.6)place(r,'ore',{});}
  if(T==='forge'){place(r,'forge',{});for(let n=0;n<1+(rn()*2|0);n++)place(r,'anvil',{});if(rn()<.6)place(r,'lamp',{});for(let n=0;n<3;n++)decor.push(['ember',X(),Y()]);}
  if(T==='ward'){place(r,'forge',{});place(r,'anvil',{});if(rn()<.7)place(r,'lamp',{});}}
function genWarden(d){SW=18;SH=30;const s=genArena(d,{ft:5,wt:3,lava:1,boss:'warden',put:[[4,8,'forge'],[13,8,'forge'],[4,21,'anvil'],[13,21,'cart'],[3,14,'lamp'],[14,14,'lamp']],decor:'mine'});return s;}
function genGrena(d){SW=18;SH=30;const s=genArena(d,{ft:8,wt:3,lava:1,boss:'grena',put:[[4,7,'forge'],[13,7,'forge'],[3,15,'forge'],[14,15,'forge'],[5,22,'anvil'],[12,22,'anvil']],decor:'mine'});return s;}

// 共鳴:系統の数(力のレベルの合計)が3と6に達すると効く
const RESO={
  blade:[[3,'傷 +10%',p=>p.upDmg+=.1],[6,'会心 +10%',p=>p.critUp+=.1]],
  crys:[[3,'礫 +1発',p=>p.shard+=1],[6,'礫の間隔 -40%',p=>p.shardRate=.6]],
  frost:[[3,'遅くする力 +15%',p=>p.slowHit=Math.max(p.slowHit,.3)+.15],[6,'斬撃の2割で凍らせる',p=>p.freezeHit=.2]],
  blood:[[3,'倒すたびHP +2',p=>p.killHeal=2],[6,'回復量 2倍',p=>p.healMul=2]],
  wind:[[3,'足 +10%',p=>p.upMove*=1.1],[6,'攻撃の間隔 -10%',p=>p.upCd*=.9]],
};
function tagCount(p){const c={};for(const k in p.ups){for(const t of POW[k].t)c[t]=(c[t]||0)+p.ups[k];}return c;}
function powerBase(p){Object.assign(p,{upDmg:1,upCd:1,upRange:0,upMove:1,upHp:p.upHpKeep||0,thorn:0,shard:0,roomHeal:0,echo:0,critUp:0,critMul:2,execute:0,shatter:0,resonate:0,slowHit:0,trail:0,brittle:0,winter:0,leechUp:0,lastStand:p.lastStandUsed?0:0,berserk:0,stepIn:0,afterImg:0,shardRate:1,freezeHit:0,killHeal:0,healMul:1});}
// 力を取り直したときに全部計算し直す(重ね順の影響をなくす)
function applyPowers(p){const keepHp=p.hp;const ups=p.ups;powerBase(p);p.upHp=0;
  for(const k in ups){const P0=POW[k];for(let i=0;i<ups[k];i++){p.ups={...ups,[k]:i};if(k==='tough'){p.upHp+=10;}else if(k==='shatter'){p.shatter=i+1;}else if(k==='shield'){p.shieldCd=i>=1?5:8;}else P0.f(p);}}
  p.ups=ups;if(ups.laststand&&!p.lastStandUsed)p.lastStand=1;
  const tc=tagCount(p);p.reso=[];for(const t in RESO)for(const [n,txt,f] of RESO[t])if((tc[t]||0)>=n){f(p);p.reso.push(TAGS[t].n+n+'：'+txt);}
  recalc(p);p.hp=Math.min(p.max,keepHp);}
function offerPowers(p,rare){const pool=[];for(const k in POW){const l=p.ups[k]||0;if(l>=POW[k].max)continue;let w=POW[k].r?(rare?3:1):4;
    // 持っている系統は出やすく(シナジーを組みやすく)
    const tc=tagCount(p);for(const t of POW[k].t)if(tc[t])w+=2;if(l)w+=2;for(let i=0;i<w;i++)pool.push(k);}
  const pick=[];while(pick.length<3&&pool.length){const k=pool[rnd()*pool.length|0];if(!pick.includes(k))pick.push(k);for(let i=pool.length-1;i>=0;i--)if(pool[i]===k)pool.splice(i,1);}return pick;}

const PFX=(()=>{let gl=null,cvs=null,on=false,W=1,H=1,S=1,DPR=1,prog={},tex={},fb={},buf=null;
  const VS='attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
  const FS={
    comp:`precision mediump float;varying vec2 v;uniform sampler2D sc,li;uniform vec2 px;
      void main(){vec3 b=texture2D(sc,v).rgb;vec3 L=texture2D(li,v).rgb*2.0;
        float e=smoothstep(.72,.95,b.b)*smoothstep(.68,.9,b.g)*smoothstep(.08,.22,b.b-b.r);
        vec3 c=b*L+L*L*.025+b*e*.45;gl_FragColor=vec4(c*.5,1.);}`,
    bright:`precision mediump float;varying vec2 v;uniform sampler2D t;void main(){vec3 c=texture2D(t,v).rgb*2.;float l=max(c.r,max(c.g,c.b));gl_FragColor=vec4(c*smoothstep(.8,1.35,l)*.5,1.);}`,
    blur:`precision mediump float;varying vec2 v;uniform sampler2D t;uniform vec2 d;
      void main(){vec4 s=texture2D(t,v)*.2270;s+=(texture2D(t,v+d*1.385)+texture2D(t,v-d*1.385))*.3162;s+=(texture2D(t,v+d*3.231)+texture2D(t,v-d*3.231))*.0703;gl_FragColor=s;}`,
    fin:`precision mediump float;varying vec2 v;uniform sampler2D t,bl;uniform float asp,str;
      void main(){vec3 c=texture2D(t,v).rgb*2.;vec3 g=texture2D(bl,v).rgb*2.;c+=g*str;
        float l=dot(c,vec3(.299,.587,.114));c=mix(vec3(l),c,1.12);
        c=mix(c*vec3(.86,.92,1.08),c*vec3(1.04,1.,.94),smoothstep(.15,.7,l));
        c=c/(1.+max(l-1.,0.)*.35);
        vec2 q=(v-.5)*vec2(asp,1.);c*=mix(.55,1.,smoothstep(.95,.32,length(q)));gl_FragColor=vec4(c,1.);}`};
  function sh(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
  function mkProg(fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error('link');p.u={};return p;}
  const U=(p,n)=>p.u[n]!==undefined?p.u[n]:(p.u[n]=gl.getUniformLocation(p,n));
  function mkTex(filter){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,filter);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,filter);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t;}
  function mkFb(w,h,filter){const t=mkTex(filter);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);return {f,t,w,h};}
  function freeFb(o){if(!o)return;gl.deleteFramebuffer(o.f);gl.deleteTexture(o.t);}
  function init(){try{cvs=document.createElement('canvas');cvs.id='pfxcv';cvs.style.cssText='position:fixed;left:0;top:0;display:none;touch-action:none';
      const base=document.getElementById('cv');base.parentNode.insertBefore(cvs,base);
      gl=cvs.getContext('webgl',{alpha:false,antialias:false,premultipliedAlpha:false,preserveDrawingBuffer:false});if(!gl)return false;
      for(const k in FS)prog[k]=mkProg(FS[k]);
      buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
      tex.sc=mkTex(gl.NEAREST);tex.li=mkTex(gl.LINEAR);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
      return true;}catch(e){gl=null;return false;}}
  function resize(w,h,s){if(!gl)return;W=w;H=h;S=s;DPR=Math.min(window.devicePixelRatio||1,2);cvs.width=Math.round(W*S*DPR);cvs.height=Math.round(H*S*DPR);cvs.style.width=W*S+'px';cvs.style.height=H*S+'px';
    for(const k of ['a','b','c'])freeFb(fb[k]);fb.a=mkFb(W,H,gl.NEAREST);const hw=Math.max(1,W>>1),hh=Math.max(1,H>>1);fb.b=mkFb(hw,hh,gl.LINEAR);fb.c=mkFb(hw,hh,gl.LINEAR);}
  function pass(p,target,binds,uni){gl.bindFramebuffer(gl.FRAMEBUFFER,target?target.f:null);gl.viewport(0,0,target?target.w:cvs.width,target?target.h:cvs.height);gl.useProgram(p);
    let i=0;for(const n in binds){gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,binds[n]);gl.uniform1i(U(p,n),i);i++;}
    for(const n in uni||{}){const v=uni[n];if(typeof v==='number')gl.uniform1f(U(p,n),v);else gl.uniform2f(U(p,n),v[0],v[1]);}

  function draw(scene,light,bloomStr){if(!gl)return;
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex.sc);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,scene);

  return {init,resize,draw,setEnabled,get ok(){return !!gl;},get on(){return on;}};})();

function genSectionOld(d){
  for(let tries=0;tries<60;tries++){const g=new Uint8Array(SW*SH);const at=(x,y)=>g[y*SW+x];const set=(x,y,v)=>{g[y*SW+x]=v;};
    for(let y=0;y<SH;y++)for(let x=0;x<SW;x++)if(x===0||y===0||x===SW-1||y===SH-1)set(x,y,1);
    const kind=d===1?'warehouse':d===2?(rnd()<.5?'market':'warehouse'):d<=4?(rnd()<.65?'wharf':'market'):'market';
    const side=rnd()<.5?0:1,wx0=side?SW-7:1,wx1=side?SW-2:6;
    let exitX=2+(rnd()*(SW-5)|0);if(kind==='wharf')exitX=side?2+(rnd()*6|0):8+(rnd()*7|0);set(exitX,0,0);set(exitX+1,0,0);

    const nb=kind==='market'?2+(rnd()*2|0):kind==='wharf'?3+(rnd()*2|0):5+(rnd()*4|0);for(let i=0;i<nb;i++){const w=3+(rnd()*4|0),h=2+(rnd()*3|0),x0=1+(rnd()*(SW-w-1)|0),y0=3+(rnd()*(SH-h-8)|0);
      for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)if(at(x,y)!==3)set(x,y,1);}
    // 入口のまわりと出口の前は空ける
    for(let y=SH-5;y<SH-1;y++)for(let x=6;x<12;x++)set(x,y,0);for(let y=1;y<4;y++)for(let x=exitX-1;x<=exitX+2;x++)if(x>0&&x<SW-1)set(x,y,0);

    while(q.length){const [x,y]=q.shift();if(y===0){reach=1;}for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){const xx=x+a,yy=y+b;if(xx<0||yy<0||xx>=SW||yy>=SH)continue;const k=yy*SW+xx;if(seen[k]||g[k]===1||g[k]===3)continue;seen[k]=1;q.push([xx,yy]);}}

    if(kind!=='wharf')for(let i=0;i<3;i++){const w=3+(rnd()*5|0),h=2+(rnd()*4|0),x0=1+(rnd()*(SW-w-1)|0),y0=2+(rnd()*(SH-h-3)|0);for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)plank[y*SW+x]=1;}

function drawNum(str,x,y,col){str=String(str);const w=str.length*4-1;x=Math.round(x-w/2);y=Math.round(y);
  for(const pass of [0,1])for(let i=0;i<str.length;i++){const m=DG[str[i]];if(!m)continue;for(let k=0;k<15;k++)if(m[k]==='1'){const px=x+i*4+k%3,py=y+(k/3|0);
    if(pass===0){cx.fillStyle='#0b0a18';cx.fillRect(px-1,py,3,1);cx.fillRect(px,py-1,1,3);}else{cx.fillStyle=col;cx.fillRect(px,py,1,1);}}}}

  cx.strokeStyle=col;cx.lineWidth=1;cx.beginPath();cx.arc(x+.5,y+.5,r,-Math.PI/2,-Math.PI/2+Math.PI*2*k);cx.stroke();}

    if(e.markT>0){cx.fillStyle='#8fd6f0';cx.fillRect(x-1,y-e.r*2-12,3,3);cx.fillStyle='#e8fcff';cx.fillRect(x,y-e.r*2-12,1,1);}}

function drawAbove(){  for(const f of fx){const k=f.t/f.dur;if(f.type==='spike'){const h=k<.2?k/.2:1,s=spr('spike',SPIKE,OBJ_PAL).c;cx.globalAlpha=k>.7?(1-k)/.3:1;const hh=Math.max(1,Math.round(s.height*h));cx.drawImage(s,0,s.height-hh,s.width,hh,Math.round(f.x-ox-s.width/2),Math.round(f.y-oy-hh+2),s.width,hh);cx.globalAlpha=1;}

  for(const q of projs){const x=Math.round(q.x-ox),y=Math.round(q.y-oy);if(q.glob){const k=Math.min(1,(q.age||0)/((q.age||0)+Math.max(.01,q.life))),hy=Math.round(Math.sin(k*Math.PI)*(q.big?26:18));cx.fillStyle='rgba(0,0,0,.3)';cx.fillRect(x-2,y,4,1);cx.fillStyle='#24442a';cx.fillRect(x-2,y-hy-2,5,5);cx.fillStyle='#9ae07a';cx.fillRect(x-1,y-hy-1,3,3);cx.fillStyle='#e0ffc0';cx.fillRect(x-1,y-hy-1,1,1);continue;}if(q.stone){cx.fillStyle='#1a1424';cx.fillRect(x-2,y-2,4,4);cx.fillStyle='#8a8494';cx.fillRect(x-1,y-1,2,2);continue;}if(q.wave){const c=Math.cos(q.a),sn=Math.sin(q.a);for(let i=-4;i<=4;i++){const bx=x-sn*i-c*Math.abs(i)*.5,by=y+c*i-sn*Math.abs(i)*.5;cx.fillStyle=Math.abs(i)>3?'#2a6a7a':'#8fd6f0';cx.fillRect(Math.round(bx),Math.round(by),2,2);}cx.fillStyle='#e8fcff';cx.fillRect(x,y,2,2);continue;}if(q.ember){cx.fillStyle='#3a1208';cx.fillRect(x-2,y-2,4,4);cx.fillStyle=(T*20|0)%2?'#ffd27a':'#ff9a3a';cx.fillRect(x-1,y-1,2,2);continue;}if(q.anvil){cx.fillStyle='#14121a';cx.fillRect(x-5,y-4,11,8);cx.fillStyle='#6e6878';cx.fillRect(x-4,y-3,9,3);cx.fillStyle='#a8a2b4';cx.fillRect(x-4,y-3,9,1);cx.fillStyle='#4a4452';cx.fillRect(x-2,y,5,3);continue;}if(q.knife){cx.fillStyle='#1a1424';cx.fillRect(x-2,y-1,5,3);cx.fillStyle='#c8d0dc';cx.fillRect(x-1,y,3,1);continue;}if(q.en){cx.fillStyle='#0b1428';cx.fillRect(x-2,y-2,5,5);cx.fillStyle=(T*20|0)%2?'#ffffff':'#8fd6f0';cx.fillRect(x-1,y-1,3,3);}else{cx.fillStyle='#e8fcff';cx.fillRect(x-1,y,3,1);cx.fillRect(x,y-1,1,3);}}
  return !!(fx.length||projs.length);}
function drawTels(){  // 予兆
  for(const t of tels){const k=1-t.t/t.dur,pul=.55+.45*Math.sin(T*22);cx.fillStyle='#ff3b4a';
    if(t.type==='line'){cx.save();cx.translate(Math.round(t.x-ox),Math.round(t.y-oy));cx.rotate(t.a);cx.globalAlpha=.16;cx.fillRect(0,-t.w/2,t.len,t.w);cx.globalAlpha=.35;cx.fillRect(0,-t.w/2,t.len*k,t.w);
      cx.globalAlpha=.7*pul;cx.fillRect(0,-t.w/2,t.len,1);cx.fillRect(0,t.w/2-1,t.len,1);cx.restore();}

// ---- 記録の書き出し・読み込み(端末どうしで記録を移す) ----
// 書き出し:JSON → (縮められるなら deflate で縮めて) → base64。末尾に検査用の数字を付けて、途中で切れたら分かるようにする
const b64e=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s);};
const b64d=t=>{const bin=atob(t),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;};
const ck=t=>{let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return h.toString(36);};
async function pipeBytes(u,stream){const s=new Blob([u]).stream().pipeThrough(stream);return new Uint8Array(await new Response(s).arrayBuffer());}
async function encSave(){const raw=new TextEncoder().encode(JSON.stringify(save));let body,tag='RR1';
  try{if(typeof CompressionStream!=='undefined'){body=b64e(await pipeBytes(raw,new CompressionStream('deflate-raw')));tag='RR2';}}catch(e){}
  if(!body)body=b64e(raw);return tag+':'+body+'.'+ck(body);}
async function decSave(t){t=(t||'').replace(/[\s​]/g,'');const m=t.match(/(RR[12]):([A-Za-z0-9+/=]+)(?:\.([a-z0-9]+))?/);if(!m)throw {why:'「RR」から始まる文字列が見つからない'};
  const [,tag,body,sum]=m;if(sum&&ck(body)!==sum)throw {why:'途中で切れている（'+body.length+'文字）。全部をコピーし直して'};if(!sum&&tag==='RR2')throw {why:'最後まで貼り付けられていない（'+body.length+'文字）'};
  let u=b64d(body);if(tag==='RR2'){if(typeof DecompressionStream==='undefined')throw {why:'この端末では読み込めない形式'};u=await pipeBytes(u,new DecompressionStream('deflate-raw'));}
  let o;try{o=JSON.parse(new TextDecoder().decode(u));}catch(e){throw {why:'途中で切れている（'+body.length+'文字）。全部をコピーし直して'};}if(!o||!o.stash||!o.eq)throw {why:'記録の中身が足りない'};return o;}

  if(save.bossKills>0)save.flags.captDown=1;if(save.tasks.s6==='done')save.flags.met_scholar=1;
for(const t of TASKS)if(taskSt(t.id)==='done'&&t.rw.open)for(const c of t.rw.open)if(taskSt(c)==='locked')save.tasks[c]='offer';checkUnlocks();}

function taskProg(t){if(t.type==='deliver')return save.stash.filter(i=>i.name===t.item).length;return save.prog[t.id]||0;}
function countKill(kind){for(const t of TASKS)if(t.type==='kill'&&t.enemy===kind&&taskSt(t.id)==='active'){save.prog[t.id]=Math.min(t.n,(save.prog[t.id]||0)+1);if(save.prog[t.id]>=t.n){save.tasks[t.id]='ready';toast(t.name+' 完了','#ffd27a');}}}
function checkReach(ok,d,log){if(!ok)return;for(const t of TASKS)if(t.type==='reach'&&taskSt(t.id)==='active'&&(t.st||'shore')===(log.stage||'shore')&&d>=t.depth&&(!t.boss||log[t.boss===1?'captain':t.boss]))save.tasks[t.id]='ready';}

function reward(t){const r=t.rw,got=[];save.tasks[t.id]='done';
  if(r.coins){save.coins+=r.coins;got.push('古銭 '+r.coins);}if(r.exp){const c=Math.round(r.exp*.6);save.coins+=c;got.push('古銭 '+c+'（礼金）');}
  if(r.bag){save.bagMax=(save.bagMax||12)+r.bag;got.push('リュック +'+r.bag+'枠');}
  if(r.item){const it=FIXED[r.item]();save.stash.unshift(it);got.push(it.name+'（倉庫へ）');}
  if(r.search){save.searchLv=(save.searchLv||0)+r.search;got.push('漁りが速くなった（'+save.searchLv+'/5段）');}
  if(r.route){save.route=(save.route||0)+r.route;got.push('王都への道を知った（'+save.route+'/4）');}
  if(r.potions)for(let i=0;i<r.potions;i++)save.stash.unshift(makePotion(true));if(r.potions)got.push('上等な薬 ×'+r.potions);
  if(r.flag){save.flags[r.flag]=1;got.push({forge:'鍛え直しを頼めるようになった',bossKey:'封鎖門の鍵を手に入れた',woodKey:'柵の合言葉を知った',mineKey:'昇降機が動くようになった'}[r.flag]||'');if(r.flag==='forge')got.push('新しい型の武器が出回るようになった（斧・槌など）');}
  if(r.shop){save.shops[r.shop[0]]=r.shop[1];save.shopRun=-1;got.push(PEOPLE[r.shop[0]].n.split(' ').pop()+'の品が増えた');}
  if(r.meet){save.flags['met_'+r.meet]=1;got.push(PEOPLE[r.meet].n+' と知り合った');}
  for(const id of r.open||[])if(taskSt(id)==='locked')save.tasks[id]='offer';
  checkUnlocks();persist();return got.filter(Boolean);}

  if(ok){save.extracts++;const room=STASHMAX-save.stash.length;const back=keepBag.slice(0,room);save.stash=back.concat(save.stash);save.coins+=P.coins+sold;save.eq.weapon=P.eq.weapon;save.eq.armor=P.eq.armor;save.bag=[];}
  else{save.eq={weapon:STARTER(),armor:null};save.bag=[];}
  persist();
  const lostEq=[P.eq.weapon,P.eq.armor].filter(i=>i&&!i.starter);
  scr(`<h2>${ok?'帰還した':'結晶になった'}</h2><p class="cen small">${secName(depth)} まで</p>
  ${ok?`<div class="tally"><div><span>拾った古銭</span><b>+${P.coins}</b></div><div><span>売った物（${soldN}）</span><b>+${sold}</b></div></div><p class="cen" style="color:#ffd27a">古銭 +${P.coins+sold}</p>`:`<p class="cen">古銭 ${P.coins} を失った</p>`}
  ${ok?`<h3>持ち帰った物（${keepBag.length}）</h3>`:`<h3>失った物</h3>`}<div class="grid">${(ok?keepBag:lostEq.concat(P.bag)).map(it=>`<div class="cell r${it.rarity}">${icoHTML(it)}</div>`).join('')||'<span class="small">なし</span>'}</div>
  <button class="btn" id="b-camp2" type="button">宿営地へ</button>`,true);paintIcons($('scr'),lostEq.concat(P.bag));$('b-camp2').onclick=camp;}

// ---- 力を選ぶ(挑戦中だけの強化) ----
let nextRare=0;
function powerCard(k,i){const P0=POW[k],l=(P.ups[k]||0)+1;return `<button class="up${P0.r?' rare':''}" type="button" data-i="${i}"><b>${P0.n}<small>${l>1?'Lv '+l:'新しい'}${P0.r?' ・ 稀':''}</small></b><span>${P0.d(l)}</span><em>${P0.t.map(t=>`<i style="color:${TAGS[t].c}">${TAGS[t].n}</i>`).join('')}</em></button>`;}
function levelUp(oath){state='level';if(!oath)pendingLv--;joy.on=false;joy.id=null;const rare=nextRare>0;if(rare&&!oath)nextRare--;let pick=offerPowers(P,rare||oath);
  const show=()=>{const tc=tagCount(P);
    scr(`<h2>${oath?'誓いを立てる':rare?'大きな欠片':'欠片が満ちた'}</h2><p class="cen small">${oath?'この出撃の始まりに、力を一つ':'力を一つ選ぶ'}</p><div class="ups">${pick.map(powerCard).join('')}</div>
    <div class="tagrow">${Object.keys(TAGS).map(t=>`<span style="color:${TAGS[t].c}">${TAGS[t].n} ${tc[t]||0}</span>`).join('')}</div>
    ${P.reso.length?`<p class="cen small">共鳴：${P.reso.join(' ／ ')}</p>`:'<p class="cen small">同じ系統を3つ重ねると共鳴する</p>'}
    ${P.rerolls>0?`<button class="btn ghost" id="b-reroll" type="button">選び直す（残り ${P.rerolls}）</button>`:''}`);
    document.querySelectorAll('.up').forEach(b=>b.onclick=()=>{const k=pick[+b.dataset.i];P.ups[k]=(P.ups[k]||0)+1;if(k==='tough')P.hp+=10;if(k==='shield')P.shield=1;applyPowers(P);hudCache='';hideScr();state='play';});
    if($('b-reroll'))$('b-reroll').onclick=()=>{P.rerolls--;pick=offerPowers(P,rare||oath);show();};};
  show();}

// ---- リュック(挑戦中) ----
function toggleBag(){if(state==='play'){state='bag';joy.on=false;joy.id=null;showBag();}else if(state==='bag'){hideScr();state='play';}}
function showBag(sel){const p=P;const swp=bagSwap&&swapK&&!swapK.got?swapK:null;
  scr(`<h2>リュック <small>${p.bag.length}/${bagMax()}</small></h2>${swp?`<div class="swaphead">${itemCard(swp.item,'')}${cmpLine(swp.item)}<p class="cen small">置いていく物を選ぶ${swp.item.type==='weapon'||swp.item.type==='armor'?'（または、そのまま持ち替える）':''}</p>${swp.item.type==='weapon'||swp.item.type==='armor'?'<button class="btn" id="b-swapeq" type="button">持ち替える</button>':''}</div>`:''}
  <div class="eqrow"><div class="eqs"><canvas id="bagHero" width="20" height="22"></canvas><span class="small">守り ${p.def}<br>攻撃 ${Math.round(p.ws.dmg*p.atkM)}</span></div><div class="eqlist">${itemCard(p.eq.weapon,'')}${p.eq.armor?itemCard(p.eq.armor,''):'<div class="card empty">防具なし</div>'}</div></div>
  <div class="grid">${Array.from({length:bagMax()},(_,i)=>{const it=p.bag[i];return it?`<button class="cell r${it.rarity}${sel===it.id?' sel':''}" data-b="${it.id}">${icoHTML(it)}</button>`:'<div class="cell empty"></div>';}).join('')}</div>
  <div id="bagDetail"></div><button class="btn" id="b-close" type="button">閉じる</button>`,true);
  paintIcons($('scr'),[p.eq.weapon,p.eq.armor,...p.bag,swp&&swp.item].filter(Boolean));$('bagHero').getContext('2d').drawImage(toCanvas(charFrame(armorKey(),'down','idle',0)),0,0);
  const takeSwap=(dropIt)=>{const k=swp;if(!k||k.got)return;if(dropIt){const i=p.bag.indexOf(dropIt);p.bag.splice(i,1,k.item);picks.push({x:p.x,y:p.y+6,vx:0,vy:20,kind:'item',item:dropIt,t:-1,warned:1});}
    else{const old=k.item.type==='weapon'?p.eq.weapon:p.eq.armor;if(k.item.type==='weapon')p.eq.weapon=k.item;else p.eq.armor=k.item;recalc(p);if(old&&!old.starter)picks.push({x:p.x,y:p.y+6,vx:0,vy:20,kind:'item',item:old,t:-1,warned:1});}
    k.got=true;runLoot.push(k.item);toast(k.item.name,RAR[k.item.rarity].c);bagSwap=false;swapK=null;$('swapb').classList.add('hide');hudCache='';hideScr();state='play';};
  if(swp){document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>takeSwap(p.bag.find(i=>i.id===b.dataset.b)));if($('b-swapeq'))$('b-swapeq').onclick=()=>takeSwap(null);}
  else document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>bagPick(b.dataset.b));
  $('b-close').onclick=()=>{bagSwap=false;toggleBag();};if(sel)bagPick(sel,true);}
let bagSwap=false;
function cmpLine(it){if(!P)return '';if(it.type==='weapon'){const a=wstats(it).dmg,b=wstats(P.eq.weapon).dmg,d=a-b;return `<p class="cmp">攻撃 ${a}　今 ${b}　<b style="color:${d>0?'#8ff0a4':d<0?'#ff8a8a':'#b7bddb'}">${d>0?'▲+'+d:d<0?'▼'+d:'±0'}</b></p>`;}
  if(it.type==='armor'){const df=x=>x?Math.round(ARMOR[x.kind].def*(1+x.rarity*.25))+((x.traits||[]).filter(t=>t.k==='def').reduce((s,t)=>s+t.v,0)):0;const a=df(it),b=df(P.eq.armor),d=a-b;return `<p class="cmp">守り ${a}　今 ${b}　<b style="color:${d>0?'#8ff0a4':d<0?'#ff8a8a':'#b7bddb'}">${d>0?'▲+'+d:d<0?'▼'+d:'±0'}</b></p>`;}return '';}
function bagPick(id,noRe){const p=P,it=p.bag.find(i=>i.id===id);if(!it)return;if(!noRe){showBag(id);return;}const acts=[];
  if(it.type==='weapon')acts.push(['equip','持ち替える']);if(it.type==='armor')acts.push(['equip','着る']);if(it.type==='potion')acts.push(['use','使う']);acts.push(['drop','捨てる']);
  $('bagDetail').innerHTML=itemCard(it,'')+cmpLine(it)+`<div class="acts big2">${acts.map(([k,n])=>`<button class="btn${k==='drop'?' ghost':''}" data-a="${k}">${n}</button>`).join('')}</div>`;paintIcons($('bagDetail'),[it]);
  $('bagDetail').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a,i=p.bag.indexOf(it);
    if(a==='equip'){p.bag.splice(i,1);if(it.type==='weapon'){const old=p.eq.weapon;p.eq.weapon=it;if(!old.starter)p.bag.splice(i,0,old);}else{const old=p.eq.armor;p.eq.armor=it;if(old)p.bag.splice(i,0,old);}recalc(p);}
    if(a==='use'){p.bag.splice(i,1);heal(potHeal(it));if(it.cure)p.poison=0;}
    if(a==='drop'){p.bag.splice(i,1);picks.push({x:p.x,y:p.y+6,vx:0,vy:20,kind:'item',item:it,t:-1,warned:1});}
    hudCache='';showBag();});}
function togglePause(){if(state==='play'){state='pause';snapRun();joy.on=false;joy.id=null;scr(`<h2>一時停止</h2><p class="cen small">潮の岸 区画 ${depth}</p><button class="btn" id="b-res" type="button">続ける</button><button class="btn ghost" id="b-quit" type="button">あきらめる（すべて失う）</button>`,true);
    $('b-res').onclick=togglePause;$('b-quit').onclick=()=>{hideScr();state='play';P.dead=true;endRun(false);};}
  else if(state==='pause'){hideScr();state='play';}}
$('pause').onclick=togglePause;$('bagb').onclick=toggleBag;$('swapb').onclick=()=>{if(state!=='play'||!swapK)return;const k=swapK,p=P;
  if(k.item.type==='potion'){let lo=null;for(const it of p.bag)if(it.type==='valuable'&&(!lo||it.value<lo.value))lo=it;
    if(lo){p.bag.splice(p.bag.indexOf(lo),1,k.item);k.got=true;runLoot.push(k.item);picks.push({x:p.x+(rnd()-.5)*10,y:p.y+8,vx:0,vy:10,kind:'item',item:lo,t:-1,warned:1,dropped:1});toast(k.item.name+'（'+lo.name+' '+lo.value+' と入れ替え）',RAR[k.item.rarity].c);swapK=null;$('swapb').classList.add('hide');hudCache='';return;}}
  bagSwap=true;toggleBag();};$('mm').onclick=()=>{mmBig=!mmBig;mmT=0;};
$('potb').onclick=()=>{if(state!=='play'||!P||P.dead)return;let i=P.poison>0?P.bag.findIndex(it=>it.cure):-1;if(i<0)i=P.bag.findIndex(it=>it.type==='potion'&&!it.cure);if(i<0)i=P.bag.findIndex(it=>it.type==='potion');if(i<0){toast('薬草がない','#ff9a8a');return;}const it=P.bag.splice(i,1)[0];heal(potHeal(it));if(it.cure)P.poison=0;hudCache='';};
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='play')togglePause();else snapRun();}});addEventListener('pagehide',()=>snapRun());

// ===================== ループ =====================
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;
  if(state==='play'){if(hs>0)hs-=dt;else update(dt*slow);}
  render();hud();drawToasts();drawMinimap(dt);requestAnimationFrame(frame);}
applyHand();title();requestAnimationFrame(frame);setTimeout(cloudInit,0);
window.__g={get P(){return P;},get enemies(){return enemies;},get state(){return state;},get sec(){return sec;},get depth(){return depth;},get save(){return save;},get picks(){return picks;},
  setGod(v){god=v;},camp,startRun,nextSection:()=>nextSection(),killAll(){enemies.forEach(e=>{e.hp=0;kill(e);});},
  tp(x,y){P.x=x;P.y=y;},openAll(){for(const o of sec.objs)if('opened' in o&&!o.opened)openContainer(o);},extract,levelPick(){const b=document.querySelector('.up');if(b)b.click();}};


</script>
